ela família"],"a":0,"e":"Na **socialização primária** a criança interioriza o mundo pelos **outros significativos**, que ela não escolhe, com forte carga emocional. O que mais se interioriza é a linguagem.","c":"Socialização primária (Berger e Luckmann)","pista":"infância, pais, o mundo aprendido com emoção"},{"p":1,"trecho":"aquilo não era um jeito de viver entre outros: era o único mundo possível","q":"Por que, segundo os autores, esse mundo da infância fica tão firme?","o":["porque é aceito como O mundo, e não como um mundo possível","porque a criança escolhe os próprios outros significativos","porque é aprendido com pouca emoção","porque é ensinado por agentes substituíveis","porque vem depois da socialização secundária"],"a":0,"e":"O mundo da infância é aceito **não como um mundo possível, mas como O mundo** (o “conto do vigário” da sociedade). Por isso fica entrincheirado e faz parecer necessário o que é contingente.","c":"O mundo da infância como O mundo (Berger e Luckmann)","pista":"“o único mundo possível”"},{"p":2,"trecho":"já não diz só “a mamãe tá brava comigo agora”. [...] “aqui ninguém pode mexer no fogão”","q":"A mudança na fala de Pedro mostra:","o":["a formação do outro generalizado","uma alternação precoce na infância","a estrutura de plausibilidade da família","o eu público de Lewin se dilatando","a objetivação de Moscovici em ação"],"a":0,"e":"Pedro passou da **mãe concreta** (“tá brava comigo agora”) para a **regra geral** (“ninguém pode”). É o **outro generalizado** (Mead), que marca o fim da socialização primária.","c":"Outro generalizado (Mead, em Berger e Luckmann)","pista":"de “a mamãe tá brava comigo” para “ninguém pode”"},{"p":3,"trecho":"aprendeu termos técnicos, rotinas e regras com supervisoras que mudavam todo mês [...] mas sem a emoção que sentia em casa","q":"O estágio no hospital é um exemplo de:","o":["socialização secundária","socialização primária tardia","alternação","formação do outro generalizado","exteriorização"],"a":0,"e":"**Socialização secundária**: submundos institucionais, **vocabulário próprio** da função, agentes **substituíveis** e anônimos, **pouca emoção**. Por isso é mais frágil que a primária.","c":"Socialização secundária (Berger e Luckmann)","pista":"termos técnicos, chefes que mudam, pouca emoção"},{"p":4,"trecho":"conversa com a mãe por vídeo sobre coisas banais [...] e sente que “o mundo continua no lugar”","q":"O que mantém o mundo de Júlia “no lugar”, segundo Berger e Luckmann?","o":["a conversa, que confirma o mundo por ser casual","a alternação, que reconstrói a realidade inteira","a objetivação, que transforma ideia em imagem concreta","a ancoragem, que dá nome ao que é estranho e novo","a socialização secundária vivida no hospital"],"a":0,"e":"A **conversa** é o principal veículo de **conservação da realidade**. Funciona de forma **implícita**: o papo banal confirma o mundo justamente por ser banal. A frequência reforça.","c":"Conversa (Berger e Luckmann)","pista":"papo banal do dia a dia que confirma o mundo"},{"p":5,"trecho":"passa a ver tudo de outro jeito, troca de amigos, se afasta da igreja e diz que “virou outra pessoa”","q":"A transformação de Júlia é chamada pelos autores de:","o":["alternação","socialização secundária comum","formação do outro generalizado","socialização totalmente bem-sucedida","exteriorização"],"a":0,"e":"**Alternação**: transformação **quase total** da realidade subjetiva, que exige **ressocialização**, novos outros significativos e **afastamento do mundo antigo**. O protótipo é a conversão religiosa.","c":"Alternação (Berger e Luckmann)","pista":"virar outra pessoa, trocar de grupo, afastar-se do mundo antigo"},{"p":5,"trecho":"Só se sente segura das novas ideias quando está com o coletivo; longe dele, as dúvidas voltam.","q":"O coletivo funciona, para Júlia, como:","o":["estrutura de plausibilidade","outro generalizado de Mead","núcleo central de Abric","eu íntimo, no sentido de Lewin","universo reificado de Moscovici"],"a":0,"e":"**Estrutura de plausibilidade**: a **base social** que sustenta uma realidade e permite suspender a dúvida. Longe dela, a nova realidade balança.","c":"Estrutura de plausibilidade (Berger e Luckmann)","pista":"o grupo que sustenta a crença; longe dele, a dúvida volta"}]},{"id":"santarita","titulo":"O vizinho novo de Santa Rita","est":["representacoes"],"texto":["Santa Rita, uma cidade pequena, passou a receber moradores de um programa de saúde mental: pessoas que viveram anos internadas e agora moram em casas de família. Ninguém sabia direito o que era aquilo, e o assunto tomou conta da cidade.","Na padaria, todo mundo dava palpite. “É tipo aqueles doidos do hospício”, dizia seu Zé. As crianças diziam que o seu Antônio, o novo morador, tinha “a cabeça cheia de minhoca”.","Numa reunião, o médico do programa explicou, com dados, que os transtornos não são contagiosos e que os moradores estavam estáveis. Mesmo assim, na casa onde Antônio morava, a família lavava a louça dele separada e guardava as roupas dele em outro armário.","Com o tempo, alguns detalhes mudaram: diziam que ele era “doido, mas trabalhador” ou “doido, mas educado”. Mas a ideia de que “doido é perigoso” continuou firme. Quando a câmara votou contra um centro de convivência, os vereadores explicaram: “a gente sempre soube que eles são perigosos”."],"qs":[{"p":1,"trecho":"Ninguém sabia direito o que era aquilo, e o assunto tomou conta da cidade.","q":"Para Moscovici, todo esse falatório serve para:","o":["tornar familiar o que não é familiar","transformar o senso comum em ciência","eliminar o preconceito pela informação","criar uma teoria testável em laboratório","transformar o grupo numa minoria psicológica"],"a":0,"e":"O novo causa estranhamento e ameaça. A representação social o **incorpora ao senso comum**: **tornar familiar o não familiar**. A memória prevalece sobre a dedução.","c":"Tornar familiar o não familiar (Moscovici)","pista":"algo novo e estranho vira assunto de todo mundo"},{"p":2,"trecho":"“É tipo aqueles doidos do hospício”, dizia seu Zé.","q":"A fala de seu Zé é um exemplo de:","o":["ancoragem","objetivação","fetichismo","outro generalizado","universo reificado"],"a":0,"e":"**Ancoragem** = **classificar e dar nome**: o estranho é comparado a uma categoria conhecida (“tipo os doidos do hospício”) e recebe as características dela. Toda classificação atribui valor.","c":"Ancoragem (Moscovici)","pista":"“é tipo...”: encaixar o novo numa categoria conhecida"},{"p":2,"trecho":"tinha “a cabeça cheia de minhoca”","q":"A imagem usada pelas crianças é um exemplo de:","o":["objetivação","ancoragem","reificação (Lukács)","convencionalização","abstração ideológica"],"a":0,"e":"**Objetivação** = **transformar uma ideia abstrata numa imagem concreta**, como “papai do céu”. Reificação (homens viram coisas) é de Lukács, no texto de Chaui.","c":"Objetivação (Moscovici)","pista":"ideia abstrata vira imagem concreta"},{"p":3,"trecho":"Na padaria, todo mundo dava palpite. [...] o médico do programa explicou, com dados.","q":"A conversa na padaria e a explicação do médico pertencem, respectivamente, ao universo:","o":["consensual e reificado","reificado e consensual","primário e secundário","central e periférico","público e íntimo"],"a":0,"e":"**Consensual**: todos opinam como “amadores”, pela conversa; é onde vivem as representações. **Reificado**: só fala quem tem competência; é o universo da ciência.","c":"Universo consensual x reificado (Moscovici)","pista":"palpite de todo mundo x fala de especialista"},{"p":3,"trecho":"Mesmo assim, na casa onde Antônio morava, a família lavava a louça dele separada e guardava as roupas dele em outro armário.","q":"Esse trecho repete o que Jodelet encontrou em Ainay-le-Château:","o":["a ação mantém a representação, mais que a informação","a informação médica acabou com a representação da cidade","a família passou por uma alternação e mudou de mundo","a dissonância foi resolvida mudando a atitude da família","os moradores formaram uma minoria privilegiada na casa"],"a":0,"e":"Mesmo ouvindo que **não é contagioso**, os moradores mantinham **ritos de separação** (louça e roupa à parte). A **ação** cria e perpetua a representação.","c":"Ritos de separação (Jodelet)","pista":"sabe que não pega, mas separa louça e roupa"},{"p":4,"trecho":"“doido, mas trabalhador” ou “doido, mas educado”. Mas a ideia de que “doido é perigoso” continuou firme.","q":"Pela teoria do núcleo central (Abric), o que aconteceu?","o":["a periferia mudou e protegeu o núcleo, que resistiu","o núcleo mudou e a periferia ficou intacta e resistiu","a representação mudou por inteiro, núcleo e periferia","a periferia é a parte mais estável, e o núcleo, flexível","nada mudou, porque o núcleo central é só individual"],"a":0,"e":"O **núcleo central** (“doido é perigoso”) é estável e resistente. O **sistema periférico** (“mas trabalhador”, “mas educado”) é flexível, absorve o novo e **protege o núcleo**.","c":"Núcleo central x periferia (Abric)","pista":"detalhes mudam, a ideia principal fica"},{"p":4,"trecho":"os vereadores explicaram: “a gente sempre soube que eles são perigosos”","q":"A fala dos vereadores, depois da votação, mostra qual função da representação social?","o":["justificatória","de saber","identitária","de orientação","de neutralidade"],"a":0,"e":"Abric: **saber** (explicar), **identitária** (definir grupos), **orientação** (guiar a conduta, antes) e **justificatória** (justificar **depois** as decisões). Não existe função de neutralidade.","c":"Função justificatória (Abric)","pista":"explicar depois por que decidiu"}]},{"id":"tenis","titulo":"Seu Jorge e o tênis de R$ 900","est":["ideologia"],"texto":["Seu Jorge trabalha numa fábrica de tênis. Em 4 horas de trabalho ele produz o valor equivalente ao seu salário do dia, mas a jornada é de 8 horas. O tênis que ele monta é vendido por R$ 900 numa loja de shopping.","Quando vê o tênis na vitrine, seu Jorge não se reconhece nele: não sente que aquilo é obra sua. Na propaganda, o tênis parece ter vida e poder próprios: “quem usa vira alguém”.","No almoço, um colega comenta: “sempre teve rico e pobre; é a natureza, cada um nasce com seu destino”. O gerente, que nunca pisou na linha de produção, planeja tudo do escritório e escreve os manuais.","Na TV, o governo diz que a lei é igual para todos e que o Estado defende o interesse geral; mas, na greve, a polícia protege a fábrica. Mesmo em greve, muitos operários repetem que “quem se esforça vence” e que “o patrão merece tudo o que tem”."],"qs":[{"p":1,"trecho":"Em 4 horas de trabalho ele produz o valor equivalente ao seu salário do dia, mas a jornada é de 8 horas.","q":"As 4 horas restantes são, para Marx (em Chaui):","o":["a mais-valia: trabalho não pago que vira lucro","o valor de uso: a utilidade que o tênis tem","o fetichismo: o tênis parece ter vida própria","a alienação religiosa, como dizia Feuerbach","a hegemonia: as ideias do patrão viram senso comum"],"a":0,"e":"**Mais-valia** = tempo de trabalho **não pago**. Igual ao exemplo do texto: o produto vale 8 horas, o salário paga 4. A origem do capital é o trabalho não pago.","c":"Mais-valia (Marx, em Chaui)","pista":"trabalhar mais horas do que o salário paga"},{"p":2,"trecho":"seu Jorge não se reconhece nele: não sente que aquilo é obra sua","q":"O que seu Jorge vive diante da vitrine é:","o":["alienação do trabalho","fetichismo da mercadoria","objetivação (Moscovici)","ódio de si (Lewin)","inversão ideológica"],"a":0,"e":"**Alienação**: o produtor **não se reconhece no que produz**. Para Marx, contra Feuerbach, é a alienação fundamental, e é **objetiva**, não um simples erro de consciência.","c":"Alienação (Marx, em Chaui)","pista":"não se reconhecer no que produziu"},{"p":2,"trecho":"Na propaganda, o tênis parece ter vida e poder próprios: “quem usa vira alguém”.","q":"A propaganda mostra o que Chaui chama de:","o":["fetichismo da mercadoria","mais-valia sobre o tênis","alienação religiosa (Feuerbach)","ancoragem (Moscovici)","contradição entre classes"],"a":0,"e":"**Fetichismo**: o produto parece ter **vida e poder próprios**, escondendo o trabalho que o produziu. Junto vem a **reificação**: coisas viram “gente”, e gente vira coisa.","c":"Fetichismo da mercadoria (Chaui)","pista":"o produto parece ter poder próprio"},{"p":3,"trecho":"“sempre teve rico e pobre; é a natureza, cada um nasce com seu destino”","q":"A explicação do colega para a desigualdade é um exemplo de quais operações da ideologia?","o":["abstração e inversão: o efeito vira causa natural","contradição: a negação interna entre as classes","mais-valia: o lucro tirado do trabalho não pago","fetichismo e reificação: coisas viram gente","alienação religiosa: o homem projeta sua essência em Deus"],"a":0,"e":"**Abstração**: tomar a realidade como dada e pronta (“sempre teve”). **Inversão**: tomar o efeito pela causa (“é a natureza”). É o exemplo de Chaui: “somos desiguais porque Deus ou a natureza quis”.","c":"Abstração e inversão (Chaui)","pista":"“sempre foi assim”, “é a natureza”, “Deus quis”"},{"p":3,"trecho":"O gerente, que nunca pisou na linha de produção, planeja tudo do escritório e escreve os manuais.","q":"Para Marx, essa separação está na origem da ideologia porque:","o":["a divisão do trabalho separa quem pensa de quem produz","o gerente forma uma minoria privilegiada, como em Lewin","o gerente exerce sobre todos um poder de conhecimento","o escritório é o universo reificado, e a fábrica, o consensual","o gerente passou por uma socialização secundária mais longa"],"a":0,"e":"Com a **divisão social do trabalho**, quem produz ideias fica longe da produção material, e as ideias **parecem independentes** do mundo real. Daí nasce a ideologia.","c":"Origem da ideologia: divisão do trabalho (Marx)","pista":"quem pensa e planeja fica longe de quem produz"},{"p":4,"trecho":"o Estado defende o interesse geral; mas, na greve, a polícia protege a fábrica","q":"Para Marx, segundo Chaui, esse Estado é:","o":["uma comunidade ilusória, a serviço da classe dominante","a síntese harmoniosa de todos os interesses, como em Hegel","um árbitro neutro, que fica acima das classes","a expressão do Espírito que se realiza na história","uma maioria psicológica, que decide pelo resto"],"a":0,"e":"O Estado aparece como **representante do interesse geral**, mas preserva os interesses da **classe dominante**, de forma impessoal, pelas leis. Estado como síntese é a visão de **Hegel**.","c":"Estado como comunidade ilusória (Marx)","pista":"“a lei é igual para todos”, mas protege um lado"},{"p":4,"trecho":"Mesmo em greve, muitos operários repetem que “quem se esforça vence” e que “o patrão merece tudo o que tem”.","q":"Esse trecho ilustra:","o":["a hegemonia (Gramsci)","a consciência de classe (Lane)","a mais-valia","a alternação","a reatância psicológica"],"a":0,"e":"**Hegemonia**: o poder espiritual da classe dominante faz as pessoas **manterem as ideias dominantes mesmo lutando contra ela**. Consciência de classe seria justamente questionar essas ideias.","c":"Hegemonia (Gramsci, em Chaui)","pista":"lutar contra o patrão repetindo as ideias do patrão"}]},{"id":"callcenter","titulo":"Bruna, a nova atendente","est":["identidade","linguagem"],"texto":["Bruna começou a trabalhar num call center. No primeiro dia aprendeu as regras: horário de pausa, roteiro de fala, roupa adequada. A supervisora só age como supervisora porque há atendentes para supervisionar, e os atendentes só são atendentes porque alguém os supervisiona.","Quando perguntam “quem é você?”, Bruna já responde: “sou atendente, da equipe da Lúcia”. Ela acha que nasceu para aquilo e que escolheu livremente esse caminho, sem perceber que foi a falta de outras vagas no bairro que a levou até ali.","A empresa chama todos de “colaboradores” e repete que ali “somos uma família”. Quando alguém reclama do salário, o gerente responde: “família não fala de dinheiro”, e a conversa acaba ali.","Meses depois, nas pausas, Bruna e as colegas começam a discutir por que o trabalho é organizado daquele jeito, quem ganha com isso e o que poderiam mudar juntas. Agora, sempre que ouve a palavra, Bruna pergunta: “família em que sentido?”."],"qs":[{"p":1,"trecho":"A supervisora só age como supervisora porque há atendentes para supervisionar, e os atendentes só são atendentes porque alguém os supervisiona.","q":"Para Lane, o trecho mostra que os papéis sociais são:","o":["complementares: um só tem sentido pelo outro","naturais, definidos pela personalidade de cada um","livres, escolhidos por cada pessoa conforme o gosto","hereditários, passados de pais para filhos","iguais em todas as sociedades e em todas as épocas"],"a":0,"e":"Os **papéis** são **complementares**: “para agir como chefe é preciso haver chefiados” que deem sentido à ação. E são definidos por **normas** do grupo.","c":"Papéis complementares (Lane)","pista":"um papel só existe porque existe o outro"},{"p":2,"trecho":"Quando perguntam “quem é você?”, Bruna já responde: “sou atendente, da equipe da Lúcia”.","q":"A resposta de Bruna revela sua:","o":["identidade social","representação social","consciência de classe","socialização primária","atitude"],"a":0,"e":"Para Lane, **identidade social** é o que respondemos quando perguntam “quem é você?”: o conjunto de **papéis** que desempenhamos.","c":"Identidade social (Lane)","pista":"responder “quem é você?” com papéis"},{"p":2,"trecho":"Ela acha que nasceu para aquilo e que escolheu livremente esse caminho, sem perceber que foi a falta de outras vagas no bairro que a levou até ali.","q":"Lane chama esse efeito de:","o":["mediação ideológica","consciência de si","dissonância cognitiva","socialização bem-sucedida","ancoragem"],"a":0,"e":"**Mediação ideológica**: identidade e papéis parecem **naturais** e fruto de **escolhas livres**, quando são as **condições sociais** da produção da vida que os determinam.","c":"Mediação ideológica (Lane)","pista":"“nasci pra isso”, “escolhi livremente”, mas foram as condições sociais"},{"p":3,"trecho":"o gerente responde: “família não fala de dinheiro”, e a conversa acaba ali","q":"Segundo Lane, o uso da palavra “família” pelo gerente mostra:","o":["a palavra que domina: sentido único imposto pela autoridade","a contra-arma: ampliar e questionar o significado da palavra","o comportamento verbal sem a mediação de outras pessoas","a palavra como reflexo fiel e natural do objeto que nomeia","a socialização primária da equipe, feita pela empresa"],"a":0,"e":"A palavra fica poderosa quando uma **autoridade impõe um significado único** e inquestionável, que provoca ação automática. É na **distância entre palavra e objeto** que a linguagem vira arma de dominação.","c":"A palavra que domina (Lane)","pista":"uma autoridade impõe um sentido e encerra a discussão"},{"p":4,"trecho":"Bruna e as colegas começam a discutir por que o trabalho é organizado daquele jeito, quem ganha com isso e o que poderiam mudar juntas","q":"Para Lane, Bruna está desenvolvendo:","o":["consciência de si, que pode mudar o grupo","mediação ideológica, que naturaliza os papéis","ódio de si, por desprezar o próprio trabalho","socialização secundária, aprendendo a função","complacência, para evitar punição (Kelman)"],"a":0,"e":"**Consciência de si**: questionar como os papéis foram definidos e achar as **razões históricas** de agirmos como agimos, de preferência **com o grupo**, que pode virar **agente de mudança**.","c":"Consciência de si (Lane)","pista":"questionar com o grupo por que os papéis são assim"},{"p":4,"trecho":"sempre que ouve a palavra, Bruna pergunta: “família em que sentido?”","q":"Essa atitude de Bruna diante da palavra é o que Lane chama de:","o":["contra-arma: questionar o significado","palavra que domina, imposta pela autoridade","comportamento verbal reforçado pelo grupo","reatância: fazer o contrário do que mandam","alienação: não se reconhecer no trabalho"],"a":0,"e":"A **contra-arma** é **pensar** e **questionar** o significado, em vez de só reagir à palavra. Terwilliger ironiza: bastaria ensinar o soldado a pensar.","c":"Contra-arma (Lane)","pista":"perguntar “em que sentido?” em vez de obedecer à palavra"}]},{"id":"cursinho","titulo":"Marina e o cursinho caro","est":["atitudes"],"texto":["Marina acredita que estudar em grupo rende mais, porque leu pesquisas sobre isso. Ela gosta muito da ideia e sempre chama os colegas para estudar juntos.","Ela pagou caro por um cursinho e passou por uma prova de seleção difícil para entrar. As aulas são fracas, mas Marina diz para todo mundo que é “o melhor cursinho da cidade”.","Na hora de escolher entre dois notebooks parecidos, comprou o mais caro e, depois, só conseguia ver defeitos no outro.","Marina adora o professor Paulo. Ela é a favor das cotas; Paulo é contra. Isso a incomoda, e ela começa a achar que Paulo talvez “não seja tão bom professor assim”.","Numa pesquisa, Marina respondeu que nunca furaria fila. Num show lotado, quando os amigos furaram, ela foi junto."],"qs":[{"p":1,"trecho":"acredita que estudar em grupo rende mais [...] gosta muito da ideia e sempre chama os colegas para estudar juntos","q":"“Acredita que rende mais”, “gosta muito da ideia” e “sempre chama os colegas” são, nessa ordem, os componentes:","o":["cognitivo, afetivo e comportamental","afetivo, cognitivo e comportamental","comportamental, afetivo e cognitivo","cognitivo, comportamental e afetivo","afetivo, comportamental e cognitivo"],"a":0,"e":"Crença e conhecimento = **cognitivo**; sentimento pró ou contra = **afetivo** (o mais característico); predisposição à ação = **comportamental**.","c":"Componentes da atitude (Aroldo)","pista":"acreditar / gostar / fazer"},{"p":2,"trecho":"pagou caro [...] e passou por uma prova de seleção difícil para entrar. As aulas são fracas, mas Marina diz para todo mundo que é “o melhor cursinho da cidade”.","q":"Pela teoria da dissonância, o comportamento de Marina é um caso de:","o":["justificação insuficiente: o esforço faz valorizar o resultado","dissonância após uma decisão entre duas alternativas parecidas","aquiescência forçada, por ter recebido uma recompensa alta","exposição seletiva, fugindo de informação contrária","equilíbrio de Heider, por gostar dos professores do cursinho"],"a":0,"e":"Como em **Aronson e Mills (1959)**: quem passou por um teste embaraçoso para entrar num grupo achou a discussão chata **mais interessante**. Esforço grande sem prêmio gera dissonância, e a pessoa **distorce o valor** do que conseguiu.","c":"Justificação insuficiente (Aronson e Mills)","pista":"esforço ou custo alto, resultado fraco, e mesmo assim “é ótimo!”"},{"p":3,"trecho":"comprou o mais caro e, depois, só conseguia ver defeitos no outro","q":"Esse trecho ilustra a dissonância:","o":["após a decisão: valoriza o escolhido, desvaloriza o rejeitado","por justificação insuficiente: o esforço foi grande demais","por aquiescência forçada: ela foi paga para dizer que gostou","por exposição à informação dissonante sobre os notebooks","do grupo de controle de Festinger e Carlsmith, sem recompensa"],"a":0,"e":"Depois de decidir entre alternativas parecidas, reduzimos a dissonância **valorizando o escolhido e desvalorizando o rejeitado**, como no estudo de **Brehm (1956)**.","c":"Dissonância após a decisão (Brehm)","pista":"depois de escolher, só ver defeito no que ficou de fora"},{"p":4,"trecho":"Marina adora o professor Paulo. Ela é a favor das cotas; Paulo é contra.","q":"Pela Teoria do Equilíbrio de Heider, essa tríade é ___, e Marina tenta resolvê-la ___:","o":["desequilibrada (um sinal negativo); mudando o elo com Paulo","equilibrada; porque ela gosta de Paulo","desequilibrada (dois sinais negativos); mudando de opinião sobre as cotas","equilibrada; porque há só uma discordância","desequilibrada; por aquiescência forçada"],"a":0,"e":"Sinais: Marina-Paulo (+), Marina-cotas (+), Paulo-cotas (−). **Um negativo** = desequilíbrio. Uma das saídas é **mudar o elo p/o**: passar a gostar menos de Paulo.","c":"Teoria do Equilíbrio (Heider)","pista":"gostar de alguém que discorda de você sobre algo importante"},{"p":5,"trecho":"respondeu que nunca furaria fila. Num show lotado, quando os amigos furaram, ela foi junto.","q":"Pela discussão sobre atitude e comportamento no texto, isso mostra que:","o":["o comportamento depende também das normas e da situação","atitudes nunca preveem comportamento, como provou La Piere","Marina mentiu na pesquisa, como os donos de hotel de La Piere","o interesse investido dela no assunto era muito alto","a atitude dela era só afetiva, como defende Fishbein"],"a":0,"e":"Como na leitura de **Triandis** sobre **La Piere**: o comportamento depende também de **normas sociais, hábitos, consequências esperadas e da situação**. Seria ingênuo concluir que não há relação nenhuma.","c":"Atitude x comportamento (Triandis)","pista":"diz uma coisa e faz outra quando a situação muda"}]},{"id":"condominio","titulo":"A reunião do condomínio","est":["influencia"],"texto":["Na reunião do condomínio, o síndico mostrou dois orçamentos. O A era claramente mais barato, mas os oito primeiros moradores votaram no B. Na vez de Diego, ele viu que o A era melhor, mas votou no B para não ficar mal com os vizinhos.","Ninguém entendia a nova regra da prefeitura para o descarte de lixo. Cada um tinha um palpite, e depois de muita conversa todos acabaram adotando a mesma interpretação.","Dona Sônia, engenheira, explicou que o muro precisava de reforço; os moradores aceitaram sem entender os cálculos, porque confiam na formação dela. Já a taxa extra foi paga por todos porque o regimento dá ao síndico o direito de cobrá-la.","Tânia defendeu em todas as reuniões, sempre com os mesmos argumentos e sem nunca mudar de posição, a instalação de placas solares. Na votação aberta ela perdeu; na votação secreta do ano seguinte, a proposta passou.","Na eleição para síndico, um candidato distribuiu chaveirinhos de brinde antes de apresentar suas propostas. O outro pediu primeiro que os moradores aprovassem uma reforma completa da fachada; depois do “não”, pediu só a pintura do portão. E Diego? Paga o condomínio em dia só por medo da multa."],"qs":[{"p":1,"trecho":"ele viu que o A era melhor, mas votou no B para não ficar mal com os vizinhos","q":"Nos termos de Asch, Diego apresentou:","o":["distorção da ação","distorção do julgamento","distorção da percepção","internalização","obediência à autoridade"],"a":0,"e":"**Ação**: via o erro, mas **não teve coragem de se opor**. **Julgamento**: acharia que o problema era com ele. **Percepção**: veria de fato o B como melhor (raro).","c":"Distorção da ação (Asch)","pista":"sabe que a maioria está errada, mas vai junto"},{"p":2,"trecho":"Ninguém entendia a nova regra [...]. Cada um tinha um palpite, e depois de muita conversa todos acabaram adotando a mesma interpretação.","q":"Esse trecho lembra qual experimento clássico?","o":["Sherif: no ambíguo, o grupo converge numa norma","Asch: estímulo nítido e pressão de uma maioria unânime","Milgram: obediência crescente a uma autoridade","Festinger e Carlsmith: mentir por US$ 1 ou por US$ 20","La Piere: dizer uma coisa por carta e fazer outra"],"a":0,"e":"Numa situação **ambígua** (o ponto de luz que parece se mexer no escuro), os julgamentos **convergem para uma norma** do grupo. Na dúvida, confiamos nos outros.","c":"Norma de grupo no ambíguo (Sherif)","pista":"ninguém sabe a resposta, e o grupo converge"},{"p":3,"trecho":"os moradores aceitaram sem entender os cálculos, porque confiam na formação dela","q":"A base do poder de dona Sônia é:","o":["conhecimento","informação","legitimidade","referência","recompensa"],"a":0,"e":"**Conhecimento**: obedece porque **reconhece a competência** de quem fala. Se os moradores tivessem sido convencidos pelos cálculos, independente de quem falou, seria **informação**.","c":"Poder de conhecimento (French e Raven)","pista":"aceitar sem entender, por confiar na formação de alguém"},{"p":3,"trecho":"a taxa extra foi paga por todos porque o regimento dá ao síndico o direito de cobrá-la","q":"E a base do poder do síndico é:","o":["legitimidade","coerção","conhecimento","referência","informação"],"a":0,"e":"**Legitimidade**: reconhecemos que a pessoa **tem o direito de mandar** (como o policial, e não um transeunte). É uma influência dependente e privada.","c":"Poder legítimo (French e Raven)","pista":"obedecer porque a pessoa tem o direito de mandar"},{"p":4,"trecho":"sempre com os mesmos argumentos e sem nunca mudar de posição [...] Na votação aberta ela perdeu; na votação secreta do ano seguinte, a proposta passou.","q":"Pela teoria de Moscovici, Tânia influenciou:","o":["como minoria consistente, com mais aceitação privada","pelo número de apoiadores, com aceitação pública imediata","por coerção, ameaçando os vizinhos que votassem contra","por legitimidade, como se ela fosse a síndica do prédio","por reatância, impondo aos vizinhos o contrário do que queria"],"a":0,"e":"A maioria influencia pelo **número**; a minoria, pelo **estilo**: **consistência e perseverança**. Como em **Maas e Clark**, a minoria gera mais **aceitação privada** (no voto secreto) que pública.","c":"Influência da minoria (Moscovici)","pista":"uma pessoa só, sempre igual, perde em público e ganha no secreto"},{"p":5,"trecho":"um candidato distribuiu chaveirinhos de brinde antes de apresentar suas propostas. O outro pediu primeiro [...] uma reforma completa da fachada; depois do “não”, pediu só a pintura do portão.","q":"Como o livro define as táticas, os dois candidatos usaram, respectivamente:","o":["pé na porta e porta na cara","reciprocidade e porta na cara","porta na cara e pé na porta","bola baixa e isso não é tudo","contraste perceptivo e bola baixa"],"a":0,"e":"No livro, **pé na porta** = um **brinde ou atrativo para conseguir ser ouvido** (o vendedor que dá um brinde antes de apresentar o produto). **Porta na cara** = pedir algo grande, levar um não e então fazer o pedido real, menor. **Reciprocidade** seria cobrar um favor já feito (“te ajudei, agora me ajude”).","c":"Pé na porta e porta na cara (como o livro define)","pista":"brinde para ser ouvido / pedido grande negado e depois o pequeno"},{"p":5,"trecho":"Paga o condomínio em dia só por medo da multa.","q":"Para Kelman, a resposta de Diego à pressão é:","o":["complacência","identificação","internalização","conhecimento","distorção do julgamento"],"a":0,"e":"**Complacência**: agir para **evitar punição** ou ganhar recompensa. **Identificação**: imitar alguém que admiramos. **Internalização**: achar justo (a mais duradoura).","c":"Complacência (Kelman)","pista":"fazer só por medo de punição"}]},{"id":"bairro","titulo":"O projeto no bairro","est":["brasil","representacoes","grupos","ideologia","historia"],"texto":["Um grupo de estudantes de Psicologia começou um projeto num bairro da periferia. Em vez de aplicar testes prontos, traduzidos de manuais estrangeiros, quiseram entender os problemas reais daquela comunidade e atender muita gente, e não só quem pode pagar consulta.","As mães do bairro diziam que depressão é “frescura” ou “falta de Deus”. Quando o tema virou conversa frequente na fila do posto de saúde, essa ideia começou a circular e a mudar.","Os estudantes entraram nos grupos de mães como participantes, levantaram como elas viam a situação e, junto com elas, planejaram mudanças.","Numa reunião, uma líder comunitária comentou: “muita gente acha que pobre sofre porque quer, mas o sofrimento vem de como a sociedade é organizada”."],"qs":[{"p":1,"trecho":"Em vez de aplicar testes prontos, traduzidos de manuais estrangeiros, quiseram entender os problemas reais daquela comunidade e atender muita gente.","q":"A postura dos estudantes responde à crítica que Lane e o documento da Abrapso fazem contra:","o":["a dependência cultural: importar teorias e temas","a pesquisa de campo de Lewin, feita fora do laboratório","a Völkerpsychologie de Wundt, a psicologia dos povos","o universo consensual de Moscovici, onde todos opinam","a assistência psicológica em larga escala para a população"],"a":0,"e":"O documento denuncia a **dependência cultural** (teorias importadas e temas sem relevância) e propõe uma **assistência psicológica em larga escala**, já que a maioria não tem acesso ao atendimento da elite.","c":"Dependência cultural x proposta da Abrapso (Lane)","pista":"não importar testes prontos; atender muita gente"},{"p":2,"trecho":"diziam que depressão é “frescura” ou “falta de Deus”. Quando o tema virou conversa frequente [...] essa ideia começou a circular e a mudar.","q":"Essa ideia sobre depressão, que circula e muda, é para Moscovici:","o":["uma representação social, dinâmica","uma representação coletiva estática, como em Durkheim","um conhecimento do universo reificado","uma atitude sem componente afetivo","uma pré-noção que nunca muda"],"a":0,"e":"A **representação social** (Moscovici) é **dinâmica**: circula pela conversa e muda. A **representação coletiva** de Durkheim é **estática**. Durkheim congelou; Moscovici botou para circular.","c":"Representação social x coletiva (Moscovici)","pista":"ideia de senso comum que circula e muda na conversa"},{"p":3,"trecho":"Os estudantes entraram nos grupos de mães como participantes, levantaram como elas viam a situação e, junto com elas, planejaram mudanças.","q":"O método dos estudantes se aproxima de:","o":["pesquisa-ação (Lewin)","experimento de laboratório (Asch)","método experimental-introspectivo (Wundt)","tecnologia social do caso Rosa (Varela)","pesquisa de opinião pública"],"a":0,"e":"**Pesquisa-ação**: pesquisar é agir socialmente. O pesquisador entra no grupo real como participante, **analisa** as percepções, **prevê** e **age** junto com o grupo.","c":"Pesquisa-ação (Lewin)","pista":"entrar no grupo, levantar as percepções e mudar junto"},{"p":4,"trecho":"“muita gente acha que pobre sofre porque quer”","q":"A ideia que a líder critica é, para Chaui, um exemplo de:","o":["inversão: o efeito é tomado como causa","mais-valia: o trabalho não pago do pobre","fetichismo: a mercadoria parece ter vida","consciência de classe, como diz Lane","contradição entre senhor e escravo"],"a":0,"e":"O sofrimento é **efeito** da organização social, mas aparece como **causa** individual (“porque quer”). É a **inversão**, uma das operações que fazem da ideologia uma ilusão.","c":"Inversão ideológica (Chaui)","pista":"culpar a pessoa pelo que a sociedade produz"},{"p":0,"trecho":"(a história inteira)","q":"Pela classificação de Farr, apresentada por Bernardes, um projeto assim se aproxima das formas ___ de psicologia social:","o":["sociológicas, que ligam o individual ao coletivo","psicológicas, que reduzem o social ao indivíduo","experimentais, feitas em laboratório bem controlado","behavioristas, como a de Watson e de Skinner","positivistas, como as do Handbook de Lindzey"],"a":0,"e":"Formas **sociológicas** (Moscovici, Mead) relacionam o individual e o coletivo. As **psicológicas** (Allport, behaviorismo, Gestalt, cognitivismo) reduzem o social a leis individuais.","c":"Formas sociológicas x psicológicas (Farr)","pista":"olhar o indivíduo junto com o coletivo"}]}]};

/* time, xp, levels */
const pad=n=>(n<10?'0':'')+n;
const dkey=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>dkey(new Date());
function streak(){const d=new Date();let n=0;if(!S.days[dkey(d)]){d.setDate(d.getDate()-1);if(!S.days[dkey(d)])return 0}while(S.days[dkey(d)]){n++;d.setDate(d.getDate()-1)}return n}
function daysTo(str){const p=String(str).split('-').map(Number);if(p.length!==3||!p[0])return null;const t=new Date(p[0],p[1]-1,p[2]);const n=new Date();n.setHours(0,0,0,0);return Math.round((t-n)/864e5)}
const GOAL=50;
const LV=[[0,'Passageiro'],[150,'Usuário frequente'],[400,'Bilheteiro'],[750,'Condutor'],[1200,'Maquinista'],[1800,'Chefe de linha'],[2600,'Engenheiro da rede'],[3600,'Dono do metrô']];
function level(){let i=0;while(i+1<LV.length&&S.xp>=LV[i+1][0])i++;const c=LV[i],n=LV[i+1];return {n:i+1,name:c[1],p:n?(S.xp-c[0])/(n[0]-c[0]):1,next:n?n[0]-S.xp:0}}
let toastT;

function addXP(n,label,quiet){

/* stations and parts */
function parts(s){
  const P=[{k:'ent',t:'Entender',d:'Bilhete e a história em 5 paradas'}];
  const n=s.conceitos.length,k=Math.ceil(n/8),sz=Math.ceil(n/k);
  for(let i=0;i<k;i++){const a=i*sz,b=Math.min(n,a+sz);P.push({k:'c'+(i+1),t:k>1?'Conceitos '+(i+1):'Conceitos',d:(b-a)+' conceitos: aprender e testar',a:a,b:b})}
  P.push({k:'tab',t:'Tabelas e nomes',d:'Quem disse o quê, e quando'});
  P.push({k:'peg',t:'Pegadinhas',d:'O que a prova usa para te pegar'});
  P.push({k:'des',t:'Desafio',d:D.quiz.filter(q=>q.s===s.id).length+' questões difíceis · 60% completa'});
  return P;
}
const isDone=(s,p)=>!!(S.done[s.id]&&S.done[s.id][p.k]);
function markDone(s,k){S.done[s.id]=S.done[s.id]||{};S.done[s.id][k]=today();save()}
function progress(s){const P=parts(s);return {d:P.filter(p=>isDone(s,p)).length,t:P.length}}
function nextPart(s){return parts(s).find(p=>!isDone(s,p))||null}
const stDone=s=>!nextPart(s);
function stars(s){const b=S.best[s.id]||0;return b>=1?3:b>=.8?2:b>=.6?1:0}
function nextStation(){if(S.last&&BY[S.last]&&nextPart(BY[S.last]))return BY[S.last];return ST.find(s=>nextPart(s))||null}
const nextSt=s=>ST[ST.indexOf(s)+1]||null;
const partHref=(s,p)=>p.k==='des'?'#desafio-'+s.id:'#licao-'+s.id+'-'+p.k;

/* achievements */
const ACH=[['st1','Primeira estação','Complete uma estação inteira'],['azul','Linha Azul','Complete as 6 estações da NP1'],['verm','Linha Vermelha','Complete as 5 estações da NP2'],['tres','Três estrelas','Gabarite um desafio'],['combo10','Combo 10','Acerte 10 seguidas'],['sim80','Aprovado','80% ou mais no simulado'],['dias3','Constância','Estude 3 dias seguidos'],['cards100','Memória de elefante','Revise 100 cartões'],['caca','Caçador de erros','Corrija 15 questões erradas'],['detetive','Detetive','70% ou mais em 5 histórias']];
function checkAch(){
  const got=[];const set=(k,c)=>{if(c&&!S.ach[k]){S.ach[k]=today();got.push(k)}};
  set('st1',ST.some(stDone));set('azul',ST.filter(s=>s.linha==='np1').every(stDone));set('verm',ST.filter(s=>s.linha==='np2').every(stDone));
  set('tres',ST.some(s=>(S.best[s.id]||0)>=1));set('combo10',S.combo>=10);set('dias3',streak()>=3);set('cards100',S.rev>=100);set('caca',S.fix>=15);set('detetive',Object.keys(S.hs).filter(k=>S.hs[k]>=.7).length>=5);
  if(got.length){save();const a=ACH.find(x=>x[0]===got[0]);setTimeout(()=>toast(I.medal+'Conquista: '+a[1]),1000)}
}

const chip=s=>'<span class="chip '+s.linha+'"><span class="cd">'+s.code+'</span>'+esc(s.nome)+'</span>';

function starsHTML(n,lg){return '<span class="stars'+(lg?' lg':'')+'" role="img" aria-label="'+n+' de 3 estrelas">'+[0,1,2].map(i=>'<svg viewBox="0 0 24 24" class="'+(i<n?'on':'')+'" aria-hidden="true"><path d="M12 2.8l2.8 5.9 6.4.8-4.7 4.4 1.2 6.4L12 17.2l-5.7 3.1 1.2-6.4-4.7-4.4 6.4-.8z"/></svg>').join('')+'</span>'}
function ring(p,size,col){p=Math.max(0,Math.min(1,p||0));const r=10,c=2*Math.PI*r;return '<svg class="rg" viewBox="0 0 24 24" width="'+size+'" height="'+size+'" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="none" stroke="var(--soft)" stroke-width="3.2"/><circle cx="12" cy="12" r="10" fill="none" stroke="'+(col||'var(--go)')+'" stroke-width="3.2" stroke-linecap="round" stroke-dasharray="'+c.toFixed(2)+'" stroke-dashoffset="'+(c*(1-p)).toFixed(2)+'" transform="rotate(-90 12 12)"/></svg>'}
function statsHTML(){const st=streak();return '<div class="stats"><span class="stat fire'+(st?' on':'')+'" aria-label="'+st+' dias seguidos">'+I.flame+st+'</span><span class="stat xp" aria-label="'+S.xp+' XP">'+I.bolt+S.xp+'</span></div>'}
function tableStack(t){return '<div class="tstack"><h3>'+md(t.titulo)+'</h3>'+t.rows.map(r=>'<div class="trow"><h4>'+md(r[0])+'</h4>'+r.slice(1).map((c,i)=>'<p><small>'+esc(plain(t.cols[i+1]||''))+'</small>'+md(c)+'</p>').join('')+'</div>').join('')+'</div>'}
function acc(title,body){return '<details class="acc"><summary><span>'+title+'</span>'+I.chev+'</summary><div class="accb">'+body+'</div></details>'}
function mask(def,term){const base=plain(term).replace(/\s*\([^)]*\)/g,'').trim();let d=def;if(base.length>=3){d=def.replace(new RegExp(base.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi'),'_____')}return md(d)}
function dueCards(f){return D.cartoes.filter(c=>{const s=BY[c.s];return (f==='todas'||(s&&s.linha===f))&&isDue(c)})}
const IV=[0,0,1,2,4,7];

function examCard(){
  const d=S.exam?daysTo(S.exam):null;
  if(d===null)return '<label class="exam" for="exam">'+I.cal+'<span><b>Quando é a prova?</b><small>Coloque a data e eu calculo seu ritmo por dia.</small></span><span></span><input type="date" id="exam"></label>';
  const rem=ST.filter(s=>!stDone(s)).length;let t,sub;
  if(d>1){const per=Math.ceil(rem/d);t='Faltam '+d+' dias para a prova';sub=rem?'Ritmo: '+per+' '+(per>1?'estações':'estação')+' por dia ('+rem+' '+(rem>1?'restantes':'restante')+').':'Tudo completo. Agora é cartão e simulado.'}
  else if(d===1){t='A prova é amanhã';sub='Hoje: Resumão, cartões e um simulado.'}
  else if(d===0){t='A prova é hoje';sub='Leia os bilhetes no Resumão. Você treinou pra isso.'}
  else{t='A data da prova passou';sub='Toque em Mudar para colocar a próxima.'}
  return '<div class="exam">'+I.cal+'<span><b>'+t+'</b><small>'+sub+'</small></span><button type="button" class="lnk" data-act="exam-clear">Mudar</button></div>';
}

let OV=null,paintKey='';
function openOv(){const o=$('#ov');if(o.hidden){o.hidden=false;document.body.classList.add('lock')}}
function closeOv(){OV=null;paintKey='';const o=$('#ov');if(!o.hidden){o.hidden=true;document.body.classList.remove('lock')}}
function paint(p,combo,body,foot,fcls,key){
  $('#ovp').style.width=Math.round(Math.max(0,Math.min(1,p))*100)+'%';
  $('#ovp').parentNode.setAttribute('aria-valuenow',String(Math.round(p*100)));
  $('#ovc').innerHTML=combo||'';
  const ob=$('#ovb'),keep=key&&key===paintKey,st=ob.scrollTop;
  ob.classList.remove('anim');if(!keep){void ob.offsetWidth;ob.classList.add('anim')}
  ob.innerHTML=body;ob.scrollTop=keep?st:0;paintKey=key||'';
  $('#ovf').className='ovf'+(fcls?' '+fcls:'');$('#ovfi').innerHTML=foot;
}
function confetti(){if(RM)return;const c=document.createElement('div');c.className='cf';const cols=['var(--l1)','var(--l2)','var(--yel)','var(--go)'];for(let i=0;i<24;i++){const p=document.createElement('i');p.style.left=(Math.random()*100)+'%';p.style.background=cols[i%4];p.style.animationDelay=(Math.random()*.35).toFixed(2)+'s';c.appendChild(p)}document.body.appendChild(c);setTimeout(()=>c.remove(),2200)}

/* lesson */
function startLesson(s,p){
  S.last=s.id;save();
  const sc=[];
  if(p.k==='ent'){sc.push({t:'ticket'},{t:'img'});s.historia.forEach((_,i)=>sc.push({t:'parada',i:i}));sc.push({t:'voz'})}
  else if(p.k.charAt(0)==='c'){const ids=range(p.a,p.b);ids.forEach(i=>sc.push({t:'learn',i:i}));shuffle(ids).forEach(i=>sc.push(mkCQ(s,i)))}
  else if(p.k==='tab'){(s.tabelas||[]).forEach((_,i)=>sc.push({t:'table',i:i}));s.nomes.forEach((_,i)=>sc.push({t:'name',i:i}))}
  else if(p.k==='peg'){s.pegadinhas.forEach((_,i)=>sc.push({t:'peg',i:i}));s.ganchos.forEach((_,i)=>sc.push({t:'gancho',i:i}));sc.push({t:'bald'})}
  OV={kind:'lesson',s:s,p:p,sc:sc,i:0,st:0,sel:null,ok:0,xp:0,ended:false};
  openOv();lessonRender();
}
function mkCQ(s,i){return {t:'cq',i:i,opts:shuffle([i].concat(shuffle(range(0,s.conceitos.length).filter(j=>j!==i)).slice(0,3)))}}

  paint(L.i/L.sc.length,'',b,f,fc,'L'+L.i);

}
function lessonCheck(){
  const L=OV,x=L.sc[L.i];if(L.st||L.sel==null)return;L.st=1;
  if(L.sel===x.i){if(!x.again)L.ok++;L.xp+=2;addXP(2,'',true);buzz(12)}
  else{if(!x.again)L.sc.push({t:'cq',i:x.i,opts:shuffle(x.opts),again:true});buzz([30,60,30])}

}
function lessonEnd(){
  const L=OV,s=L.s,p=L.p;
  if(!L.ended){L.ended=true;L.was=isDone(s,p);markDone(s,p.k);L.gain=L.was?5:15;addXP(L.gain,'',true);if(!L.was)confetti()}

/* quiz */
function startQuiz(mode,s,list){
  let pool,n=10,title='';
  if(list){pool=list;n=list.length;title='Refazendo erros'}
  else if(mode==='st'){pool=D.quiz.filter(q=>q.s===s.id);n=pool.length}
  else if(mode==='simulado'){pool=D.quiz;n=30}
  else if(mode==='erros'){pool=D.quiz.filter(q=>S.err[q.i]);n=15}
  else if(mode==='mix'){pool=D.quiz.filter(q=>q.s==='mix')}
  else if(mode==='np1'||mode==='np2'){pool=D.quiz.filter(q=>BY[q.s]&&BY[q.s].linha===mode)}
  else pool=D.quiz;
  if(mode==='st')S.last=s.id;
  OV={kind:'quiz',mode:mode,s:s||null,src:list||null,list:shuffle(pool).slice(0,n),i:0,ok:0,combo:0,best:0,xp:0,sel:null,st:0,perm:null,wrong:[],ended:false};
  openOv();
  if(!OV.list.length){paint(0,'','<div class="win"><h2 class="big">Nada por aqui</h2><p class="hint">'+(mode==='erros'?'Você não tem erros guardados. Faça uma rodada rápida.':'Sem questões nesse modo.')+'</p></div>','<button type="button" class="btn ghost" data-act="close">Voltar</button>','','Q0');return}
  quizRender();
}

}
function quizCheck(){
  const Q=OV,q=Q.list[Q.i];if(Q.st||Q.sel==null)return;Q.st=1;S.ans++;if(Q.res)Q.res[Q.i]=Q.sel===q.a;
  if(Q.sel===q.a){Q.ok++;Q.combo++;S.ok++;const x=10+(Q.combo>=3?5:0);Q.xp+=x;Q.verd=pick(OKW)+' +'+x+' XP'+(Q.combo>=3?' · combo '+Q.combo:'');if(S.err[q.i]){delete S.err[q.i];S.fix++}addXP(x,'',true);buzz(12)}
  else{Q.combo=0;if(typeof q.i==='number')S.err[q.i]=1;Q.wrong.push(q);if(Q.idx)Q.wrongIdx.push(Q.idx[Q.i]);Q.verd=pick(BADW);buzz([30,60,30])}
  if(Q.combo>Q.best)Q.best=Q.combo;if(Q.combo>S.combo)S.combo=Q.combo;
  save();checkAch();quizRender();
}
function quizEnd(){
  const Q=OV,n=Q.list.length,pct=n?Q.ok/n:0,P=Math.round(pct*100),s=Q.s;let extra='';
  if(!Q.ended){
    Q.ended=true;
    if(Q.mode==='story'&&!Q.only){S.hs[Q.story.id]=Math.max(S.hs[Q.story.id]||0,pct);save()}
    if(Q.mode==='st'){Q.was=stDone(s);S.best[s.id]=Math.max(S.best[s.id]||0,pct);if(pct>=.6)markDone(s,'des');save();if(!Q.was&&stDone(s)){Q.newDone=true;addXP(30,'',true);confetti()}}
    if(Q.mode==='simulado'&&pct>=.8&&!S.ach.sim80){S.ach.sim80=today();save();setTimeout(()=>toast(I.medal+'Conquista: Aprovado'),1000)}
    checkAch();
  }
  if(Q.mode==='st')extra=starsHTML(stars(s),true)+(pct<.6?'<p class="hint">Precisa de 60% para completar a estação. Revise as pegadinhas e tente de novo.</p>':'')+(Q.newDone?'<p class="badge">'+I.medal+'Estação '+s.code+' completa! +30 XP</p>':'');
  const msg=P>=90?'Nível de quem gabarita.':P>=70?'Muito bom. Refaça os erros e volte amanhã.':P>=50?'Tá no caminho. Os erros abaixo são o seu mapa.':'Calma: errar aqui é o que te faz acertar na prova.';
  const b='<div class="win"><div class="score">'+ring(pct,110,pct>=.6?'var(--go)':'var(--bad)')+'<b>'+Q.ok+'/'+n+'</b></div><h2 class="big">'+P+'% de acerto</h2>'+extra+'<p class="hint">'+msg+'</p><p class="xpb">'+I.bolt+'+'+Q.xp+' XP · melhor combo '+Q.best+'</p>'+streakLine()+'</div>'+
    (Q.story?storyMap(Q):Q.wrong.length?acc('Ver as '+Q.wrong.length+' que você errou',Q.wrong.map(q=>{const t=BY[q.s];return '<div class="wq"><p class="kick">'+(t?t.code+' · '+esc(t.nome):'Misturando textos')+'</p><p><strong>'+md(q.q)+'</strong></p><p class="oka">'+I.check+'<span>'+md(q.o[q.a])+'</span></p><p class="e2">'+md(q.e)+'</p></div>'}).join('')):'');
  const ns=s&&stDone(s)&&nextSt(s),nh=Q.story&&!Q.only&&D.historias[Q.story.n];
  const f=(Q.wrong.length?'<button type="button" class="btn red" data-act="redo">Refazer as '+Q.wrong.length+' que errei</button>':'')+(ns?'<a class="btn '+ns.linha+'" href="#e-'+ns.id+'" data-replace>Próxima estação: '+ns.code+' · '+esc(ns.nome)+'</a>':'')+(nh?'<a class="btn np1" href="#h-'+nh.id+'" data-replace>Próxima história</a>':'')+(Q.story?'<button type="button" class="btn ghost" data-act="close">Sair</button>':'<div class="two"><button type="button" class="btn ghost" data-act="again-quiz">Nova rodada</button><button type="button" class="btn ghost" data-act="close">Sair</button></div>');
  paint(1,'',b,f,'','QE');
}

/* duels */
function startDuel(){OV={kind:'duel',list:shuffle(D.duelos).slice(0,10).map(d=>({d:d,side:Math.random()<.5?'a':'b',order:shuffle(['a','b'])})),i:0,ok:0,st:0,sel:null,xp:0};openOv();duelRender()}
function duelRender(){
  const U=OV,x=U.list[U.i];
  if(!x)return duelEnd();
  const d=x.d;
  const b='<div class="qtop"><span class="kick">Qual é qual?</span><span class="kick">'+(U.i+1)+' de '+U.list.length+'</span></div><div class="defq read">'+md(x.side==='a'?d.ad:d.bd)+'</div><div class="duo">'+x.order.map(k=>{let c='opt';if(U.st){if(k===x.side)c+=' ok';else if(k===U.sel)c+=' bad'}return '<button type="button" class="'+c+'" data-act="dpick" data-v="'+k+'"'+(U.st?' disabled':'')+'><span>'+md(d[k])+'</span></button>'}).join('')+'</div>';
  let f='<p class="hint center">Toque no nome certo.</p>',fc='';
  if(U.st){const ok=U.sel===x.side;fc=ok?'ok':'bad';f='<p class="verd">'+(ok?I.check+pick(OKW)+' +5 XP':I.close+'<span>Era '+md(d[x.side])+'.</span>')+'</p><div class="expl">'+md(d.dica)+'</div><button type="button" class="btn '+(ok?'go':'red')+'" data-act="dnext">'+(U.i+1<U.list.length?'Continuar':'Ver resultado')+'</button>'}
  paint(U.i/U.list.length,'',b,f,fc,'D'+U.i);
}
function duelPick(k){const U=OV,x=U.list[U.i];if(U.st)return;U.sel=k;U.st=1;if(k===x.side){U.ok++;U.xp+=5;addXP(5,'',true);buzz(12)}else buzz([30,60,30]);duelRender()}
function duelEnd(){
  const U=OV,n=U.list.length;
  const b='<div class="win"><div class="score">'+ring(U.ok/n,110,U.ok/n>=.6?'var(--go)':'var(--bad)')+'<b>'+U.ok+'/'+n+'</b></div><h2 class="big">'+(U.ok>=8?'Você separa bem os conceitos':'Os pares abaixo merecem uma olhada')+'</h2><p class="xpb">'+I.bolt+'+'+U.xp+' XP</p></div>'+acc('Ver os '+D.duelos.length+' pares',D.duelos.map(d=>'<div class="wq"><p><strong>'+md(d.a)+'</strong>: '+md(d.ad)+'</p><p><strong>'+md(d.b)+'</strong>: '+md(d.bd)+'</p><p class="e2">'+md(d.dica)+'</p></div>').join(''));
  paint(1,'',b,'<button type="button" class="btn t-go go" data-act="again-duel">Jogar de novo</button><button type="button" class="btn ghost" data-act="close">Sair</button>','','DE');
}

/* card review */
function startReview(f){
  const pool=D.cartoes.filter(c=>{const s=BY[c.s];return f==='todas'||s.linha===f});
  let list=pool.filter(isDue),ahead=false;if(!list.length){list=pool;ahead=true}
  const bx=c=>S.cd[c.i]?S.cd[c.i].b:1.5;
  list=shuffle(list).sort((a,b)=>bx(a)-bx(b)).slice(0,15);
  OV={kind:'rev',f:f,list:list,ahead:ahead,i:0,st:0,xp:0,cnt:[0,0,0],re:{}};openOv();revRender();
}
function nb(b0,k){return k===0?1:k===1?Math.max(1,b0):Math.min(5,Math.max(1,b0)+1)}
function revRender(){
  const R=OV,c=R.list[R.i];if(!c)return revEnd();
  const s=BY[c.s],r=S.cd[c.i],b0=r?r.b:0;
  const when=k=>{const d=IV[nb(b0,k)];return d===0?'volta hoje':d===1?'amanhã':'em '+d+' dias'};
  const b='<div class="qtop">'+chip(s)+'<span class="kick">'+(R.i+1)+' de '+R.list.length+'</span></div><button type="button" class="fcard '+s.linha+'" data-act="flip"'+(R.st?' disabled':'')+'><span class="kick">'+(R.ahead?'Adiantando · ':'')+(b0?'Caixa '+b0:'Cartão novo')+'</span><span class="big">'+md(c.f)+'</span>'+(R.st?'<span class="read ans">'+md(c.b)+'</span>':'<span class="hint">Responda de cabeça. Depois toque no cartão.</span>')+'</button>';
  const f=R.st?'<div class="three"><button type="button" class="gb g0" data-act="grade" data-v="0"><b>Errei</b><small>'+when(0)+'</small></button><button type="button" class="gb" data-act="grade" data-v="1"><b>Quase</b><small>'+when(1)+'</small></button><button type="button" class="gb g2" data-act="grade" data-v="2"><b>Sabia</b><small>'+when(2)+'</small></button></div>':'<button type="button" class="btn '+s.linha+'" data-act="flip">Mostrar resposta</button>';
  paint(R.i/R.list.length,'',b,f,'','R'+R.i+(R.st?'b':'f'));
}
function revGrade(k){
  const R=OV,c=R.list[R.i];if(!R.st)return;const r=S.cd[c.i],b0=r?r.b:0;
  S.cd[c.i]={b:nb(b0,k),t:Date.now()};S.rev++;R.cnt[k]++;R.xp+=2;addXP(2,'',true);
  if(k===0&&!R.re[c.i]){R.re[c.i]=1;R.list.push(c)}
  buzz(8);R.i++;R.st=0;save();revRender();
}
function revEnd(){
  const R=OV,left=dueCards(R.f).length;
  const b='<div class="win np1"><span class="wic">'+I.cards+'</span><h2 class="big">Rodada concluída!</h2><p class="xpb">'+I.bolt+'+'+R.xp+' XP</p><div class="mstats" style="width:100%"><div><b>'+R.cnt[0]+'</b><small>errei</small></div><div><b>'+R.cnt[1]+'</b><small>quase</small></div><div><b>'+R.cnt[2]+'</b><small>sabia</small></div></div><p class="hint">'+(left?left+' ainda para revisar hoje.':'Nada mais vencendo hoje. Volte amanhã.')+'</p>'+streakLine()+'</div>';
  paint(1,'',b,(left?'<button type="button" class="btn np1" data-act="again-rev">Mais uma rodada</button>':'')+'<button type="button" class="btn ghost" data-act="close">Sair</button>','','RE');
}

/* exam-style stories: read a case, then name the concept behind each excerpt */
const storyChip=st=>'<span class="chip mix"><span class="cd">'+I.story+'</span>'+esc(st.titulo)+'</span>';
const storyText=st=>'<div class="story">'+st.texto.map((t,k)=>'<p><b class="pn">'+(k+1)+'</b><span>'+md(t)+'</span></p>').join('')+'</div>';
const trechoHTML=q=>'<div class="trecho"><small>'+(q.p?'Trecho do parágrafo '+q.p:'Pense na história inteira')+'</small><span>'+md(q.trecho)+'</span></div>';
function histCard(){const n=D.historias.length;if(!n)return '';const d=D.historias.filter(h=>S.hs[h.id]!=null).length;return '<a class="rem hist" href="#historias">'+I.story+'<span><b>Histórias da prova</b><small>Como na NP2: um caso e o conceito de cada trecho. '+d+' de '+n+' feitas.</small></span>'+I.chev+'</a>'}
function startStory(st,only){
  const part=!!(only&&only.length),idx=part?only:st.qs.map((_,k)=>k);
  OV={kind:'quiz',mode:'story',story:st,only:part,idx:idx,list:idx.map(k=>st.qs[k]),i:part?0:-1,ok:0,combo:0,best:0,xp:0,sel:null,st:0,perm:null,wrong:[],wrongIdx:[],res:[],ended:false};
  openOv();quizRender();
}
function storyIntro(){
  const Q=OV,st=Q.story;
  const b='<p class="kick">História '+st.n+' de '+D.historias.length+' · leia com calma</p><h2 class="big">'+esc(st.titulo)+'</h2>'+storyText(st)+'<p class="hint">Agora vêm '+Q.list.length+' perguntas. Cada uma mostra o trecho exato da história.</p>';
  paint(0,'',b,'<button type="button" class="btn np2" data-act="qnext">Começar as perguntas</button>','','SI');
}
function storyMap(Q){return '<h3 class="h2">Mapa da história</h3><p class="hint">Cada trecho e o conceito que ele mostra.</p><div class="smap">'+Q.list.map((q,k)=>'<div class="'+(Q.res[k]?'ok':'bad')+'"><p class="tc">'+md(q.trecho)+'</p><p class="cc">'+(Q.res[k]?I.check:I.close)+'<span>'+esc(q.c)+'</span></p></div>').join('')+'</div>'}
function pageHistorias(){
  const steps=['**Leia a história inteira** antes das perguntas e marque quem é quem: pessoa, grupo ou instituição.','**Ache a pista** de cada trecho: uma frase ou cena típica (“é tipo...”, “virou outra pessoa”, “nasci pra isso”, “o que acontece com um acontece com todos”).','**Veja de que autor é a pergunta.** A mesma palavra muda de sentido: objetivação em Berger e Luckmann não é a de Moscovici; minoria em Lewin não é a de Moscovici.','**Pergunte o nível:** o trecho fala de uma pessoa, de um grupo ou da sociedade? Isso já elimina várias alternativas.','**Elimine** as alternativas de outros textos e as que dizem o contrário do trecho.'];
  return '<header class="hd"><button type="button" class="ib" data-act="back" data-to="treino" aria-label="Voltar ao treino">'+I.back+'</button><span class="ht">Histórias da prova</span><span class="ib"></span></header>'+
  '<p class="lead">Na prova, o professor conta uma história e pergunta o conceito de cada parte. Aqui é igual, mas cada pergunta mostra o trecho exato e, no fim, você vê o mapa: trecho por trecho, qual conceito.</p>'+
  '<details class="acc" open><summary><span>Como ler uma história de prova</span>'+I.chev+'</summary><div class="accb"><ol class="steps2">'+steps.map(x=>'<li>'+md(x)+'</li>').join('')+'</ol></div></details>'+
  '<div class="tlist">'+D.historias.map(st=>{const b=S.hs[st.id];return '<a class="tcard t-gold" href="#h-'+st.id+'"><span class="ic">'+st.n+'</span><span><b>'+esc(st.titulo)+'</b><small>'+st.qs.length+' perguntas · '+st.est.map(id=>BY[id].code).join(' · ')+(b!=null?' · melhor: '+Math.round(b*100)+'%':'')+'</small></span>'+(b!=null&&b>=.7?I.check:I.chev)+'</a>'}).join('')+'</div>'+
  '<h2 class="h2">Dicionário de pistas</h2><p class="hint">Se na história aparece isto, pense neste conceito.</p>'+
  '<div class="dicts">'+D.historias.map(st=>acc(esc(st.titulo),'<div class="dict">'+st.qs.map(q=>'<div><span>'+esc(q.pista)+'</span><b>'+esc(q.c)+'</b></div>').join('')+'</div>')).join('')+'</div>';
}

/* ---------- router ---------- */
const PAGES={inicio:pageHome,treino:pageTreino,cartoes:pageCartoes,resumo:pageResumo,disc:pageDisc,historias:pageHistorias};
const TABOF={inicio:'inicio',treino:'treino',cartoes:'cartoes',resumo:'resumo',disc:'treino',historias:'treino'};
const TABS=[['inicio',I.map,'Mapa'],['treino',I.target,'Treino'],['cartoes',I.cards,'Cartões'],['resumo',I.book,'Resumão']];
const hist=[],mem={};let cur='',replacing=false,wentBack=false;
function parentOf(h){let m;if((m=h.match(/^(?:licao|desafio)-([a-z]+)/)))return 'e-'+m[1];if(/^h-/.test(h))return 'historias';if(h==='historias')return 'treino';if(/^(q-|duelo|disc)/.test(h))return 'treino';if(/^revisao-/.test(h))return 'cartoes';return 'inicio'}
function back(to){if(hist.length>1)history.back();else{replacing=true;location.replace('#'+to)}}
function goUp(to){if(hist.length>1&&hist[hist.length-2]===to)history.back();else{replacing=true;location.replace('#'+to)}}
function showRight(){const ok=$('#ovb .opt.ok');if(ok&&ok.scrollIntoView)ok.scrollIntoView({block:'nearest'})}
function paintTabs(tab){const due=dueCards('todas').filter(c=>S.cd[c.i]).length;$('#tabs').innerHTML=TABS.map(t=>'<a href="#'+t[0]+'"'+(t[0]===tab?' aria-current="page"':'')+'>'+t[1]+'<span>'+t[2]+'</span>'+(t[0]==='cartoes'&&due?'<span class="badge">'+(due>99?'99+':due)+'</span>':'')+'</a>').join('')}
function renderPage(h){
  let m,html,tab;
  if((m=h.match(/^e-([a-z]+)$/))&&BY[m[1]]){html=pageStation(BY[m[1]]);tab='inicio'}
  else if(PAGES[h]){html=PAGES[h]();tab=TABOF[h]}
  else return false;
  $('#pg').innerHTML=html;paintTabs(tab);document.title=(h==='inicio'?'':($('.ht,.ht1')?$('.ht,.ht1').textContent+' · ':''))+'Metrô da Psicologia Social';
  return true;
}
function route(){
  let h=decodeURIComponent((location.hash||'').slice(1))||'inicio';
  if(replacing){hist[hist.length?hist.length-1:0]=h;replacing=false;wentBack=false}
  else if(hist.length>1&&hist[hist.length-2]===h){hist.pop();wentBack=true}
  else if(hist[hist.length-1]!==h){hist.push(h);wentBack=false}
  if(cur&&!$('#pg').hidden&&$('#ov').hidden)mem[cur]=window.scrollY;
  cur=h;let m;
  if((m=h.match(/^licao-([a-z]+)-(\w+)$/))&&BY[m[1]]){const s=BY[m[1]],p=parts(s).find(x=>x.k===m[2]);if(p&&p.k!=='des'){ensureBehind(parentOf(h));startLesson(s,p);return}}
  if((m=h.match(/^desafio-([a-z]+)$/))&&BY[m[1]]){ensureBehind(parentOf(h));startQuiz('st',BY[m[1]]);return}
  if((m=h.match(/^q-(rapido|simulado|erros|mix|np1|np2)$/))){ensureBehind('treino');startQuiz(m[1]);return}
  if(h==='duelo'){ensureBehind('treino');startDuel();return}
  if((m=h.match(/^h-([a-z]+)$/))&&HS[m[1]]){ensureBehind('historias');startStory(HS[m[1]]);return}
  if((m=h.match(/^revisao-(todas|np1|np2)$/))){ensureBehind('cartoes');startReview(m[1]);return}
  closeOv();
  if(!renderPage(h)){replacing=true;location.replace('#inicio');return}
  window.scrollTo(0,wentBack&&mem[h]?mem[h]:0);
}
let behind='';
function ensureBehind(p){if(behind!==p){renderPage(p);behind=p}}
function rerender(){const y=window.scrollY;renderPage(cur);window.scrollTo(0,y)}
window.addEventListener('hashchange',()=>{behind='';route()});

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const a=e.target.closest('a[data-replace]');
  if(a){e.preventDefault();replacing=true;location.replace(a.getAttribute('href'));return}
  const t=e.target.closest('[data-act]');if(!t)return;
  const act=t.getAttribute('data-act'),v=t.getAttribute('data-v');
  switch(act){
    case 'back':back(t.getAttribute('data-to'));break;
    case 'close':goUp(parentOf(cur));break;
    case 'next':if(OV&&OV.kind==='lesson'){OV.i++;OV.st=0;OV.sel=null;lessonRender()}break;
    case 'reveal':if(OV){OV.st=1;lessonRender()}break;
    case 'pick':if(OV&&!OV.st){OV.sel=+v;lessonRender()}break;
    case 'check':lessonCheck();break;
    case 'again':if(OV){const x=OV.sc[OV.i];if(!x.again)OV.sc.push({t:x.t,i:x.i,again:true});OV.i++;OV.st=0;lessonRender()}break;
    case 'qpick':if(OV&&!OV.st){OV.sel=+v;quizRender()}break;
    case 'qcheck':quizCheck();break;
    case 'qnext':OV.i++;OV.st=0;OV.sel=null;OV.perm=null;quizRender();break;
    case 'redo':if(OV.story)startStory(OV.story,OV.wrongIdx.slice());else startQuiz('redo',OV.s,OV.wrong.slice());break;
    case 'again-quiz':if(OV.story)startStory(OV.story);else startQuiz(OV.mode,OV.s,OV.src);break;
    case 'dpick':duelPick(v);break;
    case 'dnext':OV.i++;OV.st=0;OV.sel=null;duelRender();break;
    case 'again-duel':startDuel();break;
    case 'flip':if(OV&&!OV.st){OV.st=1;buzz(6);revRender()}break;
    case 'grade':revGrade(+v);break;
    case 'again-rev':startReview(OV.f);break;
    case 'cf':CF=v;rerender();break;
    case 'rs':RS=v;renderPage(cur);window.scrollTo(0,0);break;
    case 'exam-clear':S.exam='';save();rerender();break;
    case 'dshow':{const i=v;$('#dh-'+i).hidden=true;$('#da-'+i).hidden=false;break}
  }
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='exam'&&t.value){S.exam=t.value;save();rerender();toast(I.cal+'Data salva. Bora!');return}
  const i=t.getAttribute&&t.getAttribute('data-dk');
  if(i!=null){const boxes=document.querySelectorAll('[data-dk="'+i+'"]');if(Array.prototype.every.call(boxes,b=>b.checked)&&!S.disc[i]){S.disc[i]=today();save();addXP(10,'dissertativa')}}
});
document.addEventListener('keydown',e=>{
  if($('#ov').hidden)return;
  if(e.key==='Escape'){goUp(parentOf(cur));return}
  if(e.key==='Enter'){const btn=$('#ovfi .btn:not([disabled])');if(btn&&document.activeElement===document.body){e.preventDefault();btn.click()}}
});
route();
})();
</script>
