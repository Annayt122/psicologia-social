<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F3F4F6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D1117" media="(prefers-color-scheme: dark)">
<title>Metrô da Psicologia Social</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Overpass:wght@400..900&family=Source+Serif+4:opsz,wght@8..60,400..700&display=swap" rel="stylesheet">
<style>
:root{
  /* Mobile study app: bottom tabs (Mapa, Treino, Cartões, Resumão); every lesson/quiz/review runs in a
     full-screen session with the main action in the thumb zone. Blue = NP1 line, red = NP2 line. */
  --bg:#F3F4F6; --card:#FFFFFF; --soft:#E8EBEF; --ink:#101418; --ink-2:#45505B; --ink-3:#66707C; --line:#DCE0E6;
  --l1:#0B5FD3; --l1-bg:#0B5FD3; --l1-soft:#E2ECFB; --l2:#D23A1F; --l2-bg:#C3311A; --l2-soft:#FBE5E0;
  --yel:#FFC629; --yel-ink:#1A1400; --go:#15803D; --go-bg:#15803D; --go-soft:#DCF3E4; --bad:#C2281B; --bad-bg:#C2281B; --bad-soft:#FCE5E2;
  --fire:#EA580C; --gold:#E09A00; --shadow:rgba(16,20,24,.18);
  --ui:"Overpass","Helvetica Neue",Arial,sans-serif; --read:"Source Serif 4",Georgia,"Times New Roman",serif;
  --tabh:64px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0D1117; --card:#161B22; --soft:#222A34; --ink:#EEF2F6; --ink-2:#B5BEC9; --ink-3:#8E98A4; --line:#2C343F;
    --l1:#6AA6FF; --l1-bg:#1F5FBF; --l1-soft:#14294A; --l2:#FF7F66; --l2-bg:#B23A22; --l2-soft:#3B1A13;
    --yel:#FFD04D; --go:#4CC27A; --go-bg:#1E7A42; --go-soft:#0F2E1C; --bad:#FF8A7A; --bad-bg:#B02A1E; --bad-soft:#3A1612;
    --fire:#FB923C; --gold:#FFC44D; --shadow:rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1117; --card:#161B22; --soft:#222A34; --ink:#EEF2F6; --ink-2:#B5BEC9; --ink-3:#8E98A4; --line:#2C343F;
  --l1:#6AA6FF; --l1-bg:#1F5FBF; --l1-soft:#14294A; --l2:#FF7F66; --l2-bg:#B23A22; --l2-soft:#3B1A13;
  --yel:#FFD04D; --go:#4CC27A; --go-bg:#1E7A42; --go-soft:#0F2E1C; --bad:#FF8A7A; --bad-bg:#B02A1E; --bad-soft:#3A1612;
  --fire:#FB923C; --gold:#FFC44D; --shadow:rgba(0,0,0,.5);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased}
body.lock{overflow:hidden}
h1,h2,h3,h4,p,ol,ul{margin:0}
h1,h2,h3{text-wrap:balance;letter-spacing:-.015em}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:inherit}
a,button,summary,label,input{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
:focus-visible{outline:3px solid var(--l1);outline-offset:2px;border-radius:10px}
strong{font-weight:800}
.i{width:22px;height:22px;flex:none}
.np1{--lc:var(--l1);--lcb:var(--l1-bg);--ls:var(--l1-soft)}
.np2{--lc:var(--l2);--lcb:var(--l2-bg);--ls:var(--l2-soft)}
.mix{--lc:var(--ink-2);--lcb:#4A5563;--ls:var(--soft)}

/* page shell */
#pg{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:18px;padding:0 max(16px,env(safe-area-inset-right)) calc(var(--tabh) + 32px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.hd{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 -16px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:color-mix(in srgb,var(--bg) 94%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.brand{display:flex;align-items:center;gap:9px;font-weight:900;font-size:19px;letter-spacing:-.01em}
.logo{display:grid;gap:3px;width:22px}.logo i{display:block;height:5px;border-radius:3px;background:var(--l1)}.logo i+i{background:var(--l2)}
.ht1{font-size:26px;font-weight:900}
.ht{font-weight:800;font-size:16px;text-align:center;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:44px;height:44px;display:grid;place-items:center;border-radius:12px;flex:none;color:var(--ink-2)}
.ib .i{width:26px;height:26px}
.stats{display:flex;gap:6px}
.stat{display:inline-flex;align-items:center;gap:4px;font-weight:900;font-size:15px;padding:6px 11px 5px 8px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-variant-numeric:tabular-nums}
.stat .i{width:19px;height:19px;color:var(--ink-3)}
.stat.fire.on .i{color:var(--fire)}
.stat.xp .i{color:var(--gold)}
.kick{font-weight:800;font-size:12.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.lead{font-family:var(--read);font-size:17.5px;line-height:1.55;color:var(--ink-2)}
.hint{font-size:15px;line-height:1.45;color:var(--ink-3)}
.center{text-align:center}
.h2{font-size:21px;font-weight:900;margin-top:8px}
.hero{display:grid;gap:4px;padding-top:4px}
.hero h1{font-size:31px;font-weight:900;line-height:1.05}

/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:54px;padding:6px 20px 4px;border-radius:16px;font-weight:900;font-size:17px;line-height:1.2;text-align:center;background:var(--ink);color:var(--bg);box-shadow:0 4px 0 0 color-mix(in srgb,var(--ink) 55%,#000);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 0 color-mix(in srgb,var(--ink) 55%,#000)}
.btn.np1,.btn.np2{background:var(--lcb);color:#fff;box-shadow:0 4px 0 0 color-mix(in srgb,var(--lcb) 60%,#000)}
.btn.go{background:var(--go-bg);color:#fff;box-shadow:0 4px 0 0 color-mix(in srgb,var(--go-bg) 60%,#000)}
.btn.red{background:var(--bad-bg);color:#fff;box-shadow:0 4px 0 0 color-mix(in srgb,var(--bad-bg) 60%,#000)}
.btn.ghost{background:var(--card);color:var(--ink);border:2px solid var(--line);box-shadow:0 3px 0 0 var(--line)}
.btn[disabled]{opacity:.4;box-shadow:none;transform:none;cursor:default}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lnk{font-weight:800;font-size:14.5px;color:var(--l1);padding:10px 4px;min-height:44px}

/* home */
.next{display:grid;gap:10px;padding:18px;border-radius:22px;background:var(--card);border:1px solid var(--line);box-shadow:0 10px 30px -16px var(--shadow)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.muted{font-weight:700;font-size:14px;color:var(--ink-3)}
.nx-t{font-weight:900;font-size:24px;line-height:1.15}
.nx-d{font-size:15px;color:var(--ink-3);margin-top:-6px}
.mbar{display:block;height:10px;border-radius:5px;background:var(--soft);overflow:hidden}
.mbar i{display:block;height:100%;border-radius:5px;background:var(--lc,var(--go))}
.chip{display:inline-flex;align-items:center;gap:7px;font-weight:800;font-size:14px;line-height:1.2;padding:3px 11px 3px 3px;border-radius:99px;background:var(--ls);color:var(--ink);max-width:100%}
.chip .cd{display:grid;place-items:center;min-width:28px;height:28px;padding:0 6px;border-radius:99px;background:var(--lcb);color:#fff;font-size:13px;font-weight:900;flex:none}
.chip .cd .i{width:16px;height:16px}
.today{display:grid;gap:14px;padding:16px;border-radius:20px;background:var(--card);border:1px solid var(--line)}
.tl{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.tl b{display:block;font-weight:900;font-size:17px}
.tl small,.lv small{display:block;font-size:14.5px;color:var(--ink-3);line-height:1.35}
.lv{display:grid;gap:6px;border-top:1px solid var(--line);padding-top:12px}
.lv span:first-child{font-size:15px;font-weight:700;color:var(--ink-2)}
.lv .mbar i{background:var(--gold)}
.rg{display:block}
.exam,.rem{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:14px 16px;border-radius:18px;background:var(--card);border:1px solid var(--line)}
.exam>.i,.rem>.i:first-child{width:28px;height:28px;color:var(--l1)}
.exam b,.rem b{display:block;font-weight:900;font-size:16.5px;line-height:1.25}
.exam small,.rem small{display:block;font-size:14.5px;color:var(--ink-3);line-height:1.35}
.exam input{grid-column:1/-1;font:inherit;font-weight:800;font-size:16px;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:10px 12px;min-height:48px;width:100%}
.rem .i:last-child{color:var(--ink-3)}
.lh{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-top:6px}
.lh h2{font-size:22px;font-weight:900}
.lh small{font-weight:700;color:var(--ink-3);font-size:13.5px}
.line{list-style:none;padding:4px 0;position:relative}
.line::before{content:"";position:absolute;left:29px;top:40px;bottom:40px;width:6px;margin-left:-3px;border-radius:3px;background:var(--lc)}
.node{display:grid;grid-template-columns:58px 1fr auto;align-items:center;gap:14px;padding:9px 0;min-height:78px}
.ring{position:relative;z-index:1;width:58px;height:58px;border-radius:50%;background:conic-gradient(var(--lc) calc(var(--p) * 360deg),var(--soft) 0);display:grid;place-items:center;box-shadow:0 0 0 5px var(--bg)}
.ring>span{width:44px;height:44px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-weight:900;font-size:16px;color:var(--lc)}
.node.ok .ring>span{background:var(--lcb);color:#fff}
.node.cur .ring{box-shadow:0 0 0 5px var(--bg),0 0 0 8px var(--lc)}
.nm{min-width:0}
.nm b{display:block;font-size:18px;font-weight:800;line-height:1.2}
.nm small{display:block;font-size:13.5px;color:var(--ink-3);line-height:1.3;margin-top:2px}
.nr{display:grid;justify-items:end;gap:2px}
.nr small{font-weight:800;font-size:12.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.stars{display:inline-flex;gap:1px;vertical-align:middle}
.stars svg{width:15px;height:15px;fill:var(--soft)}
.stars svg.on{fill:var(--gold)}
.stars.lg svg{width:34px;height:34px}
.achs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ach{display:grid;gap:3px;padding:14px;border-radius:16px;background:var(--card);border:1px solid var(--line);opacity:.55}
.ach .i{width:28px;height:28px;color:var(--ink-3)}
.ach b{font-weight:900;font-size:15px;line-height:1.2}
.ach small{font-size:13px;line-height:1.3;color:var(--ink-3)}
.ach.on{opacity:1;border-color:var(--gold);box-shadow:0 3px 0 0 var(--gold)}
.ach.on .i{color:var(--gold)}

/* station page */
.band{display:grid;gap:6px;padding:18px;border-radius:22px;background:var(--lcb);color:#fff}
.band .bc{display:grid;place-items:center;width:48px;height:48px;border-radius:50%;background:#fff;color:var(--lcb);font-weight:900;font-size:18px}
.band h1{font-size:36px;font-weight:900;line-height:1;margin-top:6px}
.band p{font-weight:700;font-size:15px;line-height:1.35;opacity:.95}
.band .bo{font-weight:600;font-size:14px;opacity:.85}
.band .mbar{background:rgba(255,255,255,.3);margin-top:8px}
.band .mbar i{background:#fff}
.band small{display:flex;align-items:center;gap:8px;font-weight:800;font-size:14px}
.band .stars svg{fill:rgba(255,255,255,.35)}
.band .stars svg.on{fill:var(--yel)}
.ticket{position:relative;background:var(--yel);color:var(--yel-ink);border-radius:14px;padding:16px 16px 16px 28px;-webkit-mask:radial-gradient(circle 9px at 0 50%,transparent 98%,#000);mask:radial-gradient(circle 9px at 0 50%,transparent 98%,#000)}
.ticket::before{content:"";position:absolute;left:15px;top:12px;bottom:12px;border-left:2px dashed rgba(26,20,0,.35)}
.ticket .kick{color:rgba(26,20,0,.68)}
.ticket p+p{font-weight:800;font-size:18.5px;line-height:1.38;margin-top:4px}
.ticket.big p+p{font-size:21px}
.parts{list-style:none;padding:0;display:grid;gap:10px}
.part{display:grid;grid-template-columns:42px 1fr auto;gap:12px;align-items:center;padding:12px 14px;border-radius:16px;background:var(--card);border:2px solid var(--line);min-height:70px}
.part .pn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:16px;background:var(--soft);color:var(--ink-2)}
.part.ok .pn{background:var(--go-bg);color:#fff}
.part.cur{border-color:var(--lc);box-shadow:0 4px 0 0 var(--lc)}
.part.cur .pn{background:var(--lcb);color:#fff}
.part b{display:block;font-weight:900;font-size:17px;line-height:1.2}
.part small{display:block;color:var(--ink-3);font-size:14px;line-height:1.3;margin-top:2px}
.part>.i{color:var(--ink-3)}
.acc{background:var(--card);border:1px solid var(--line);border-radius:16px}
.acc+.acc{margin-top:-8px}
.acc summary{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:58px;padding:10px 16px;font-weight:800;font-size:16.5px;cursor:pointer}
.acc summary::-webkit-details-marker{display:none}
.acc summary>.i{color:var(--ink-3);transition:transform .2s}
.acc[open] summary>.i{transform:rotate(90deg)}
.accb{display:grid;gap:12px;padding:0 16px 16px}
.ci b{display:block;font-weight:900;font-size:16px}
.ci p{font-family:var(--read);font-size:16px;line-height:1.5;color:var(--ink-2)}
.plist{display:grid;gap:10px;padding-left:22px;font-family:var(--read);font-size:16.5px;line-height:1.5}
.plist li::marker{font-family:var(--ui);font-weight:900;color:var(--lc,var(--ink))}
.tstack{display:grid;gap:8px}
.tstack h3{font-size:17px;font-weight:900}
.trow{display:grid;gap:6px;padding:12px 14px;border-radius:14px;background:var(--bg);border:1px solid var(--line)}
.trow h4{font-weight:900;font-size:16px}
.trow p{font-family:var(--read);font-size:15.5px;line-height:1.45}
.trow small{display:block;font-family:var(--ui);font-weight:800;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.names{display:grid}
.names div{display:grid;gap:2px;padding:10px 0;border-top:1px solid var(--line)}
.names div:first-child{border-top:0;padding-top:0}
.names b{font-weight:900;font-size:15.5px}
.names span{font-family:var(--read);font-size:15.5px;color:var(--ink-2)}
.callout{display:grid;grid-template-columns:24px 1fr;gap:10px;padding:14px;border-radius:14px;font-family:var(--read);font-size:16px;line-height:1.5}
.callout .i{margin-top:2px}
.callout.peg{background:var(--bad-soft);border-left:5px solid var(--bad)}
.callout.peg .i{color:var(--bad)}
.callout.gancho{background:color-mix(in srgb,var(--yel) 24%,var(--card));border-left:5px solid var(--yel)}
.callout.big2{font-size:19px;line-height:1.55;padding:20px 18px;grid-template-columns:28px 1fr}
.callout.big2 .i{width:28px;height:28px}
.links{display:grid;gap:10px}
.lk{display:grid;gap:8px;padding:14px;border-radius:14px;background:var(--bg);border:1px solid var(--line)}
.lk p{font-family:var(--read);font-size:15.5px;line-height:1.45;color:var(--ink-2)}
.pnx{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pnx a{display:grid;gap:2px;padding:12px 14px;border-radius:14px;background:var(--card);border:1px solid var(--line);min-height:60px}
.pnx small{font-weight:800;font-size:12.5px;color:var(--ink-3)}
.pnx b{font-weight:900;font-size:15px;line-height:1.2}
.pnx a:last-child{text-align:right}

/* treino, cartões, resumão */
.tlist{display:grid;gap:10px}
.tcard{display:grid;grid-template-columns:50px 1fr auto;gap:14px;align-items:center;padding:14px 16px;border-radius:18px;background:var(--card);border:2px solid var(--line);box-shadow:0 3px 0 0 var(--line);min-height:78px}
.tcard:active{transform:translateY(2px);box-shadow:0 1px 0 0 var(--line)}
.tcard .ic{width:50px;height:50px;border-radius:14px;display:grid;place-items:center;background:var(--ls,var(--soft));color:var(--lc,var(--ink));font-weight:900;font-size:20px}
.tcard .ic .i{width:26px;height:26px}
.tcard b{display:block;font-weight:900;font-size:17px;line-height:1.2}
.tcard small{display:block;font-size:14px;color:var(--ink-3);line-height:1.3;margin-top:2px}
.tcard>.i{color:var(--ink-3)}
.tcard.dis{opacity:.5;box-shadow:none}
.t-gold{--lc:var(--gold);--ls:color-mix(in srgb,var(--gold) 18%,var(--card))}
.t-go{--lc:var(--go);--ls:var(--go-soft)}
.t-bad{--lc:var(--bad);--ls:var(--bad-soft)}
.t-ink{--lc:var(--ink);--ls:var(--soft)}
.mstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mstats div{display:grid;justify-items:center;padding:12px 6px;border-radius:14px;background:var(--card);border:1px solid var(--line);text-align:center}
.mstats b{font-weight:900;font-size:21px;font-variant-numeric:tabular-nums}
.mstats small{font-size:12.5px;font-weight:700;color:var(--ink-3);line-height:1.2}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--soft);border-radius:14px;padding:4px;gap:4px}
.seg button{min-height:44px;border-radius:11px;font-weight:800;font-size:15px;color:var(--ink-2);text-align:center}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 4px var(--shadow)}
.duebox{display:grid;justify-items:center;gap:2px;padding:22px 16px;border-radius:20px;background:var(--card);border:1px solid var(--line);text-align:center}
.duebox b{font-weight:900;font-size:52px;line-height:1;font-variant-numeric:tabular-nums}
.duebox span{font-weight:700;color:var(--ink-2)}
.boxes{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;align-items:end;padding:14px;border-radius:18px;background:var(--card);border:1px solid var(--line)}
.boxes div{display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:800;font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.boxes i{display:block;width:100%;border-radius:5px 5px 0 0;background:var(--go);min-height:4px}
.boxes div:first-child i{background:var(--line)}
.vcard{display:grid;gap:10px;padding:16px;border-radius:18px;background:var(--card);border:1px solid var(--line);border-left:6px solid var(--lc)}
.vcard>p{font-family:var(--read);font-size:16.5px;line-height:1.5}
.vcard .g{display:grid;grid-template-columns:20px 1fr;gap:8px;font-size:15px;color:var(--ink-2)}
.vcard .g .i{width:19px;height:19px;color:var(--gold);margin-top:2px}
.nums{display:grid;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:4px 16px}
.nums div{display:grid;grid-template-columns:96px 1fr;gap:12px;padding:12px 0;border-top:1px solid var(--line);font-family:var(--read);font-size:15.5px;line-height:1.4}
.nums div:first-child{border-top:0}
.nums b{font-family:var(--ui);font-weight:900;font-variant-numeric:tabular-nums}
.bald{display:grid;gap:10px;padding:16px;border-radius:18px;background:var(--card);border:1px solid var(--line)}
.bald h3{font-size:17.5px;font-weight:900}
.bald p{font-family:var(--read);font-size:15.5px;line-height:1.5;color:var(--ink-2)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.disc summary{align-items:flex-start}
.disc summary>span{display:grid;gap:8px;justify-items:start}
.dq{font-weight:800;font-size:16.5px;line-height:1.35}
.disc summary>.i.ok{color:var(--go)}
.dans{display:grid;gap:12px}
.dans[hidden]{display:none}
.kl{display:grid;gap:4px;padding:12px;border-radius:14px;background:var(--bg)}
.kl label{display:grid;grid-template-columns:26px 1fr;gap:10px;align-items:start;padding:8px 0;font-size:15.5px;line-height:1.4;cursor:pointer}
.kl input{width:24px;height:24px;margin:0;accent-color:var(--go)}
.read{font-family:var(--read);font-size:19px;line-height:1.6}
.read.sm{font-size:16.5px;line-height:1.55}

/* exam-style stories */
.story{display:grid;gap:14px}
.story p{display:grid;grid-template-columns:28px 1fr;gap:10px;font-family:var(--read);font-size:18px;line-height:1.6}
.story .pn{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--soft);font-family:var(--ui);font-weight:900;font-size:13.5px;color:var(--ink-2);margin-top:2px}
.accb .story p{font-size:16px;line-height:1.55}
.trecho{display:grid;gap:4px;padding:14px 16px;border-radius:14px;background:color-mix(in srgb,var(--yel) 22%,var(--card));border-left:5px solid var(--yel);font-family:var(--read);font-size:17px;line-height:1.5}
.trecho small{font-family:var(--ui);font-weight:800;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.pista{display:grid;grid-template-columns:22px 1fr;gap:8px;margin-top:8px;font-family:var(--ui);font-size:15px;line-height:1.4}
.pista .i{width:20px;height:20px;color:var(--gold)}
.smap{display:grid}
.smap>div{display:grid;gap:6px;padding:12px 0;border-top:1px solid var(--line)}
.smap .tc{font-family:var(--read);font-style:italic;font-size:15.5px;line-height:1.45;color:var(--ink-2)}
.smap .cc{display:grid;grid-template-columns:22px 1fr;gap:6px;font-weight:800;font-size:15.5px;line-height:1.3}
.smap .ok .cc{color:var(--go)}
.smap .bad .cc{color:var(--bad)}
.dicts{display:grid;gap:18px}
.dict{display:grid}
.dict div{display:grid;gap:2px;padding:10px 0;border-top:1px solid var(--line)}
.dict div:first-child{border-top:0;padding-top:0}
.dict span{font-family:var(--read);font-style:italic;font-size:15.5px;line-height:1.4;color:var(--ink-2)}
.dict b{font-weight:900;font-size:15px}
.steps2{display:grid;gap:10px;padding-left:22px;font-size:16px;line-height:1.5}
.rem.hist{border:2px solid var(--gold);box-shadow:0 3px 0 0 var(--gold)}
.rem.hist>.i:first-child{color:var(--gold)}
.tcard.hl{border-color:var(--gold);box-shadow:0 3px 0 0 var(--gold)}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tabs a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;height:var(--tabh);font-weight:800;font-size:12px;color:var(--ink-3)}
.tabs a .i{width:26px;height:26px}
.tabs a[aria-current]{color:var(--ink)}
.tabs a[aria-current] .i{color:var(--l1)}
.tabs .badge{position:absolute;margin:-26px 0 0 26px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--bad-bg);color:#fff;font-size:11px;font-weight:900;display:grid;place-items:center}
.tabs a{position:relative}

/* full-screen sessions */
#ov{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;height:100vh;height:100dvh}
#ov[hidden]{display:none}
.ovh{width:100%;max-width:620px;margin:0 auto;display:grid;grid-template-columns:44px 1fr 56px;align-items:center;gap:10px;padding:calc(6px + env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) 6px max(10px,env(safe-area-inset-left))}
.pbar{height:12px;border-radius:6px;background:var(--soft);overflow:hidden}
.pbar i{display:block;height:100%;width:0;border-radius:6px;background:var(--go);transition:width .3s}
.combo{display:inline-flex;align-items:center;justify-content:flex-end;gap:2px;font-weight:900;font-size:16px;color:var(--fire)}
.combo .i{width:20px;height:20px}
.ovb{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;width:100%;max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:16px;padding:10px max(18px,env(safe-area-inset-right)) 24px max(18px,env(safe-area-inset-left))}
.ovf{border-top:1px solid var(--line);background:var(--bg);padding:12px max(16px,env(safe-area-inset-right)) calc(14px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.ovf .in{max-width:620px;margin:0 auto;display:grid;gap:10px}
.ovf.ok{background:var(--go-soft);border-top-color:transparent}
.ovf.bad{background:var(--bad-soft);border-top-color:transparent}
.verd{display:flex;align-items:center;gap:8px;font-weight:900;font-size:19px;line-height:1.25}
.verd .i{width:26px;height:26px}
.ovf.ok .verd{color:var(--go)}
.ovf.bad .verd{color:var(--bad)}
.expl{font-family:var(--read);font-size:16px;line-height:1.5;max-height:30vh;max-height:30dvh;overflow-y:auto}
.big{font-size:27px;font-weight:900;line-height:1.15}
.qtop{display:flex;align-items:center;justify-content:space-between;gap:10px}
.qq{font-weight:800;font-size:20px;line-height:1.3}
.opts{display:grid;gap:10px}
.opt{display:grid;grid-template-columns:30px 1fr;gap:12px;align-items:start;width:100%;padding:14px;border-radius:16px;background:var(--card);border:2px solid var(--line);box-shadow:0 3px 0 0 var(--line);font-size:16.5px;line-height:1.4;text-align:left}
.opt>b{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;border:2px solid var(--line);font-weight:900;font-size:14px;color:var(--ink-3)}
.opt.sel{border-color:var(--l1);background:var(--l1-soft);box-shadow:0 3px 0 0 var(--l1)}
.opt.sel>b{border-color:var(--l1);color:var(--l1)}
.opt.ok{border-color:var(--go);background:var(--go-soft);box-shadow:0 3px 0 0 var(--go)}
.opt.ok>b{border-color:var(--go);color:var(--go)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft);box-shadow:0 3px 0 0 var(--bad)}
.opt.bad>b{border-color:var(--bad);color:var(--bad)}
.opt:disabled{cursor:default;color:var(--ink)}
.duo{display:grid;gap:10px}
.duo .opt{grid-template-columns:1fr;text-align:center;font-weight:900;font-size:18px;min-height:64px;align-items:center}
.defq{padding:16px;border-radius:16px;background:var(--card);border:1px dashed var(--line)}
.pstep{display:flex;align-items:center;gap:14px}
.pnum{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:26px;color:#fff;background:var(--lcb);flex:none}
.pdots{display:flex;gap:6px}
.pdots i{width:22px;height:6px;border-radius:3px;background:var(--soft)}
.pdots i.on{background:var(--lc)}
.imagem{display:grid;grid-template-columns:30px 1fr;gap:12px;padding:20px 18px;border-radius:18px;background:var(--ls);font-family:var(--read);font-style:italic;font-size:20px;line-height:1.55}
.imagem .i{width:28px;height:28px;color:var(--lc);margin-top:3px}
.fcard{display:flex;flex-direction:column;justify-content:center;gap:16px;width:100%;min-height:42vh;min-height:42dvh;padding:22px 20px;border-radius:24px;background:var(--card);border:1px solid var(--line);border-top:8px solid var(--lc);box-shadow:0 12px 30px -18px var(--shadow);text-align:left}
.fcard .big{font-size:24px}
.fcard .ans{padding-top:14px;border-top:1px dashed var(--line);font-size:18px}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.gb{display:grid;justify-items:center;gap:1px;min-height:62px;padding:8px 4px 6px;border-radius:14px;border:2px solid var(--line);background:var(--card);box-shadow:0 3px 0 0 var(--line)}
.gb b{font-weight:900;font-size:16.5px}
.gb small{font-size:12px;font-weight:700;color:var(--ink-3)}
.gb.g0{border-color:var(--bad);box-shadow:0 3px 0 0 var(--bad)}.gb.g0 b{color:var(--bad)}
.gb.g2{border-color:var(--go);box-shadow:0 3px 0 0 var(--go)}.gb.g2 b{color:var(--go)}
.gb:active{transform:translateY(2px);box-shadow:none}
.win{display:grid;justify-items:center;gap:10px;text-align:center;padding:26px 0 6px}
.wic{width:96px;height:96px;border-radius:50%;display:grid;place-items:center;background:var(--lcb,var(--go-bg));color:#fff}
.wic .i{width:54px;height:54px;stroke-width:3}
.xpb{display:inline-flex;align-items:center;gap:6px;font-weight:900;font-size:17px;padding:8px 16px;border-radius:99px;background:color-mix(in srgb,var(--gold) 18%,var(--card));color:var(--ink)}
.xpb .i{color:var(--gold)}
.score{position:relative;display:grid;place-items:center}
.score b{position:absolute;font-weight:900;font-size:24px;font-variant-numeric:tabular-nums}
.badge{display:inline-flex;align-items:center;gap:8px;font-weight:900;padding:8px 14px;border-radius:12px;background:color-mix(in srgb,var(--gold) 20%,var(--card));border:2px solid var(--gold)}
.badge .i{color:var(--gold)}
.wq{display:grid;gap:6px;padding:12px 0;border-top:1px solid var(--line);text-align:left}
.wq:first-child{border-top:0}
.wq .oka{display:grid;grid-template-columns:22px 1fr;gap:6px;color:var(--go);font-weight:700;font-size:15.5px}
.wq .e2{font-family:var(--read);font-size:15px;color:var(--ink-2);line-height:1.45}

/* feedback */
.toast{position:fixed;left:50%;top:calc(10px + env(safe-area-inset-top));z-index:40;transform:translate(-50%,-160%);display:flex;align-items:center;gap:8px;max-width:calc(100% - 32px);padding:10px 16px;border-radius:99px;background:var(--ink);color:var(--bg);font-weight:900;font-size:15px;box-shadow:0 8px 24px -10px var(--shadow);transition:transform .25s;pointer-events:none}
.toast .i{width:20px;height:20px;color:var(--gold)}
.toast.show{transform:translate(-50%,0)}
.cf{position:fixed;inset:0;pointer-events:none;z-index:30;overflow:hidden}
.cf i{position:absolute;top:-16px;width:9px;height:15px;border-radius:2px;animation:fall 1.5s cubic-bezier(.2,.6,.4,1) forwards}
@keyframes fall{to{transform:translateY(108vh) rotate(560deg)}}
@keyframes pop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:no-preference){
  .wic{animation:pop .45s ease-out}
  .ovb.anim>*{animation:rise .22s ease-out}
}
@keyframes rise{from{opacity:.3;transform:translateY(6px)}}
@media (prefers-reduced-motion:reduce){.toast,.pbar i,.btn,.acc summary>.i{transition:none}}
@media (min-width:600px){.achs{grid-template-columns:repeat(3,1fr)}}
</style>

<script>
(function(){
'use strict';
const D={"estacoes":[{"id":"identidade","linha":"np1","n":1,"nome":"Identidade","autor":"Silvia Lane","obra":"O que é Psicologia Social · Introdução e “Como nos tornamos sociais”","paginas":"pp. 7 a 24","bilhete":"Ninguém se torna gente sozinho: grupos, normas e papéis fazem a nossa identidade, e só a **consciência de si** permite transformar o que parecia natural.","imagem":"Um bebê no colo: já é um grupo de dois, a **díade**. Em volta dele, uma plateia invisível de **normas** dizendo como pai, mãe e filho devem agir.","historia":["A Psicologia estuda o comportamento. A **Psicologia Social** estuda o comportamento **enquanto ele é influenciado socialmente**, e isso começa antes do nascimento, nas condições históricas da família.","A influência social chega sobretudo pela **linguagem**: os significados do grupo definem a visão de mundo, os valores, o que é reforçador e até o que nos alegra ou amedronta.","Desde o nascimento vivemos em **grupos** (o primeiro é a **díade**). Cada grupo tem **normas**, e as normas definem os **papéis sociais**, que são **complementares**: só existe chefe se existir chefiado.","A individualidade existe, mas dentro de limites: “pode casar com quem quiser, desde que seja com o João”. Quanto mais a relação importa para manter a sociedade, mais rígido é o papel (a **rainha Elizabeth** no Parlamento x o **Zé da Silva** no estrangeiro).","A **identidade social** é o conjunto de papéis que desempenhamos e faz **mediação ideológica**: parece livre e natural, mas é determinada pelas condições materiais. A **consciência de si** descobre essas razões históricas e pode tornar o grupo **agente de mudança**."],"conceitos":[{"t":"Psicologia Social (Lane)","d":"Estuda a **relação essencial entre indivíduo e sociedade**, esta entendida **historicamente**. A grande preocupação atual: saber como o homem se insere no processo histórico, **não só como é determinado, mas como se torna agente da história**."},{"t":"Comportamento","d":"Toda e qualquer ação: a **reflexa**, a **consciente** (experiências, pensamentos, ações intencionais) e, num plano não observável diretamente, o **inconsciente**."},{"t":"Leis gerais x história do grupo","d":"A lei geral diz que se aprende quando há reforço, mas **é a história do grupo que diz o que é reforçador** (doce, dinheiro, sorriso) e o que “deve ser aprendido”. As emoções são universais, mas **o que** nos alegra ou amedronta é social (a vitória do time, o medo de avião)."},{"t":"Díade","d":"Grupo de dois. Ao nascer, o ser humano precisa de pelo menos mais uma pessoa para sobreviver, então **já nasce membro de um grupo**. Crianças criadas por animais tiveram adaptação muito difícil ao voltar ao convívio humano."},{"t":"Normas","d":"Regem as relações no grupo. Vão das **sutis** (o “bom-tom”) às **rígidas** e às que viram **leis**, punidas por autoridades. São elas que caracterizam os **papéis sociais**."},{"t":"Papéis sociais","d":"Expectativas de comportamento definidas por normas. São **complementares**: para agir como chefe é preciso haver chefiados que deem sentido à ação. Quanto mais a relação é fundamental para manter a sociedade, **mais precisas e rígidas** são as normas."},{"t":"Liberdade com limite","d":"Podemos variar à vontade **desde que as relações essenciais se mantenham**. Onde a atividade não ameaça a ordem, há mais liberdade; onde pode abalar a produção, sobra só um **“estilo”** (mais sorridente, mais sério). Até os “marginais” servem para reafirmar os “sérios e trabalhadores”."},{"t":"Identidade social","d":"O que nos caracteriza como pessoa: **o que respondemos quando perguntam “quem é você?”**. Forma-se no confronto de **diferenças e semelhanças** com os outros e é definida pelo **conjunto de papéis** que desempenhamos."},{"t":"Mediação ideológica","d":"Identidade e papéis criam a **ilusão** de que são **naturais e necessários** e de que a identidade vem de **opções livres**, quando na verdade são as **condições sociais da produção da vida material** que os determinam. Eles reproduzem as relações de **dominação** como se fossem “naturais e universais”."},{"t":"Consciência de si","d":"Questionar como os nossos papéis foram definidos pela sociedade e encontrar as **razões históricas** de agirmos como agimos. Ela **pode alterar a identidade social**; quando o grupo percebe a dominação que reproduz, pode virar **agente de mudança social**."},{"t":"Instituições","d":"Cristalizam grupos e papéis e estão “**bem aparelhadas para anular ou amenizar os questionamentos**” dos grupos, em nome da “preservação social”."}],"tabelas":[{"titulo":"Mais determinado x menos determinado","cols":["","Rainha Elizabeth","Zé da Silva"],"rows":[["Situação","Abertura do Parlamento","Num país estranho, por conta própria, como cidadão comum"],["Papel","**Totalmente definido**: qualquer ação fora do protocolo gera confusão","Quase sem as determinações daquela sociedade: “pode ser ele mesmo”"],["Lição","O trabalhador diante da máquina e do chefe também segue protocolo rígido","A liberdade aparece onde a sociedade não depende do papel"]]}],"nomes":[["Leontiev","“A consciência individual do homem só pode existir nas condições em que existe a consciência social.”"],["A jovem de 17 anos","Bailarina que se diz “indecifrável, uma incógnita”: forma de **não se comprometer** com uma identidade definitiva, típica da adolescência"],["O “cara simples”","“Gosta de fazer xixi na rua”: um jeito de dizer “não me amolem” ou “me deixem ser criança”"],["Personalidade (nota de Lane)","Conjunto de características **bio-fisio-sócio-psicológicas** peculiares ao indivíduo"]],"pegadinhas":["Para Lane, a identidade social **não** é fruto de opções livres, genética ou temperamento: é determinada pelas **condições históricas e materiais**. Por isso tem função **ideológica**.","Os papéis são **complementares**. Se a questão disser que um papel existe sozinho, está errada.","A liberdade de mostrar a personalidade também é **historicamente determinada**: é maior onde não ameaça a ordem.","Consciência de si **não** é introspecção solitária: é questionar a **determinação histórica** dos papéis, de preferência com o grupo."],"ganchos":["A ordem do capítulo: **DI-NO-PA-I-CO**: **Dí**ade, **No**rmas, **Pa**péis, **I**dentidade, **Co**nsciência de si.","**Rainha x Zé**: quanto mais a sociedade depende do papel, menos liberdade."],"conexoes":[{"para":"socializacao","x":"Berger e Luckmann também dizem que a identidade é **formada por processos sociais** e mantida pelas relações."},{"para":"ideologia","x":"Chaui explica o mecanismo que Lane chama de mediação ideológica: o que é **histórico** aparece como **natural**."},{"para":"brasil","x":"A pergunta da introdução (como o homem vira **agente da história**) é o desafio que move a psicologia social brasileira."}]},{"id":"linguagem","linha":"np1","n":2,"nome":"Linguagem e família","autor":"Silvia Lane","obra":"O que é Psicologia Social · “Como apreendemos o mundo que nos cerca” e “A família”","paginas":"pp. 25 a 46","bilhete":"A palavra é ferramenta e também arma: quem impõe um **significado único** comanda a ação dos outros. A contra-arma é **pensar** entre a palavra e a ação.","imagem":"Um soldado que obedece no automático ao som do comando. Entre a boca do sargento e o corpo do soldado, falta um **ponto de interrogação**.","historia":["A linguagem nasceu quando os seres humanos precisaram **cooperar para sobreviver**: como os instrumentos, ela serve para **generalizar e transmitir a prática** (Leontiev).","Com a divisão do trabalho e a propriedade privada, a linguagem fica abstrata e permite outra divisão: **trabalho manual x intelectual**, quem “faz” x quem “fala”.","Agir, pensar e falar são inseparáveis. Separá-los é **alienação**: agir sem pensar é ser **autômato**; falar sem pensar, **papagaio**; falar sem agir, “de boas intenções o inferno está cheio”.","A palavra vira **arma de dominação** quando uma autoridade impõe um **significado único e inquestionável** que gera ação automática (Terwilliger: **hipnose, comando militar, lavagem cerebral**). Onde não há experiência direta (Deus, morte, sociedade), autoridades impõem **representações** e passam a **ideologia dominante**.","Na **família**, os **outros significativos** ensinam, com afeto, um **mundo único**. A família parece “natural e universal”, mas reproduz a **força de trabalho**, a **propriedade** e as **relações de poder**: por isso é **conservadora**."],"conceitos":[{"t":"Linguagem (Leontiev)","d":"“**Aquilo através do que se generaliza a experiência da prática sócio-histórica da humanidade.**” Surgiu da cooperação para sobreviver e tornou possível o trabalho cooperativo e planejado."},{"t":"Comportamento verbal (Skinner)","d":"“Todo comportamento **reforçado através da mediação de outras pessoas**.” Inclui falar, escrever, sinais, gestos, código Morse e até **rituais**. Lane usa a definição para mostrar o caráter **instrumental** da linguagem."},{"t":"Manual x intelectual","d":"A autonomia da linguagem permitiu separar quem faz de quem fala. O intelectual, próximo e identificado com a **classe dominante**, vira “autoridade” por **falar bem**."},{"t":"Pensar antes de falar","d":"O bebê já pensa antes de falar: busca o chocalho escondido sob o lençol. Mas a linguagem é **condição** do desenvolvimento intelectual: generalizar, abstrair, planejar, **superar o aqui e agora**."},{"t":"Palavra x objeto","d":"“O significado da palavra **alimento** não contém um grama de substância alimentícia” (Leontiev). É nessa distância entre palavra e objeto que a linguagem pode virar **arma**."},{"t":"A palavra que domina","d":"A palavra fica poderosa quando uma **autoridade** impõe um **significado único e inquestionável** que provoca **ação automática**."},{"t":"Contra-arma","d":"**Ampliar, questionar e pensar** o significado, em vez de só reagir à palavra. Terwilliger ironiza: bastaria **ensinar o soldado a pensar** para ele resistir à lavagem cerebral, solução que nenhum comandante aprovaria."},{"t":"Representação (Lane)","d":"“O **sentido pessoal** que atribuímos aos **significados elaborados socialmente**.” Une ação/experiência com os significados que os outros dão (a criança e a “bola”). Ex.: “a Terra tem forma de laranja”, “a vida já vem escrita pelo destino”, “rico é quem soube poupar”."},{"t":"Ideologia (Lane)","d":"Explicações coerentes que **encobrem as relações de poder** e justificam a sociedade como ela é: **função ideológica falseadora**. **Não é produzida conscientemente**: vem da visão de quem domina e precisa justificar a dominação."},{"t":"Consciência de classe","d":"Nasce de **confrontar as representações com as próprias ações e experiências** e com as do grupo. Quem só reproduz representações e chama as incoerências de “exceção” reproduz a dominação."},{"t":"Fazer x falar","d":"Só o **fazer** produz objetos e a própria vida; o falar pode dar a impressão de produzir sem produzir nada. O livro só tem sentido se **mudar comportamentos**: aí “o falar se torna fazer”."},{"t":"Família","d":"Grupo necessário à sobrevivência, vista como “natural e universal”. Mas também **reproduz a força de trabalho** e **perpetua a propriedade**, por isso sofre **controle social rigoroso**. Seus papéis **reproduzem as relações de poder** da sociedade."},{"t":"Outros significativos (em Lane)","d":"Pessoas com quem a criança se **identifica emocionalmente**. O mundo deles vira **o** mundo, sem alternativas. Pela **generalização**, o “não mexa aí!” repetido por todos vira valor tão arraigado que parece inato."},{"t":"Adolescência","d":"A visão única só é confrontada na **socialização secundária** (escola, profissão). O jovem questiona os outros significativos **não por ser uma fase natural**, mas porque encontra **outras visões de mundo**."}],"tabelas":[{"titulo":"Como a palavra domina (Terwilliger)","cols":["Situação","Como funciona"],"rows":[["**Hipnose**","Passividade total à voz do hipnotizador. Só funciona com situações **conhecidas**: em idioma desconhecido, fracasso"],["**Comando militar**","Toda ordem é lei; a palavra tem **um só significado**; o soldado não deve pensar, os superiores pensam por ele"],["**Lavagem cerebral**","Eliminar significados antigos **isolando** o prisioneiro; só convive com quem repete os novos; cansaço, fome e abandono tornam essas pessoas **significativas**"]]},{"titulo":"Família: quem manda (sociedade brasileira, segundo Lane)","cols":["Onde","Poder"],"rows":[["Família nuclear","Máximo de autoridade no **marido e pai**"],["Família extensa","Autoridade concentrada nos **avós**"],["Mulher","Dela se espera **submissão**; poder relativo sobre os filhos no dia a dia"],["Entre os filhos","O **mais velho** pode mais que o segundo; o **filho homem**, mais que a filha"]]}],"nomes":[["Leontiev","Linguagem generaliza a prática; o exemplo do **alimento**"],["Skinner","Comportamento verbal: reforçado pela **mediação de outras pessoas**"],["Terwilliger","Hipnose, comando militar e lavagem cerebral"],["“Quatrocentões”","Famílias tradicionais que casavam **entre parentes** para manter os bens; com imigração e indústria, passam a casar fora para fazer alianças"],["Mônica x Magali","O cômico é o inusitado: a Mônica dominadora é o “errado” que **reforça o certo**"]],"pegadinhas":["Para Lane, a rebeldia do adolescente **não é fase natural**: vem do contato com outras visões de mundo.","A hipnose **falha** com situações desconhecidas. Ela depende de referências que o hipnotizado já conhece.","A ideologia, em Lane, **não é produzida de propósito**: nasce da posição de quem domina.","Os homens lutam pelo poder na família “**não instintivamente, mas inconscientemente**”: sem confrontar o significado social com a realidade vivida.","Monogamia e virgindade, segundo Lane, ligam-se à **preservação da propriedade** e à legitimidade dos herdeiros, não à “natureza”."],"ganchos":["**Autômato, papagaio, inferno**: os três jeitos de separar agir, pensar e falar.","**Hipnose, quartel, lavagem**: a palavra que manda. Contra-arma: um **?** entre a palavra e a ação."],"conexoes":[{"para":"ideologia","x":"Chaui também liga a ideologia à separação entre **trabalho material e intelectual**."},{"para":"socializacao","x":"Berger e Luckmann: **outros significativos**, mundo único da infância, socialização primária e secundária, linguagem como o que mais se interioriza."},{"para":"representacoes","x":"Lane já fala em **representações sociais**; Moscovici transforma isso numa teoria (ancoragem e objetivação)."}]},{"id":"brasil","linha":"np1","n":3,"nome":"Brasil","autor":"Silvia Lane","obra":"O que é Psicologia Social · “A Psicologia Social no Brasil”","paginas":"pp. 75 a 84","bilhete":"A pergunta de **Comte** era como o indivíduo pode ser causa e consequência da sociedade. Os EUA responderam com **ajustamento**, a **crise** mostrou o limite, e o Brasil criou a **Abrapso** para transformar a realidade.","imagem":"Três pesquisadores de três países, em **Lima, 1979**, descobrindo no palco que diziam a mesma coisa sem nunca terem combinado.","historia":["**Augusto Comte** (1830-1834), para muitos o fundador da Psicologia Social, via a PS como subproduto da Sociologia e da Moral, capaz de responder: “**como pode o indivíduo ser, ao mesmo tempo, causa e consequência da sociedade?**”","A PS científica só se desenvolve **depois da Primeira Guerra**, para entender as crises: liderança, opinião pública, propaganda, preconceito, mudança de atitudes. Nos **EUA**, pragmáticos, ela chega ao **auge a partir da Segunda Guerra**, buscando **ajustar** o indivíduo; a sociedade vira **pano de fundo** e o comportamento é explicado por **causas internas**.","Depois do otimismo dos anos 50, nada mudava (preconceito, greves, miséria) e as pesquisas se **contradiziam**. Acumular dados para depois teorizar se mostrou inviável: é a “**crise da Psicologia Social**”. No fim dos anos 60, a **Europa** (França e Inglaterra) denuncia o **caráter ideológico** da PS norte-americana.","A América Latina só reproduzia os EUA. Em **Miami (1976)** a crise é denunciada **sem propostas**; em **Lima (1979)** surgem críticas precisas e **propostas**: México, Peru e Brasil apresentam “três visões, uma só perspectiva”.","No Brasil, **Otto Klineberg** introduz a PS na **USP** nos anos 50 (primeiro livro de PS no país: tradução dele, **1959**). Depois de Lima, um Encontro de Psicologia Social propõe a **Abrapso**, cujo documento denuncia a **dependência cultural** e o confinamento acadêmico do psicólogo social, que tem **sentido político**."],"conceitos":[{"t":"A pergunta de Comte","d":"“Como pode o indivíduo ser, ao mesmo tempo, **causa e consequência** da sociedade?” Comte, “considerado por muitos o fundador da Psicologia Social”, via a PS como **subproduto da Sociologia e da Moral**."},{"t":"PS norte-americana","d":"Auge a partir da **Segunda Guerra**, com tradição **pragmática**: técnicas de intervenção para **ajustar e adequar** o indivíduo ao contexto. A sociedade é **pano de fundo**; o comportamento é explicado por **traços, atitudes, motivos ou instintos**: **dicotomia indivíduo x sociedade**."},{"t":"Crise da Psicologia Social","d":"Pesquisas contraditórias (uma acha relação positiva entre duas variáveis, outra negativa, outra nenhuma) e a proposta de **acumular dados para depois teorizar** fracassa. Título de vários artigos nos EUA e na Europa."},{"t":"Crítica europeia","d":"No **fim dos anos 60**, principalmente **França e Inglaterra** denunciam o **caráter ideológico** da PS norte-americana, **mantenedora das relações sociais**."},{"t":"Miami x Lima","d":"**Miami, 1976**: o Congresso Interamericano denuncia a crise, com críticas metodológicas e teóricas, **sem propostas concretas**. **Lima, 1979**: críticas mais **precisas** e **novas propostas** para redefinir a PS."},{"t":"Otto Klineberg","d":"Professor que **introduziu a PS na USP** nos anos 50. A tradução do livro dele (**1959**) foi o **primeiro livro de PS publicado no Brasil**, com temas como Cultura e Personalidade, Atitudes e Opiniões, Interação Social e Dinâmica de Grupo."},{"t":"O desafio brasileiro","d":"Alunos e professores perguntavam: “compreendemos como o indivíduo é influenciado pela sociedade, mas **como ele poderá se tornar autor desta sociedade?**” Lane brinca: estávamos na “estaca zero”, **igual a Comte**."},{"t":"Abrapso","d":"Proposta num **Encontro de Psicologia Social** organizado depois de Lima por psicólogos ligados à Alapso, para **maior intercâmbio** entre cientistas de diferentes regiões."},{"t":"Dependência cultural","d":"O documento denuncia que o Brasil **importa teorias** nem sempre aplicáveis e escolhe temas **sem relevância** para o contexto brasileiro, porque a formação do psicólogo é **carente de visão da realidade sociocultural**. Saída: contato com **outros cientistas sociais**."},{"t":"Proposta do documento","d":"Como a maioria da população não tem acesso ao atendimento psicológico da elite, cabe ao psicólogo social uma **assistência psicológica em larga escala**, junto a **grupos e organizações populares**."}],"tabelas":[{"titulo":"Os 3 campos do psicólogo social brasileiro (documento da Abrapso)","cols":["Campo","O que acontece"],"rows":[["**Universidade**","Poucos cientistas trabalham em **isolamento**, buscando eco no exterior"],["**Indústria**","**Seleção de pessoal** e **ajustamento** dos empregados às condições oferecidas"],["**Manipulação da opinião pública**","Técnicas a serviço dos **interesses econômicos e políticos dominantes**"]]}],"nomes":[["Comte, 1830-1834","Obras sobre a natureza das ciências; para muitos, o fundador da PS"],["Após a 1ª Guerra","A PS vira estudo científico e sistemático"],["A partir da 2ª Guerra","Auge da PS nos **EUA**"],["Fim dos anos 60","Críticas europeias (França e Inglaterra)"],["Miami, 1976","Crise denunciada, sem propostas"],["Lima, 1979","Críticas precisas e propostas; Simpósio com México, Peru e Brasil"],["Otto Klineberg","PS na USP nos anos 50; primeiro livro de PS no Brasil (1959)"],["1962","Criação dos cursos de Psicologia no Brasil"],["Marília de Andrade","Apresentou o documento do I Encontro Nacional de Psicologia Social"]],"pegadinhas":["Para Lane, quem é “considerado por muitos o fundador da Psicologia Social” é **Comte**, não Wundt.","**Miami (1976)** denunciou a crise **sem propostas**; as propostas vieram em **Lima (1979)**.","A crise **não** foi falta de dados: foi excesso de dados **contraditórios** e falta de teoria.","As críticas mais incisivas vieram da **Europa**, no fim dos anos 60.","O documento diz que o confinamento do psicólogo social à universidade **tem sentido político**."],"ganchos":["**Comte pergunta, EUA ajustam, Europa denuncia, Lima propõe, Abrapso transforma.**","**Miami murmura** (só critica), **Lima lança** (propõe)."],"conexoes":[{"para":"historia","x":"Bernardes conta a mesma crise (Miami 1976, Lima 1979) e diz que a **Abrapso surge em 1980**, com Silvia Lane."},{"para":"identidade","x":"O desafio “como o indivíduo vira **autor** da sociedade” é a mesma pergunta da introdução de Lane."},{"para":"atitudes","x":"Atitudes, opinião e propaganda eram os temas típicos da PS norte-americana que o Brasil importou."}]},{"id":"historia","linha":"np1","n":4,"nome":"História","autor":"Jefferson de Souza Bernardes","obra":"Psicologia Social Contemporânea (Strey et al.) · capítulo “História”","paginas":"pp. 22 a 42 do PDF","bilhete":"Quem conta a história escolhe o que esquece. O **positivismo** contou a PS por autores e ideias e apagou a psicologia social de **Wundt** e de **Mead**; **Farr** conta por **guerras, instituições e fatos**.","imagem":"A certidão de nascimento da Psicologia (pai **Wundt**, mãe **Filosofia**, maternidade **Leipzig, 1879**) com metade das páginas arrancadas: ali estava a **Völkerpsychologie**.","historia":["A história é **contínua, mas não linear**: tem idas e vindas, e o presente **ressignifica** o passado. Contar só por autores e ideias privilegia o **positivismo**, que reduz ciência a **método experimental**.","**Wundt** tinha 3 objetivos: psicologia **experimental** (Leipzig, 1879), uma **metafísica científica** (Lógica, Ética, Sistemas Filosóficos) e uma **psicologia social**, a **Völkerpsychologie** (10 volumes, 1900-1920). Os positivistas guardaram só o primeiro: é o “**repúdio positivista de Wundt**” (Danziger, 1979).","“**O longo passado e a curta história**” (Ebbinghaus, 1908): a psicologia ganhou “certidão de nascimento”. Na PS, **Allport** e **Lindzey** marcaram o “corte positivo” com o **Handbook de 1954** e jogaram o de **Murchison (1935)** no passado “metafísico”; Allport põe **Comte** como ancestral.","**Farr (1996)** conta por fatos: a PS está para a **2ª Guerra** como os testes psicométricos para a **1ª**. A migração dos **gestaltistas** fez nascer nos EUA uma **PS cognitiva**; Yale estudou **mudança de atitude**; no MIT, **Lewin** criou o **Centro de Pesquisa em Dinâmica de Grupo (1945)**. A PS americana é uma **forma psicológica**, que individualiza o social.","No Brasil, a PS era importada dos EUA (ex.: **Rodrigues**, 1976-1981) até a **crise** (Miami 1976, Lima 1979). A palavra de ordem vira **transformação social**: surge a **Abrapso (1980)**, com **Silvia Lane**, e o marco “**Psicologia social: o homem em movimento**” (Lane e Codo, 1984)."],"conceitos":[{"t":"História relativista","d":"A perspectiva, o texto e o contexto do autor delimitam o recorte. O processo histórico é **contínuo, mas não linear**; as rupturas são **lentamente preparadas**; o **simbólico** (os sentidos que damos às coisas) transforma a relação com o tempo."},{"t":"Repúdio positivista de Wundt","d":"Expressão de **Danziger (1979)** para o recorte que guardou só o Wundt do **laboratório** e jogou fora a metafísica científica e a **psicologia social**."},{"t":"Völkerpsychologie","d":"“Psicologia do povo” ou “das massas”: **10 volumes (1900-1920)** sobre **linguagem, pensamento, cultura, mitos, religião e costumes**, fenômenos **coletivos** que **não podem ser reduzidos à consciência individual** nem estudados pela introspecção de laboratório."},{"t":"Método experimental-introspectivo","d":"O método do primeiro Wundt. Ele mesmo reconheceu o limite para fenômenos coletivos. **William James** comparou usá-lo nos processos superiores a “**acender uma luz para ver melhor a escuridão**”."},{"t":"Os 3 estágios de Comte","d":"**Teológico** (mítico, religioso) → **metafísico** (filosófico, sem método rigoroso) → **positivo** (científico). Para um positivista, a metafísica científica de Wundt era um **retrocesso**."},{"t":"Longo passado, curta história","d":"Frase de **Ebbinghaus (1908)**: a curta história começaria com Wundt em 1879. Na PS, o “ponto sem retorno” seria o **Handbook de Lindzey (1954)**."},{"t":"Os Handbooks","d":"**Murchison (1935)**, **Lindzey (1954)**, **Lindzey e Aronson (1968-1969; 1985)**. Em 1954, **Allport** escreve a história da PS e põe **Comte** como ancestral; em 1985, **Jones** escreve a “Psicologia social moderna”: a curta história **experimental** do pós-guerra."},{"t":"Farr: fatos e instituições","d":"Guerras: **The American Soldier (1949, Stouffer)**; o **Tribunal de Nuremberg** definiu procedimentos **éticos** para pesquisa com humanos; a **Escola de Frankfurt** emigra e estuda a **personalidade autoritária (Adorno, 1950)**."},{"t":"Migração e Gestalt","d":"O nazismo levou aos EUA **Lewin, Heider, Köhler, Wertheimer** e outros. Do conflito **fenomenologia x positivismo** nasceu uma forte **psicologia social cognitiva**, “fenômeno caracteristicamente **americano**”, mas de raízes **europeias**."},{"t":"Universidades","d":"**Yale**: programa do pós-guerra sobre **comunicação e mudança de atitude** (Stouffer, **Hovland**). **MIT**: **Lewin** funda em **1945** o **Centro de Pesquisa em Dinâmica de Grupo**; após a morte dele (1947), o centro vai para **Michigan** com **Cartwright**."},{"t":"Formas psicológicas x sociológicas (Farr)","d":"**Psicológicas**: reduzem o social a **leis individuais** (individualização); ex.: Allport, behaviorismo, Gestalt, psicologia cognitiva. **Sociológicas**: relacionam individual e coletivo sem reduzir a nenhum dos dois; ex.: **Representações Sociais (Moscovici)** e **behaviorismo social (Mead)**."},{"t":"Os esquecidos","d":"1) A perspectiva **marxista**, ausente dos Handbooks e de Schultz e Schultz (que dedicam 13 páginas a Wundt **sem citar a Völkerpsychologie**). 2) **George H. Mead** e seu **behaviorismo social**: linguagem como fenômeno social e o **self** como mediação entre mente e sociedade."},{"t":"Crise na América Latina","d":"Pontos: **dependência** teórico-metodológica dos EUA, **descontextualização** dos temas, **superficialidade**, **individualização do social** e falta de preocupação **política**. A palavra de ordem: **transformação social**."},{"t":"Alapso x Abrapso","d":"A **Alapso** (anos 60) foi levada por **Aroldo Rodrigues e J. Varela** ao extremo da PS norte-americana, e houve rechaço. Surgem a **Avepso** (Venezuela) e a **Abrapso (1980)**, com **Silvia Lane**, de base **materialista histórico-dialética**, em plena **ditadura militar**."}],"tabelas":[{"titulo":"Os 3 objetivos de Wundt","cols":["Objetivo","O que fez","Quando"],"rows":[["1. Psicologia **experimental**","Laboratório de Leipzig; objeto: a experiência imediata à consciência; método experimental-introspectivo","Laboratório em **1879**"],["2. **Metafísica** científica","Três obras: **Lógica, Ética e Sistemas Filosóficos**","**1880 a 1900**"],["3. Psicologia **social**","**Völkerpsychologie**, 10 volumes","**1900 a 1920**"]]},{"titulo":"Duas formas de contar a história","cols":["","Positivista","Farr (1996)"],"rows":[["Centrada em","**Autores e ideias**","**Instituições, fatos** e pesquisas publicadas"],["Critério de ciência","**Método experimental**","Contexto histórico e institucional"],["Exemplo","Allport, Jones, Schultz e Schultz","Guerras, migração, Yale, MIT, Nuremberg"]]}],"nomes":[["Farr (1996)","História por **instituições e fatos**; PS moderna “americana com raízes europeias”"],["Danziger (1979)","“Repúdio positivista de Wundt”"],["Ebbinghaus (1908)","“Longo passado e curta história”"],["Allport (1924)","“Não há psicologia dos grupos que não seja essencialmente uma psicologia dos indivíduos”"],["Stouffer, 1949","The American Soldier"],["Adorno et al., 1950","A personalidade autoritária (Escola de Frankfurt)"],["Lewin, MIT, 1945","Centro de Pesquisa em Dinâmica de Grupo; morre em 1947"],["Blumer","Deu o nome **interacionismo simbólico** aos estudos de Mead, depois da morte dele (1931)"],["Abrapso, 1980","Silvia Lane; Lane e Codo (1984), “Psicologia social: o homem em movimento”"],["Psicologia e Sociedade","Revista semestral da Abrapso"]],"pegadinhas":["“Repúdio positivista de Wundt” é de **Danziger**; “longo passado e curta história” é de **Ebbinghaus**. Farr é quem conta a história por **instituições e fatos**.","Para os psicólogos sociais **experimentais**, o ancestral é **Comte** (Allport), não Wundt.","**Interacionismo simbólico** é nome dado por **Blumer**, não por Mead.","A **Alapso** não é a associação crítica: a crítica brasileira é a **Abrapso**.","Behaviorismo e Gestalt sustentam formas **psicológicas** de PS. Representações sociais e Mead são formas **sociológicas**.","A PS moderna é **americana** na forma, mas tem raízes **europeias**."],"ganchos":["Wundt tinha **3 L**: **L**aboratório, **L**ógica (a metafísica) e as **L**endas do povo (Völkerpsychologie). O positivismo só guardou o laboratório.","Farr conta pelos **3 F**: **F**rente de guerra, **F**uga dos gestaltistas, **F**aculdades (Yale e MIT)."],"conexoes":[{"para":"brasil","x":"Lane conta a mesma crise de dentro: ela organizou o Simpósio de Lima e ajudou a criar a Abrapso."},{"para":"grupos","x":"Lewin, a Gestalt e o Centro de Dinâmica de Grupo do MIT são o assunto de Mailhiot."},{"para":"representacoes","x":"As Representações Sociais são o exemplo de **forma sociológica** de PS."},{"para":"influencia","x":"**Aroldo Rodrigues**, autor dos textos de Atitudes e Influência, aparece aqui como exemplo da PS **importada** dos EUA."}]},{"id":"atitudes","linha":"np1","n":5,"nome":"Atitudes","autor":"Aroldo Rodrigues, Eveline Assmar e Bernardo Jablonski","obra":"Psicologia Social (Vozes, 33ª ed.) · “Atitudes: conceito e formação”","paginas":"pp. 173 a 206","bilhete":"Atitude é **pensar, sentir e estar pronto para agir** a favor ou contra algo. Buscamos **equilíbrio** (Heider) e **consonância** (Festinger), e o comportamento depende também de **norma, interesse e controle**.","imagem":"Alguém que pagou caro e sofreu num curso chato e sai jurando que foi ótimo: é a **dissonância** sendo apagada por dentro.","historia":["**Atitude** é uma organização duradoura de **crenças e cognições**, com **carga afetiva** pró ou contra um objeto social, que **predispõe a uma ação** coerente. Tem 3 componentes: **cognitivo, afetivo e comportamental**.","**Valores** são mais **gerais** que as atitudes: poucos valores reúnem muitas atitudes (Allport, Vernon e Lindzey; Schwartz).","As atitudes se formam por **aprendizagem** (reforço, modelagem), por **funções** que cumprem, pela **personalidade** (a autoritária), por **determinantes sociais** (classe, grupos de referência), por **ativação automática** e por **processos cognitivos**.","Dois enfoques cognitivos: **Heider (1946)**: preferimos relações **equilibradas** (tríade p-o-x). **Festinger (1957)**: buscamos **consonância** entre cognições, e a dissonância aparece em decisões, aquiescência forçada, exposição a informação e justificação insuficiente.","Atitude e comportamento: **La Piere (1934)** parece mostrar incoerência, mas o comportamento depende também de **normas, hábitos, consequências e da situação**. A previsão melhora com o **interesse investido** (Sivacek e Crano) e com a **Teoria da Ação Racional** (Fishbein e Ajzen)."],"conceitos":[{"t":"Atitude (definição)","d":"“Organização **duradoura** de crenças e cognições em geral, dotada de **carga afetiva pró ou contra** um objeto social definido, que **predispõe a uma ação** coerente com as cognições e afetos relativos a este objeto.” Forma-se no processo de **socialização**."},{"t":"Componente cognitivo","d":"Crenças e conhecimento sobre o objeto. **Sem representação cognitiva não há atitude** (o empregado de fazenda não tem atitude sobre a pressurização de uma nave espacial). Representação **vaga** = afeto pouco intenso; **errônea** não diminui o afeto (é o caso do preconceito)."},{"t":"Componente afetivo","d":"Sentimento pró ou contra: o **mais característico** das atitudes. Para **Fishbein**, é o **único**; crenças e comportamentos seriam só medidas. É o que diferencia atitude de **crença** e **opinião**, que podem não ter afeto nenhum."},{"t":"Rosenberg (1960)","d":"Mudou por **hipnose** o componente **cognitivo** de metade dos sujeitos e o **afetivo** da outra metade. O componente não alterado mudou para ficar **coerente**: a congruência afetivo-cognitiva se restaura sozinha."},{"t":"Componente comportamental","d":"A **predisposição à ação**. **Newcomb, Turner e Converse (1965)**: a atitude é um **estado de prontidão** que, diante de uma situação desencadeante, vira comportamento (o torcedor e o jogo). Para outros (Krech e Crutchfield; Katz e Stotland), a atitude **é a própria força motivadora**."},{"t":"PS como estudo das atitudes","d":"Em **1918**, **Thomas e Znaniecki** definiram a Psicologia Social como “**o estudo científico das atitudes**”."},{"t":"Valores","d":"Também têm componentes cognitivos, afetivos e de ação, mas diferem das atitudes pela **generalidade**: o valor “religião” reúne atitudes sobre Deus, Igreja, padres. **Rokeach (1968)** defende estudar valores: são **poucos**. A **mesma atitude** pode vir de **valores diferentes** (dar esmola por caridade ou para parecer poderoso)."},{"t":"Schwartz (1992, 1994)","d":"Valores são **metas trans-situacionais**. **10 tipos motivacionais** em **2 dimensões bipolares**: **abertura à mudança** (autodireção, estimulação) x **conservação** (segurança, conformidade, tradição); **autotranscendência** (benevolência, universalismo) x **autopromoção** (poder, realização). O **hedonismo** fica entre abertura e autopromoção."},{"t":"Funções das atitudes","d":"(a) obter **recompensas** e evitar castigos; (b) proteger a **autoestima** e evitar ansiedade; (c) **ordenar** informações complexas; (d) refletir **convicções e valores**; (e) estabelecer a **identidade social** (Katz e Stotland; Smith, Bruner e White)."},{"t":"Personalidade autoritária","d":"**Adorno et al. (1950)**: **ingrupismo**, gosto por **exercer e se submeter** à autoridade, rigidez de crenças, **etnocentrismo**, religião moralista de culpa e punição, puritanismo."},{"t":"Determinantes sociais","d":"**Classe social** (Centers, 1949) e **grupos de referência**: as alunas do **Bennington College** adotaram a posição liberal dos professores e **mantiveram por 25 anos** (Newcomb)."},{"t":"Ativação automática","d":"Pistas que nem chegam à consciência ativam atitudes (**Bargh**). Quem foi levado a pensar na **sede** ficou mais sensível a anúncios de bebida (Strahan, Spencer e Zanna, 2002)."},{"t":"Teoria do Equilíbrio (Heider, 1946)","d":"Leva os princípios **gestálticos** da percepção para a percepção de pessoas. Tríade **p-o-x** (pessoa, outro, objeto): é **equilibrada** com **3 sinais positivos** ou um **número par de negativos**. O desequilíbrio gera **tensão**."},{"t":"4 saídas do desequilíbrio","d":"Mudar o elo **p/o**, mudar o elo **p/x**, mudar o elo **o/x** ou **diferenciação**. Ex.: p é amigo de o, p é contra a pena de morte e o é a favor: p pode deixar de gostar de o, mudar de opinião, convencer o, ou gostar de o “mas não quando o assunto é pena de morte”."},{"t":"Outras forças (Rodrigues, 1985)","d":"Além do **equilíbrio**, atuam a **concordância** e a **positividade** (preferimos gostar a desgostar). Equilíbrio pesa quando se julga a **coerência**; concordância, quando se julga a **agradabilidade**; positividade, quando as pessoas vão **continuar em contato**."},{"t":"Dissonância cognitiva (Festinger, 1957)","d":"Buscamos **harmonia** entre cognições. Duas cognições relevantes são **dissonantes** quando “o oposto de uma decorre da outra” (saber que o carro A é melhor e comprar o B). **Brehm e Cohen (1962)**: precisa haver **compromisso** e **volição** (livre escolha). **Aronson (1968)**: o **eu**; não gostamos de parecer **estúpidos ou imorais**."},{"t":"Por que reduzimos?","d":"**Festinger**: a incoerência causa **tensão**. **Tedeschi (1971)**: só quando **outros sabem**. **Steele (1988)**: só quando o **eu está fraco**. Rodrigues, Costa e Corga (1993) confirmaram Festinger, com cautela; a redução foi máxima com outros sabendo e autoestima fraca."},{"t":"Críticas à dissonância","d":"Falta de clareza do “**decorre de**” (follows from), exclusão de participantes, réplicas imperfeitas. **Zajonc**: “não é uma teoria no sentido formal: é um **dispositivo heurístico**”. Saldo **positivo**: um “**diamante bruto**”."},{"t":"La Piere (1934)","d":"Viajou pelos EUA com um **casal chinês**: **66 hotéis e 184 restaurantes**, só **uma recusa**. Seis meses depois, por carta, **92%** dos **128** que responderam disseram que **recusariam** chineses. Parece incoerência entre atitude e comportamento."},{"t":"Leitura correta de La Piere","d":"**Triandis (1971)**: o comportamento depende também de **normas sociais, hábitos e consequências esperadas**, e há atitude em relação **à situação** (chineses bem-vestidos, com um americano, pagando). **Campbell (1963)**: nem há inconsistência. **Newcomb**: o comportamento é **resultante de múltiplas atitudes**."},{"t":"Myers (2010)","d":"A atitude prediz o comportamento quando é **específica**, **potente** (vem da experiência) e outras influências são minimizadas. O comportamento muda a atitude por **autoapresentação**, **autopercepção** e **dissonância**."},{"t":"Interesse investido","d":"**Sivacek e Crano (1982)**, Michigan, 1980: contra elevar de 18 para 21 anos a idade para beber. Quem seria atingido (média **18,5 anos**) topou fazer **8,97** telefonemas; **19,94 anos**, 3,77; **21,6 anos**, 1,25. Quanto **maior o interesse**, maior a coerência atitude-comportamento."},{"t":"Teoria da Ação Racional","d":"**Fishbein e Ajzen**: atitude é só o **afetivo**. **Intenção = peso × atitude em relação ao ato + peso × norma subjetiva** (o que os outros esperam + motivação para seguir), pesos por **regressão**; a intenção prediz o comportamento. Depois foram acrescentados **obrigação moral** (Gorsuch e Ortberg, 1983) e **controle** (Ajzen, 1991): o fumante que não consegue parar."}],"tabelas":[{"titulo":"Os 4 caminhos da dissonância","cols":["Situação","Experimento","Resultado"],"rows":[["**Depois de decidir**","**Brehm (1956)**: escolher entre dois produtos de US$ 20","Valoriza o **escolhido** e desvaloriza o **rejeitado**; mais forte quando eram parecidos"],["**Aquiescência forçada**","**Festinger e Carlsmith (1959)**: dizer que a tarefa chata era interessante por **US$ 1** ou **US$ 20**","Quem ganhou **US$ 1** passou a achar a tarefa mais interessante; US$ 20 = controle. **Cohen (1962)**: US$ 0,50 mudou mais que US$ 10"],["**Exposição à informação**","Festinger previa que fugimos da informação contrária","**Resultados ambíguos** (Freedman e Sears, 1965)"],["**Justificação insuficiente**","**Aronson e Mills (1959)**: teste embaraçoso para entrar num grupo de discussão sobre sexo","Quem sofreu mais achou a discussão chata **mais interessante**. **Gerard e Mathewson (1966)**: choques mais fortes, objetivo mais valorizado"]]},{"titulo":"Incentivo e mudança de atitude","cols":["Condição","Quanto maior o incentivo…","Teoria"],"rows":[["**Com** liberdade de escolha","**Menor** a mudança de atitude","**Dissonância**"],["**Sem** liberdade de escolha","**Maior** a mudança de atitude","**Incentivo** (Janis e Gilmore)"]]}],"nomes":[["Thomas e Znaniecki, 1918","PS = “o estudo científico das atitudes”"],["Rosenberg, 1960","Hipnose: cognição e afeto se reajustam"],["Allport, Vernon e Lindzey, 1951","6 valores: teoria, estética, praticalidade, atividade social, poder, religião"],["Schwartz, 1992-1994","10 tipos de valores, 2 dimensões bipolares"],["Adorno et al., 1950","Personalidade autoritária"],["Heider, 1946","Teoria do Equilíbrio (p-o-x)"],["Festinger, 1957","Teoria da Dissonância Cognitiva"],["Festinger e Carlsmith, 1959","US$ 1 x US$ 20"],["Aronson e Mills, 1959","Iniciação embaraçosa"],["La Piere, 1934","Casal chinês: 250 lugares, 1 recusa; 92% diriam não"],["Sivacek e Crano, 1982","Interesse investido (idade para beber)"],["Fishbein e Ajzen, 1980","Ação racional: atitude + norma subjetiva"]],"pegadinhas":["Na aquiescência forçada, **quem ganhou menos mudou mais** (com liberdade de escolha). Com mais dinheiro, a pessoa tem justificativa e não precisa mudar.","Tríade **equilibrada**: 3 positivos ou **2 negativos**. Com **1 ou 3** negativos, ela está **desequilibrada**.","Para **Fishbein**, a atitude é **só o afetivo**. A maioria dos autores fala em **3 componentes**.","Valores são **mais gerais e menos numerosos** que atitudes, não o contrário.","**La Piere não prova** que atitude e comportamento não têm relação: o comportamento é resultante de **várias** atitudes e normas.","A busca de informação consonante tem provas **ambíguas**; não é um resultado firme da teoria."],"ganchos":["Atitude = **3 C**: **C**abeça (cognitivo), **C**oração (afetivo), **C**orpo pronto para agir (comportamental).","Festinger: “**ganhou pouco, mentiu e acreditou**”. Aronson: “**sofreu para entrar, jura que é bom**”. Heider: “**menos par, tríade em paz**”.","Ação racional: **eu quero** (atitude) + **eles esperam** (norma) → **intenção** → ação. Depois: + **consigo** (controle) + **devo** (obrigação moral)."],"conexoes":[{"para":"grupos","x":"Aroldo estuda atitudes **individuais**; Lewin, em Mailhiot, estuda **atitudes coletivas** de grupo."},{"para":"historia","x":"Yale estudou **comunicação e mudança de atitude** no pós-guerra; Adorno e a personalidade autoritária aparecem nos dois textos."},{"para":"influencia","x":"Próxima estação: depois de **formar** atitudes, como os outros **influenciam** o que fazemos."},{"para":"brasil","x":"Atitudes e mudança de atitudes eram tema típico da PS norte-americana criticada por Lane."}]},{"id":"influencia","linha":"np1","n":6,"nome":"Influência","autor":"Aroldo Rodrigues, Eveline Assmar e Bernardo Jablonski","obra":"Psicologia Social (Vozes, 33ª ed.) · “Influência social”","paginas":"pp. 286 a 319","bilhete":"Influência social muda o **comportamento**, nem sempre a atitude. O grupo pesa até diante do óbvio (**Asch**), a autoridade leva longe (**Milgram**), uma **minoria consistente** vira a maioria, e cada **base de poder** produz um tipo de obediência.","imagem":"Uma sala com sete pessoas dizendo que a linha errada é a certa, e você, o oitavo, com a resposta certa presa na garganta.","historia":["Influência social é “a **essência** da Psicologia Social” (Aronson). Aqui o foco é mudar o **comportamento**, sem necessariamente mudar a **atitude**, que exige mudança **interna**.","Os clássicos: **Sherif (1935)**, no escuro, mostra julgamentos convergindo para uma **norma** comum; **Asch (1946)**, com linhas nítidas, vê cerca de **33%** das respostas seguirem a maioria errada; **Milgram (1965)** vê **62%** irem até **450 volts**, quando psiquiatras previam **1%**.","A conformidade varia com o **tamanho e a força do grupo**, a **autoestima**, a necessidade de aprovação, o **gênero**, a **cultura** (coletivistas conformam mais) e a **época** (vem caindo). Kelman separa **complacência, identificação e internalização**.","Uma **minoria** também influencia: a maioria tem poder pelo **número**, a minoria pelo **estilo**, com **consistência e perseverança** (Moscovici). Vendedores usam **táticas** (pé na porta, bola baixa, porta na cara…) e Varela aplica a **tecnologia social**.","**French e Raven** classificam as **bases do poder**: recompensa, coerção, legitimidade, referência, conhecimento e, com Raven, informação. **Rodrigues (1995)** mostra que obedecer por **recompensa, informação ou referência** parece mais **interno e controlável**, e por isso gera mais **responsabilidade**."],"conceitos":[{"t":"Influência x mudança de atitude","d":"O capítulo trata de **modificar comportamento**, não necessariamente atitude. Alguém pode fazer o outro agir de certo jeito sem mudar o que ele **pensa e sente**: mudança de atitude implica **mudança interna**."},{"t":"Sherif (1935)","d":"**Efeito autocinético**: num quarto escuro, um ponto de luz parado parece se mover. Com um aliado dando estimativas diferentes, os julgamentos **convergem** para uma **norma** comum, mantida depois. Diante de estímulo **ambíguo**, confiar nos outros até é **prudente**."},{"t":"Asch (1946)","d":"Estímulo **nítido**: qual linha tem o tamanho da linha-padrão? Os aliados erravam de propósito em 75% dos julgamentos e **cerca de 33%** das respostas do participante acompanhavam a maioria. A pressão **desaparecia** quando **uma única pessoa** quebrava a unanimidade."},{"t":"As 3 distorções de Asch","d":"**Ação**: viam o erro, mas não tinham coragem de se opor. **Julgamento**: achavam que o problema era com eles. **Percepção**: viam de fato a linha errada (só uma **pequena minoria**)."},{"t":"Réplicas de Asch","d":"**Whittaker e Meade (1967)**: americanos, brasileiros, libaneses, rodesianos e chineses. **Crutchfield**: cabines eletrônicas, sem aliados. **Smith et al. (2006)**: de **14%** (estudantes belgas) a **84%** (professores de Fiji), média **31,2%**."},{"t":"Tamanho do grupo","d":"**Asch**: a partir de **3** pessoas na maioria, aumentar não muda nada (Rosenberg confirmou). **Gerard (1968)**: aumento **linear**. **Latané (1981)**: importa também a **força da fonte** (status, credibilidade, poder) e a **proximidade**."},{"t":"Milgram (1965)","d":"30 botões, de **15 a 450 volts**, num falso estudo de aprendizagem. A “vítima” reclama aos 75 V, pede para sair aos 150 V, grita aos 180 V e se cala aos 300 V; silêncio contava como erro. **40 psiquiatras** previram **1%**; **62%** foram até o fim. Vítima **mais perto** = menos obediência; experimentador de **status maior** = mais."},{"t":"Leitura de Milgram","d":"Os participantes **atribuíam a responsabilidade ao experimentador**, como “um carrasco que segue ordens”. **Ross e Nisbett (1991)**: o caráter existe, mas pode ser **superado pela situação**. Réplicas: **Munique 85%**; Meeus e Raaijmakers (1995), com avaliações negativas no lugar de choques, **mais de 90%**; Burger (2009), resultado parecido."},{"t":"Fatores pessoais","d":"**Autoestima alta** = menos suscetível (Rodrigues e Cavalcanti, 1971). **Necessidade de aprovação** = mais conformidade (Snyder e Ickes). **Mulheres** se conformam um pouco mais, sobretudo em tarefas **pouco familiares** (Eagly)."},{"t":"Kelman (1958)","d":"Três respostas à pressão: **complacência** (evitar punição ou ganhar recompensa), **identificação** (com uma figura que admiramos) e **internalização** (achamos justo; a **mais duradoura**). Exemplo de Aronson: dirigir a 80 km/h por medo de multa, para ser como o pai, ou por achar mais seguro."},{"t":"Normas situacionais","d":"Falamos baixo em hospital, igreja e biblioteca e alto em estádio e bar, até sem perceber: quem soube que ia a uma biblioteca **leu palavras em voz mais baixa** (Aarts e Dijksterhuis, 2003)."},{"t":"Cultura","d":"Culturas **coletivistas** (Triandis) conformam mais: no **Japão**, concordar é sinal de **maturidade**. No Ocidente, conformismo é pejorativo. **Bond e Smith (1996)**: **133 experimentos**, mais de 4 mil pessoas: a conformidade **vem caindo** desde Asch. Aumentam a conformidade: maioria grande, mais mulheres, grupo homogêneo, estímulo ambíguo."},{"t":"Influência de minorias (Moscovici)","d":"A maioria tem poder pelo **número**; a minoria, pelo **estilo de comportamento**: **consistência e perseverança**. Três efeitos: argumentos que fazem **refletir**; **autoconfiança** que faz reconsiderar (mais em opiniões que em fatos); **defecções** que quebram a ilusão de unanimidade. **Wood et al. (1994)**, 97 estudos, confirmam."},{"t":"Aceitação privada","d":"**Maas e Clark (1983)**: a minoria produz mais aceitação **privada** que pública. Quem respondeu **em público** seguiu a maioria; quem respondeu **anonimamente** seguiu a minoria. Exemplo histórico: **Rosa Parks**. Emerson: “toda a história é um registro do poder das minorias, **até de minorias de um**”."},{"t":"Tecnologia social (Varela, 1971)","d":"Usar os conhecimentos das ciências sociais para obter **finalidades desejadas**. Caso **Rosa**, 19 anos, que passou a beber e fumar maconha depois de ser recusada na escola de arte: o foco foi **fazê-la voltar a pintar**, combinando **5 conceitos**: conflito aproximação/afastamento (**Lewin**), latitude de rejeição (**Hovland e Sherif**), escalas **Likert**, **dissonância** (Festinger) e **reatância** (Brehm)."},{"t":"Reatância + dissonância","d":"Impor à pessoa **o oposto** do que se quer: para recuperar a liberdade ameaçada, ela adota a posição contrária (**reatância**), entra em **dissonância** e muda o pensamento na direção desejada. Rosa voltou a pintar e largou álcool e drogas."},{"t":"Bases do poder (French e Raven, 1959)","d":"**5 bases**: recompensa, coerção, legitimidade, referência, conhecimento. **Raven (1965)** acrescentou a 6ª: **informação**. **Raven (1993)**: recompensa e coerção **pessoais** (afeto) x **impessoais** (dinheiro, multa) e 4 legitimidades: **posição, reciprocidade, equidade e dependência**."},{"t":"Informação x conhecimento","d":"**Informação**: muda pelo **conteúdo** do argumento, que reorganiza a cognição, **independente de quem fala**. **Conhecimento**: obedece porque reconhece a **competência** de quem fala (o médico), **sem precisar entender** a razão."},{"t":"Os 3 tipos de influência (Raven)","d":"**Independente**: só a de **informação**. **Dependente e pública**: **recompensa e coerção**, que só valem **na presença** do influenciador e não mudam
