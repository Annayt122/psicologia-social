onal","a criança escolhe livremente seus outros significativos entre os adultos","os agentes são funcionários institucionais, que podem ser substituídos","o mundo interiorizado é o mais frágil e o mais fácil de ser abalado depois","não há identificação emocional com os adultos, só aprendizagem de regras"],"a":0,"e":"Ela termina com a formação do **outro generalizado**. “A interiorização só acontece quando há **identificação**.” As outras alternativas descrevem a **secundária** ou o contrário."},{"s":"socializacao","q":"A passagem de “mamãe está zangada comigo agora” para “mamãe fica zangada toda vez que derramo a sopa” ilustra:","o":["a formação do outro generalizado, que fecha a socialização primária","a alternação, em que a criança troca de mundo e de outros significativos","a socialização secundária, em que a criança aprende papéis institucionais","a estrutura de plausibilidade, que sustenta a realidade aprendida em casa","o “conto do vigário” que a sociedade aplica na criança desde cedo"],"a":0,"e":"Conceito de **Mead**: abstrair dos papéis concretos para papéis e regras em geral."},{"s":"socializacao","q":"Para Berger e Luckmann, o veículo mais importante de conservação da realidade subjetiva é:","o":["a conversa, sobretudo a casual e implícita","a punição de quem duvida da realidade do grupo","os grandes discursos oficiais das instituições","a ciência, que comprova a realidade objetiva","a socialização secundária, feita na escola"],"a":0,"e":"A conversa casual confirma o mundo **justamente por ser casual**. Frequência reforça; intensidade compensa."},{"s":"socializacao","q":"A alternação é:","o":["transformação quase total da realidade subjetiva, como na conversão religiosa","a passagem natural da socialização primária para a secundária, quando a criança vai à escola","a manutenção rotineira da realidade por meio da conversa do dia a dia","a troca de um papel por outro, como mudar de emprego ou de cidade","o momento em que surge o outro generalizado, ao fim da infância"],"a":0,"e":"Exige **ressocialização**: nova **estrutura de plausibilidade**, novos outros significativos e afastamento do mundo antigo."},{"s":"socializacao","q":"Segundo Berger e Luckmann, uma socialização totalmente bem-sucedida:","o":["é antropologicamente impossível","é o que acontece com quem passa por escola e trabalho","é a regra nas sociedades modernas, com sua escola obrigatória","depende só de uma família estruturada na infância","acontece quando não há socialização secundária"],"a":0,"e":"Bem-sucedida = **alta simetria** entre realidade objetiva e subjetiva. Total, nunca."},{"s":"socializacao","q":"A estrutura de plausibilidade é:","o":["a base social que sustenta uma realidade e permite suspender a dúvida","o conjunto de leis escritas que dão legitimidade a uma sociedade","a personalidade já formada na infância, que filtra o que é crível","a fase final da socialização secundária, quando o adulto se estabiliza","o conhecimento científico que comprova o que é real na sociedade"],"a":0,"e":"Dentro dela, quem duvida se sente **ridículo**."},{"s":"representacoes","q":"Um aluno agitado é chamado pelos colegas de “louco”; uma criança aprende que Deus é o “papai do céu”. Esses exemplos ilustram, respectivamente:","o":["ancoragem e objetivação","objetivação e ancoragem","convencionalização e prescrição","universo reificado e universo consensual","núcleo central e sistema periférico"],"a":0,"e":"Classificar e dar nome = **ancoragem**. Transformar ideia em imagem = **objetivação**."},{"s":"representacoes","q":"Sobre os universos de Moscovici, é correto afirmar:","o":["as representações sociais ficam no consensual; a ciência, no reificado","as representações sociais ficam no reificado; a ciência, no consensual","no universo consensual só falam os especialistas, com linguagem técnica","no universo reificado todos são “amadores” e podem opinar sobre tudo","a psicologia social seria a ciência do universo reificado, e não do consensual"],"a":0,"e":"Consensual = **conversa de bar**; reificado = **laudo de especialista**. A PS seria a ciência dos universos consensuais."},{"s":"representacoes","q":"Segundo Moscovici, a influência das representações sociais sobre nós é:","o":["maior quanto menos conscientes delas estamos","maior quanto mais conscientes delas estamos","nula para quem conhece a explicação científica","a mesma em todas as situações e grupos sociais","restrita à infância, antes do pensamento crítico"],"a":0,"e":"“Quanto menos nós pensamos nelas… maior se torna sua influência.” É a função de **prescrever**."},{"s":"representacoes","q":"A diferença entre a representação coletiva e a representação social é que:","o":["a coletiva (Durkheim) é estática; a social (Moscovici) é dinâmica e psicossocial","a coletiva (Moscovici) é dinâmica; a social (Durkheim) é estática e sociológica","as duas são idênticas: Moscovici só trocou o nome usado por Durkheim","a social é conhecimento científico; a coletiva, senso comum do dia a dia","a coletiva trata do senso comum atual; a social, das tradições antigas"],"a":0,"e":"**Durkheim congelou**; **Moscovici botou para circular**."},{"s":"representacoes","q":"Qual destas NÃO é uma das funções das representações sociais segundo Abric?","o":["Função de neutralidade","Função de saber","Função identitária","Função de orientação","Função justificatória"],"a":0,"e":"**S-I-O-J**: saber, identitária, orientação, justificatória. E Moscovici lembra: toda classificação **atribui valor**, não há neutralidade."},{"s":"representacoes","q":"Na teoria do núcleo central de Abric:","o":["o núcleo é estável e resistente; o periférico é flexível e protege o núcleo","o núcleo é flexível e se adapta; o periférico é rígido e protege o grupo","mudar um elemento periférico muda a representação inteira de uma só vez","o sistema periférico é o que garante a homogeneidade e a identidade do grupo","não existem variações individuais, porque o núcleo é igual para todos"],"a":0,"e":"Núcleo = **caroço**; periferia = **polpa**, que amassa e protege."},{"s":"representacoes","q":"Na pesquisa de Jodelet em Ainay-le-Château:","o":["mesmo informados de que não há contágio, os moradores mantinham ritos de separação","a explicação dos médicos acabou com o medo de contágio entre os moradores","os pacientes ficavam num asilo fechado, sem nenhum contato com as famílias da cidade","os moradores recusaram receber os pacientes em casa, por medo de contágio","a representação da loucura desapareceu com a convivência diária com os pacientes"],"a":0,"e":"Louça e roupa separadas: a **ação** cria e perpetua a representação, mais forte que a informação técnica."},{"s":"ideologia","q":"Sobre a história do termo “ideologia” em Chaui:","o":["Destutt de Tracy o criou como ciência das ideias; Napoleão o tornou pejorativo","Marx o criou em A Ideologia Alemã; Napoleão depois lhe deu um sentido pejorativo","Napoleão o criou como ciência das ideias; Destutt de Tracy o tornou pejorativo","Comte o criou como teoria científica; Durkheim lhe deu um sentido pejorativo","Durkheim o criou para a ciência; Comte o chamou de “tenebrosa metafísica”"],"a":0,"e":"**T-N-C-D**: Tracy criou, Napoleão xingou, Comte virou teoria, Durkheim chamou de preconceito."},{"s":"ideologia","q":"Para Marx, segundo Chaui, o Estado:","o":["é uma comunidade ilusória: parece o interesse geral, mas serve à classe dominante","é a síntese harmoniosa de todos os interesses particulares da sociedade civil","está acima das classes sociais e arbitra os conflitos entre elas com neutralidade","é a expressão do Espírito na história, que se realiza na forma do Estado","é neutro na luta de classes, embora seja ocupado pela classe mais numerosa"],"a":0,"e":"Estado como **síntese** é a visão de **Hegel**. Para Marx, é a **vitória de uma classe**."},{"s":"ideologia","q":"No exemplo de Chaui, o produto vale 8 horas de trabalho (R$ 16) e o salário paga R$ 8. Isso mostra:","o":["a mais-valia: 4 horas de trabalho não pago viram lucro","o valor de uso: o produto vale pela utilidade que tem","a inversão: o efeito é tomado como se fosse a causa","a alienação religiosa, como explicada por Feuerbach","a hegemonia: o trabalhador aceita as ideias do patrão"],"a":0,"e":"“A origem do capital é o **trabalho não pago**.”"},{"s":"ideologia","q":"Para Marx, a alienação fundamental é:","o":["a do trabalho, em que o produtor não se reconhece no que produz","a religiosa, em que o homem projeta sua essência em Deus, como em Feuerbach","um simples erro de consciência individual, corrigível pela educação","a do Espírito que não se reconhece nas suas obras, como em Hegel","a política, em que o cidadão entrega seu poder ao governante pelo voto"],"a":0,"e":"Contra **Feuerbach**: a religiosa é **efeito** da alienação do trabalho. E a alienação é **objetiva**."},{"s":"ideologia","q":"“Somos desiguais porque Deus ou a natureza nos fez assim.” Essa frase é exemplo de qual operação ideológica?","o":["inversão: tomar o efeito pela causa","hegemonia: ideias dominantes aceitas por todos","mais-valia: trabalho não pago transformado em lucro","contradição: a negação interna de uma realidade","alienação: o produtor não se reconhece no produto"],"a":0,"e":"A desigualdade é **efeito** das relações sociais, mas aparece como se viesse de Deus ou da natureza: o efeito vira **causa**. Junto com a **abstração** (tomar o real como dado e pronto), é o que faz da ideologia uma ilusão."},{"s":"ideologia","q":"A ideologia surge, segundo Marx em Chaui, quando:","o":["a divisão social do trabalho separa trabalho material e trabalho intelectual","os homens adquirem consciência de si e passam a representar o mundo por meio de ideias","a religião se separa do Estado e as ideias deixam de ser sagradas","surge a ciência positiva e as ideias passam a ser teorias verificáveis","Napoleão critica os ideólogos e dá ao termo um sentido pejorativo"],"a":0,"e":"Quem produz ideias se afasta da produção material, e as ideias parecem **autônomas**."},{"s":"ideologia","q":"Hegemonia, em Gramsci, é:","o":["o poder espiritual da classe dominante, cujas ideias viram senso comum","o poder militar e policial do Estado, usado para conter as classes dominadas","a teoria científica da sociedade, que substitui a velha metafísica","a dialética idealista, em que o Espírito se realiza na história","a união das classes dominadas para tomar o poder do Estado"],"a":0,"e":"As pessoas mantêm as ideias dominantes **mesmo lutando contra** a classe dominante. Ideias de uma classe que subia (liberdade, igualdade) viram **senso comum**."},{"s":"mix","q":"Comte aparece em três textos do exame. Qual associação está correta?","o":["Lane: fundador da PS para muitos; Bernardes: ancestral citado por Allport; Chaui: ideologia como teoria","Lane: criador do termo ideologia; Bernardes: pai da Völkerpsychologie; Chaui: fundador da Abrapso em 1980","Lane: crítico do positivismo; Bernardes: fundador do centro do MIT; Chaui: autor de O Capital","Lane: autor do Handbook de 1954; Bernardes: criador da Gestalt; Chaui: pai da sociometria","Lane: pai da Völkerpsychologie; Bernardes: criador do interacionismo simbólico; Chaui: autor de A Ideologia Alemã"],"a":0,"e":"Três estações, um Comte: **Brasil**, **História** e **Ideologia**."},{"s":"mix","q":"A palavra “minoria” aparece em Mailhiot e em Aroldo Rodrigues. Qual a diferença?","o":["Mailhiot (Lewin): grupo em tutela; Aroldo (Moscovici): grupo consistente que influencia","Mailhiot (Lewin): grupo numericamente menor; Aroldo (Moscovici): grupo em tutela","são o mesmo conceito: nos dois textos, minoria é o grupo com menos membros","nos dois textos a minoria é sempre discriminada e não exerce influência alguma","Mailhiot (Lewin): grupo emancipado; Aroldo (Moscovici): grupo que influencia por coerção"],"a":0,"e":"Uma é **condição** (depender da boa vontade de outro); a outra é **processo de influência**."},{"s":"mix","q":"O conceito de “outros significativos” aparece em Lane e em Berger e Luckmann. Nos dois textos:","o":["a criança se identifica com eles e toma o mundo deles como o único possível","a criança os escolhe livremente entre os adultos com quem mais convive","eles são funcionários institucionais, que podem ser trocados sem grande perda","eles só atuam na socialização secundária, na escola e no trabalho","a classe social deles não interfere no mundo que a criança interioriza"],"a":0,"e":"Lane: “o mundo deles é o da criança”. Berger e Luckmann: o mundo da infância é aceito como **O** mundo."},{"s":"mix","q":"Moscovici aparece em três textos do exame. Em quais papéis?","o":["representações sociais; minorias (Aroldo); forma sociológica de PS (Bernardes)","socialização primária (Berger); dinâmica de grupo (Mailhiot); ideologia (Chaui)","Teoria da Ação Racional (Aroldo); bases do poder (Aroldo); Völkerpsychologie (Bernardes)","núcleo central (Abric); pesquisa-ação (Mailhiot); crise da PS em Miami (Lane)","ódio de si (Mailhiot); mais-valia (Chaui); identidade social (Lane)"],"a":0,"e":"Uma das maiores **baldeações** do mapa."},{"s":"mix","q":"Kurt Lewin aparece em:","o":["Mailhiot, Bernardes (centro do MIT, 1945) e Aroldo (tecnologia social)","Mailhiot, Berger e Luckmann (outros significativos) e Chaui (hegemonia)","só em Mailhiot, nos capítulos sobre minorias e dinâmica de grupo","Lane (fundador da PS), Chaui (crítico de Marx) e Moscovici (minorias)","Mailhiot, Pinelli (núcleo central) e Bernardes (Völkerpsychologie)"],"a":0,"e":"Lewin está em **4 estações**: Minorias, Grupos, História e Influência."},{"s":"mix","q":"Qual afirmação é compatível com Lane e com Chaui ao mesmo tempo?","o":["a ideologia faz parecer natural e universal o que é histórico e serve à dominação","a ideologia é produzida conscientemente por um grupo de intelectuais conspiradores","ideologia é qualquer visão de mundo, neutra, compartilhada por um grupo social","a família e o Estado estão acima das relações de poder e da luta de classes","a ideologia só existe na ciência, e o senso comum é livre dela por ser prático"],"a":0,"e":"Lane: papéis e família parecem naturais. Chaui: abstração e inversão; o particular vira universal."},{"s":"mix","q":"Que relação existe entre o capítulo de Bernardes e os textos de Aroldo Rodrigues?","o":["Bernardes o cita como expoente da PS norte-americana na América Latina","Bernardes considera Rodrigues o fundador da Abrapso e da PS crítica brasileira","Rodrigues é citado por Bernardes como tradutor da Völkerpsychologie de Wundt","os dois defendem a mesma psicologia social, de base materialista e dialética","não há relação: Bernardes trata da Europa, e Rodrigues, dos Estados Unidos"],"a":0,"e":"Bernardes cita Rodrigues como exemplo da PS importada dos EUA e diz que ele e Varela levaram a Alapso ao extremo da PS norte-americana. Pegadinha: os textos da NP1 se criticam entre si."},{"s":"mix","q":"A palavra “objetivação” aparece em Berger e Luckmann e em Moscovici. Qual a diferença?","o":["Berger e Luckmann: o produto humano vira coisa externa; Moscovici: a ideia vira imagem","Berger e Luckmann: o mundo social entra na consciência; Moscovici: o estranho ganha um nome","nos dois textos, objetivação é dar nome a algo estranho e encaixá-lo numa categoria","Berger e Luckmann: a interiorização da realidade; Moscovici: a ancoragem do novo","são idênticas: Moscovici usa o conceito exatamente como Berger e Luckmann"],"a":0,"e":"Berger e Luckmann: o mundo criado pelos homens vira **realidade objetiva**, externa. Moscovici: uma ideia abstrata vira **imagem concreta**. Mesma palavra, sentidos diferentes."},{"s":"mix","q":"Sobre a crise da Psicologia Social na América Latina, Lane e Bernardes concordam que:","o":["ela apareceu nos congressos de Miami (1976) e Lima (1979) e levou à Abrapso","ela começou no Brasil e depois foi exportada para a Europa e os Estados Unidos","ela foi resolvida com a importação de mais teorias e métodos dos Estados Unidos","a Abrapso foi fundada antes de Miami, e por isso liderou as críticas de 1976","ela não teve relação com a situação política do continente, só com o método"],"a":0,"e":"Bernardes data a Abrapso em **1980** e lembra o contexto da **ditadura militar**."},{"s":"mix","q":"“Atitude” aparece em vários textos. Qual associação está correta?","o":["Aroldo: atitudes individuais; Lewin: atitudes coletivas; Thomas e Znaniecki: PS como estudo das atitudes","Aroldo: atitudes coletivas de grupo; Lewin: atitudes individuais; Festinger: PS como estudo das atitudes","Lewin: dissonância cognitiva; Festinger: campo social; Thomas e Znaniecki: ação racional","Moreno: Teoria da Ação Racional; Fishbein: sociometria; Schwartz: atitudes coletivas","Chaui: valores de Schwartz; Lane: congruência afetivo-cognitiva; Heider: interiorização"],"a":0,"e":"Não confunda o enfoque individual de Aroldo com o coletivo de Lewin."}],"cartoes":[{"s":"identidade","f":"O que a Psicologia Social estuda, para Lane?","b":"A **relação essencial entre indivíduo e sociedade**, entendida **historicamente**: como o homem é determinado e como se torna **agente da história**."},{"s":"identidade","f":"Por onde chega, sobretudo, a influência histórico-social?","b":"Pela **aquisição da linguagem**: os significados do grupo definem visão de mundo, valores, ações e emoções."},{"s":"identidade","f":"Qual o primeiro grupo de um ser humano?","b":"A **díade**, o grupo de dois: ao nascer, ele já depende de pelo menos mais uma pessoa."},{"s":"identidade","f":"O que caracteriza os papéis sociais?","b":"As **normas** (expectativas de comportamento). Papéis são **complementares**: não há chefe sem chefiado."},{"s":"identidade","f":"“Pode casar com quem quiser, desde que seja com o João.” O que isso ilustra?","b":"A individualidade dentro de limites: podemos variar, **desde que as relações essenciais se mantenham**."},{"s":"identidade","f":"O que é identidade social, em Lane?","b":"O que respondemos a “**quem é você?**”: o conjunto dos **papéis** que desempenhamos, formado no confronto com os outros."},{"s":"identidade","f":"Por que identidade e papéis fazem mediação ideológica?","b":"Criam a **ilusão** de que são **naturais** e fruto de **opções livres**, quando são determinados pelas **condições materiais** e reproduzem a dominação."},{"s":"identidade","f":"O que é consciência de si?","b":"Descobrir as **razões históricas** dos nossos papéis. Pode **alterar a identidade** e tornar o grupo **agente de mudança**."},{"s":"identidade","f":"Qual a frase de Leontiev citada por Lane sobre consciência?","b":"“A consciência individual do homem só pode existir nas condições em que existe a **consciência social**.”"},{"s":"linguagem","f":"Como surgiu a linguagem, segundo Lane?","b":"Da necessidade de **cooperar para sobreviver**: generaliza e transmite a prática sócio-histórica (Leontiev)."},{"s":"linguagem","f":"Que divisão do trabalho a autonomia da linguagem permitiu?","b":"**Manual x intelectual**: quem “faz” x quem “fala”. O intelectual, perto da classe dominante, vira autoridade por falar bem."},{"s":"linguagem","f":"Agir sem pensar, falar sem pensar e falar sem agir são…?","b":"**Autômato**, **papagaio** e “**de boas intenções o inferno está cheio**”. Separar os três é alienação."},{"s":"linguagem","f":"Quando a palavra vira arma de dominação?","b":"Quando uma **autoridade** impõe um **significado único e inquestionável** que gera **ação automática**."},{"s":"linguagem","f":"Quais as três situações de Terwilliger?","b":"**Hipnose**, **comando militar** e **lavagem cerebral**."},{"s":"linguagem","f":"Qual a contra-arma ao poder da palavra?","b":"**Pensar**: ampliar e questionar o significado em vez de só reagir. “Entre a palavra e a ação deve existir o pensamento.”"},{"s":"linguagem","f":"O que é representação para Lane?","b":"O **sentido pessoal** que damos aos **significados elaborados socialmente**."},{"s":"linguagem","f":"Que funções a família cumpre além de garantir a sobrevivência?","b":"**Reproduz a força de trabalho** e **perpetua a propriedade**; por isso sofre controle social rigoroso."},{"s":"linguagem","f":"Por que o adolescente questiona os pais, segundo Lane?","b":"Não por fase natural: na **socialização secundária** ele encontra **outras visões de mundo**."},{"s":"linguagem","f":"Por que a família tende a ser conservadora?","b":"Porque apresenta as relações de poder como **naturais e biológicas** (“o poder é um dever”)."},{"s":"brasil","f":"Qual a pergunta de Comte para a Psicologia Social?","b":"“Como pode o indivíduo ser, ao mesmo tempo, **causa e consequência** da sociedade?”"},{"s":"brasil","f":"Quando a PS vira estudo científico e quando chega ao auge nos EUA?","b":"Vira ciência **após a 1ª Guerra**; auge nos EUA **a partir da 2ª Guerra**."},{"s":"brasil","f":"Como era a PS norte-americana, para Lane?","b":"Pragmática, de **ajustamento**; sociedade como **pano de fundo**; causas **internas**; **dicotomia** indivíduo x sociedade."},{"s":"brasil","f":"O que foi a “crise da Psicologia Social”?","b":"Pesquisas **contraditórias** e o fracasso de **acumular dados para depois teorizar**; os problemas sociais continuavam."},{"s":"brasil","f":"Quem denunciou o caráter ideológico da PS norte-americana, e quando?","b":"A **Europa** (França e Inglaterra), no **fim dos anos 60**."},{"s":"brasil","f":"Miami 1976 x Lima 1979?","b":"**Miami**: crise denunciada, **sem propostas**. **Lima**: críticas precisas e **propostas** (México, Peru e Brasil)."},{"s":"brasil","f":"Quem introduziu a PS na USP?","b":"**Otto Klineberg**, nos anos 50. A tradução do seu livro (**1959**) foi o primeiro livro de PS publicado no Brasil."},{"s":"brasil","f":"Quais os 3 campos do psicólogo social brasileiro no documento da Abrapso?","b":"**Universidade** (isolamento), **indústria** (seleção e ajustamento) e **manipulação da opinião pública**."},{"s":"brasil","f":"O que o documento da Abrapso propõe?","b":"**Assistência psicológica em larga escala** junto a grupos e organizações **populares** e contato com outros cientistas sociais."},{"s":"historia","f":"Como Farr (1996) conta a história da PS?","b":"Por **instituições, fatos e pesquisas publicadas** (guerras, migração, universidades), não por autores e ideias."},{"s":"historia","f":"O que é o “repúdio positivista de Wundt”, e de quem é a expressão?","b":"Expressão de **Danziger (1979)**: guardar só o Wundt do laboratório e apagar a **Völkerpsychologie**."},{"s":"historia","f":"Quais os 3 objetivos de Wundt?","b":"Psicologia **experimental** (Leipzig, 1879), **metafísica científica** (Lógica, Ética, Sistemas Filosóficos) e **psicologia social** (Völkerpsychologie, 10 volumes, 1900-1920)."},{"s":"historia","f":"De quem é “o longo passado e a curta história da psicologia”?","b":"**Ebbinghaus (1908)**."},{"s":"historia","f":"Qual Handbook marcou o “corte positivo” da PS para Lindzey e Allport?","b":"O **Handbook de Lindzey (1954)**; o de **Murchison (1935)** foi jogado no passado “metafísico”."},{"s":"historia","f":"Para Farr, a PS está para a 2ª Guerra assim como…?","b":"Os **testes psicométricos** estão para a **1ª Guerra**."},{"s":"historia","f":"O que Lewin fundou no MIT e quando?","b":"O **Centro de Pesquisa em Dinâmica de Grupo**, em **1945**. Depois da morte dele (1947), o centro foi para **Michigan** com Cartwright."},{"s":"historia","f":"Formas psicológicas x sociológicas de PS (Farr)?","b":"**Psicológicas**: reduzem o social ao indivíduo (Allport, behaviorismo, Gestalt). **Sociológicas**: relacionam individual e coletivo (**Moscovici**, **Mead**)."},{"s":"historia","f":"Quem deu o nome “interacionismo simbólico” aos estudos de Mead?","b":"**Blumer**, depois da morte de Mead (1931)."},{"s":"historia","f":"Quando surge a Abrapso e qual a obra marco da ruptura?","b":"**1980**, com **Silvia Lane**. Obra marco: “**Psicologia social: o homem em movimento**” (Lane e Codo, 1984)."},{"s":"atitudes","f":"Quais os 3 componentes da atitude?","b":"**Cognitivo** (crenças), **afetivo** (sentimento pró ou contra, o mais característico) e **comportamental** (predisposição à ação)."},{"s":"atitudes","f":"Qual a diferença entre atitude, crença e opinião?","b":"A atitude tem **carga afetiva**; crenças e opiniões podem ser só cognitivas."},{"s":"atitudes","f":"Qual a diferença entre atitudes e valores?","b":"Valores são **mais gerais** e **menos numerosos**: um valor reúne muitas atitudes."},{"s":"atitudes","f":"Quais as funções das atitudes?","b":"Recompensas e evitar castigos; proteger a **autoestima**; **ordenar** informações; expressar **valores**; estabelecer **identidade social**."},{"s":"atitudes","f":"Quando uma tríade p-o-x está equilibrada (Heider)?","b":"Com **três sinais positivos** ou um **número par de negativos**."},{"s":"atitudes","f":"Quais as 4 formas de resolver uma tríade desequilibrada?","b":"Mudar o elo **p/o**, o **p/x**, o **o/x** ou fazer **diferenciação**."},{"s":"atitudes","f":"Além do equilíbrio, que outras forças atuam nas tríades (Rodrigues, 1985)?","b":"**Concordância** e **positividade** (preferimos gostar a desgostar)."},{"s":"atitudes","f":"Qual o resultado de Festinger e Carlsmith (1959)?","b":"Quem recebeu **US$ 1** para mentir passou a achar a tarefa chata **mais interessante** que quem recebeu US$ 20."},{"s":"atitudes","f":"O que Brehm e Cohen acrescentaram à dissonância?","b":"**Compromisso** e **volição** (livre escolha): sem eles, não há dissonância."},{"s":"atitudes","f":"Por que reduzimos dissonância, segundo Festinger, Tedeschi e Steele?","b":"**Festinger**: tensão. **Tedeschi**: quando **outros sabem**. **Steele**: quando o **eu está fraco**."},{"s":"atitudes","f":"O que mostrou o estudo de La Piere (1934)?","b":"250 estabelecimentos atenderam o casal chinês (só 1 recusou), mas **92%** dos 128 que responderam à carta disseram que **recusariam**."},{"s":"atitudes","f":"Qual a fórmula da Teoria da Ação Racional?","b":"**Intenção = peso × atitude em relação ao ato + peso × norma subjetiva**. Depois: + **obrigação moral** e **controle**."},{"s":"influencia","f":"Influência social x mudança de atitude?","b":"A influência muda o **comportamento**; mudança de atitude exige **mudança interna**."},{"s":"influencia","f":"O que é o efeito autocinético e quem o usou?","b":"Ilusão de que um **ponto de luz parado se move** no escuro. **Sherif (1935)**: os julgamentos convergem para uma **norma**."},{"s":"influencia","f":"Qual o resultado de Asch?","b":"Cerca de **33%** das respostas seguiram a maioria errada; a pressão some quando **um** quebra a unanimidade."},{"s":"influencia","f":"Quais as 3 distorções de Asch?","b":"**Ação** (não teve coragem), **julgamento** (achou que o erro era dele) e **percepção** (viu errado; rara)."},{"s":"influencia","f":"Qual o resultado de Milgram no livro?","b":"Psiquiatras previram **1%**; **62%** foram até **450 V**. Vítima perto = menos obediência; experimentador de status = mais."},{"s":"influencia","f":"As 3 respostas à pressão social de Kelman?","b":"**Complacência** (punição ou prêmio), **identificação** (com quem admira) e **internalização** (acha justo; a mais duradoura)."},{"s":"influencia","f":"Como uma minoria influencia a maioria (Moscovici)?","b":"Pelo **estilo**: **consistência e perseverança**. Gera mais aceitação **privada** que pública (Maas e Clark)."},{"s":"influencia","f":"Pé na porta x bola baixa (como o livro define)?","b":"**Pé na porta**: brinde ou atrativo para **ser ouvido**. **Bola baixa**: conseguir o “sim” e **depois** revelar o custo (7 da manhã)."},{"s":"influencia","f":"Quais as 6 bases do poder social?","b":"**Recompensa, coerção, legitimidade, referência, conhecimento** (French e Raven, 1959) e **informação** (Raven, 1965)."},{"s":"influencia","f":"Quais bases geram influência dependente e privada?","b":"**Legitimidade, referência e conhecimento**: continuam mesmo sem o influenciador presente."},{"s":"influencia","f":"Na análise de Rodrigues (1995), quais bases tornam o ato mais “interno e controlável”?","b":"**Recompensa, informação e referência** (Grupo 1): mais responsabilidade e punição."},{"s":"influencia","f":"Quais os 5 conceitos combinados na tecnologia social do caso Rosa?","b":"Conflito aproximação/afastamento (**Lewin**), latitude de rejeição (**Hovland e Sherif**), escalas **Likert**, **dissonância** (Festinger) e **reatância** (Brehm)."},{"s":"minorias","f":"O que é minoria psicológica?","b":"Grupo cujo destino **depende da boa vontade de outro** (tutela), independente do número."},{"s":"minorias","f":"O que é minoria privilegiada?","b":"Minoria **demográfica** dentro de uma maioria psicológica, que a **controla e manipula**."},{"s":"minorias","f":"Por que, para Lewin, o problema judeu é social?","b":"Os judeus eram perseguidos **por serem judeus**, não pela conduta; a maioria precisa de um **bode expiatório** em crises."},{"s":"minorias","f":"Como Lewin explica o ódio de si?","b":"Fenômeno **sociopsicológico** produzido pela **discriminação**, não instinto nem neurose; some com **igualdade de direitos**."},{"s":"minorias","f":"Com quem Lewin compara a criança minoritária?","b":"Com a **criança adotada**: deve saber **cedo** da sua condição."},{"s":"minorias","f":"Qual o verdadeiro perigo para a criança minoritária?","b":"**Não pertencer a lugar nenhum**: ser **marginal**, um “eterno adolescente”."},{"s":"minorias","f":"Forças centrípetas x centrífugas?","b":"**Centrípetas**: coesão, lealdade, emancipação. **Centrífugas**: atração pela maioria, **assimilação**."},{"s":"minorias","f":"Quais os 3 futuros de uma minoria e qual sobrevive?","b":"**Assimilação** e **integração** (adolescentes) e **emancipação total** (adulta): só esta sobrevive."},{"s":"minorias","f":"De onde saem os líderes de uma minoria?","b":"Da **periferia**, onde estão os marginais ambivalentes e os de maior sucesso."},{"s":"grupos","f":"Por que Lewin rejeita o laboratório?","b":"Porque é **artificial**: fenômenos de grupo só se entendem **no campo**, em referência à sociedade global."},{"s":"grupos","f":"Qual o papel do pesquisador para Lewin?","b":"**Participante e observador** ao mesmo tempo, com o consentimento do grupo."},{"s":"grupos","f":"O que é a “célula social bruta”?","b":"O **pequeno grupo concreto**: a única totalidade dinâmica acessível à observação."},{"s":"grupos","f":"O que são os grupos-testemunha?","b":"Pesquisadores treinados que entram nos grupos como “**átomos sociais radioativos**”."},{"s":"grupos","f":"Moreno x Lewin?","b":"**Moreno**: socialização, psicodrama, sociometria. **Lewin**: atitudes coletivas, campo social, pesquisa-ação."},{"s":"grupos","f":"Quais as 3 camadas do eu?","b":"**Eu íntimo** (centro, fechado), **eu social** (valores do grupo) e **eu público** (periferia, aberto)."},{"s":"grupos","f":"O que é campo social?","b":"A **totalidade dinâmica** de entidades sociais coexistentes, definida pelas **posições relativas** dos elementos."},{"s":"grupos","f":"As 4 hipóteses de Lewin sobre o grupo?","b":"**Terreno**, **instrumento**, **realidade** e determinante do **espaço vital** (T-I-R-E)."},{"s":"grupos","f":"Quais as 3 etapas da pesquisa-ação?","b":"**Analisar** as percepções, **prever** sua evolução e **prever os novos comportamentos** (A-P-A)."},{"s":"grupos","f":"O que define o clima de grupo?","b":"O **tipo de autoridade**. Mudar atitudes coletivas = mudar o estilo de autoridade."},{"s":"socializacao","f":"Quais os 3 momentos da dialética da sociedade?","b":"**Exteriorização**, **objetivação** e **interiorização**. O cap. 3 trata da interiorização."},{"s":"socializacao","f":"O que é a socialização primária?","b":"A primeira, na **infância**, com **outros significativos** impostos e **forte carga emocional**: dá o mundo básico."},{"s":"socializacao","f":"O que marca o fim da socialização primária?","b":"A formação do **outro generalizado** (Mead)."},{"s":"socializacao","f":"O que é a socialização secundária?","b":"A interiorização de **submundos institucionais**, com **funcionários** anônimos e pouca emoção."},{"s":"socializacao","f":"Por que o mundo da infância é tão firme?","b":"É aceito **não como um mundo possível, mas como O mundo**: faz parecer necessário o que é contingente."},{"s":"socializacao","f":"Qual o principal veículo de manutenção da realidade?","b":"A **conversa**, sobretudo **implícita**."},{"s":"socializacao","f":"O que é estrutura de plausibilidade?","b":"A **base social** que sustenta uma realidade e permite **suspender a dúvida**."},{"s":"socializacao","f":"O que é alternação?","b":"Transformação quase total da realidade subjetiva, que exige **ressocialização**. Protótipo: **conversão religiosa**."},{"s":"socializacao","f":"O que é socialização bem-sucedida?","b":"**Alta simetria** entre realidade objetiva e subjetiva. A **total** é impossível."},{"s":"representacoes","f":"Em que obra e ano Moscovici criou o conceito de RS?","b":"**A psicanálise, sua imagem e seu público (1961)**."},{"s":"representacoes","f":"Qual a definição de RS de Jodelet?","b":"Conhecimento **socialmente elaborado e partilhado**, com **objetivo prático**, que constrói uma **realidade comum** a um grupo."},{"s":"representacoes","f":"Convencionalizar x prescrever?","b":"**Convencionalizar**: pôr numa categoria. **Prescrever**: a RS se impõe e diz como pensar."},{"s":"representacoes","f":"Universo consensual x reificado?","b":"**Consensual**: conversa, todos amadores, onde vivem as RS. **Reificado**: ciência, especialistas."},{"s":"representacoes","f":"Qual a finalidade de toda representação?","b":"**Tornar familiar o não familiar.**"},{"s":"representacoes","f":"Ancoragem x objetivação?","b":"**Ancoragem**: classificar e dar nome (“louco”). **Objetivação**: ideia vira imagem (“papai do céu”)."},{"s":"representacoes","f":"Representação coletiva x social?","b":"**Coletiva**: Durkheim, sociologia, estática. **Social**: Moscovici, psicologia social, dinâmica."},{"s":"representacoes","f":"As 4 funções das RS (Abric)?","b":"**Saber, identitária, orientação, justificatória** (S-I-O-J)."},{"s":"representacoes","f":"Núcleo central x sistema periférico?","b":"**Núcleo**: estável, dá o sentido, resiste. **Periférico**: flexível, protege o núcleo."},{"s":"representacoes","f":"O que mostrou a pesquisa de Ainay-le-Château?","b":"Mesmo com médicos dizendo que não é contagioso, os moradores mantinham **ritos de separação**: a RS resiste à ciência."},{"s":"ideologia","f":"Quem criou o termo ideologia e com que sentido?","b":"**Destutt de Tracy (1801)**: “ciência da gênese das ideias”."},{"s":"ideologia","f":"Quem deu sentido pejorativo à ideologia?","b":"**Napoleão (1812)**: “essa tenebrosa metafísica”. Marx conserva esse sentido."},{"s":"ideologia","f":"Ideologia para Comte e para Durkheim?","b":"**Comte**: teoria (“Ordem e Progresso”). **Durkheim**: **pré-noções** não científicas."},{"s":"ideologia","f":"Hegel x Marx: quem é o sujeito da história?","b":"**Hegel**: o **Espírito**. **Marx**: as **classes em luta**."},{"s":"ideologia","f":"O que é mais-valia?","b":"O **tempo de trabalho não pago**; a origem do capital."},{"s":"ideologia","f":"Qual a alienação fundamental para Marx?","b":"A do **trabalho** (contra Feuerbach, que falava da religiosa)."},{"s":"ideologia","f":"Fetichismo x reificação?","b":"**Fetichismo**: a mercadoria parece ter vida própria. **Reificação** (Lukács): pessoas viram coisas e coisas viram “gente”."},{"s":"ideologia","f":"Quando nasce a ideologia?","b":"Quando a divisão do trabalho separa **trabalho material e intelectual**."},{"s":"ideologia","f":"O que é o Estado para Marx?","b":"Uma **comunidade ilusória**: parece interesse geral, mas serve à classe dominante."},{"s":"ideologia","f":"Quais as duas operações da ideologia como ilusão?","b":"**Abstração** (tomar o real como pronto) e **inversão** (tomar o efeito pela causa)."}],"duelos":[{"a":"Minoria psicológica","ad":"Grupo cujo destino depende da boa vontade de outro, vivendo em tutela","b":"Influência de minorias","bd":"Um grupo pequeno e consistente que consegue mudar a opinião da maioria","s":["minorias","influencia"],"dica":"Mailhiot fala de **condição** (tutela); Moscovici, em Aroldo, de **processo** (influência)."},{"a":"Ancoragem","ad":"Classificar algo estranho e dar-lhe um nome, como chamar o colega agitado de “louco”","b":"Objetivação (Moscovici)","bd":"Transformar uma ideia abstrata numa imagem concreta, como “papai do céu”","s":["representacoes"],"dica":"**Âncora** prende numa categoria; **objetivar** é virar objeto visível."},{"a":"Objetivação (Berger e Luckmann)","ad":"O mundo social criado pelos homens ganha existência própria e parece uma coisa externa","b":"Objetivação (Moscovici)","bd":"Uma ideia abstrata é reproduzida numa imagem concreta","s":["socializacao","representacoes"],"dica":"Mesma palavra, dois autores: em Berger é a **sociedade** que vira coisa; em Moscovici é a **ideia** que vira imagem."},{"a":"Universo consensual","ad":"Todos podem opinar como amadores, pela conversação; é onde vivem as representações sociais","b":"Universo reificado","bd":"Só fala quem tem competência; é o universo da ciência e dos especialistas","s":["representacoes"],"dica":"**Conversa de bar** x **laudo de especialista**."},{"a":"Representação coletiva","ad":"Conceito de Durkheim, sociológico e estático","b":"Representação social","bd":"Conceito de Moscovici, psicossocial e dinâmico, que circula e se transforma","s":["representacoes"],"dica":"Durkheim **congelou**; Moscovici **botou para circular**."},{"a":"Núcleo central","ad":"Poucos elementos estáveis que dão o sentido à representação e resistem à mudança","b":"Sistema periférico","bd":"Parte flexível, sensível ao contexto, que absorve o novo e protege o outro","s":["representacoes"],"dica":"**Caroço** x **polpa**."},{"a":"Socialização primária","ad":"Na infância, com outros significativos impostos e forte carga emocional; dá o mundo básico","b":"Socialização secundária","bd":"Interiorização de submundos institucionais com funcionários anônimos e pouca emoção","s":["socializacao","linguagem"],"dica":"**Colo** x **crachá**."},{"a":"Outro generalizado","ad":"Abstração dos papéis concretos para regras gerais; marca o fim da primeira socialização","b":"Outros significativos","bd":"Pais e cuidadores com quem a criança se identifica e que filtram o mundo para ela","s":["socializacao","linguagem"],"dica":"Os **significativos** são pessoas; o **generalizado** é a regra geral na cabeça."},{"a":"Centrípeta","ad":"Força que puxa para dentro do grupo: coesão, lealdade, desejo de emancipação","b":"Centrífuga","bd":"Força que joga para fora: atração pela maioria e desejo de assimilação","s":["minorias"],"dica":"Centrí-**PETA** pega junto; centrí-**FUGA** foge."},{"a":"Moreno","ad":"Socialização, psicodrama, sociodrama e sociometria","b":"Lewin","bd":"Atitudes coletivas, campo social e pesquisa-ação","s":["grupos"],"dica":"**Drama** é Moreno; **campo** é Lewin."},{"a":"Explicação galileana","ad":"Explica pelas interações entre os elementos no momento observado","b":"Explicação aristotélica","bd":"Explica pela natureza e pela causa histórica de cada elemento","s":["grupos"],"dica":"Lewin fica com **Galileu**."},{"a":"Distorção da ação","ad":"Via que a maioria errava, mas não teve coragem de discordar","b":"Distorção do julgamento","bd":"Achou que o problema estava na própria visão e seguiu o grupo","s":["influencia"],"dica":"Ação = **covardia**; julgamento = **dúvida de si**. A de percepção é rara."},{"a":"Pé na porta","ad":"Usar um brinde ou atrativo para conseguir ser ouvido e entrar no assunto","b":"Bola baixa","bd":"Conseguir a adesão e só depois revelar o custo, como o experimento às 7 da manhã","s":["influencia"],"dica":"Use a definição **do livro**: o “sim” antes do custo é **bola baixa**."},{"a":"Porta na cara","ad":"Pedir algo grande que será negado e depois o pedido real, menor","b":"Isso não é tudo","bd":"Antes da reação do cliente, acrescentar vantagens ou baixar o preço","s":["influencia"],"dica":"Porta na cara tem um **não** no meio; “isso não é tudo” não espera resposta."},{"a":"Poder de informação","ad":"Muda pelo conteúdo do argumento, independente de quem fala","b":"Poder de conhecimento","bd":"Obedece porque reconhece a competência de quem fala, sem precisar entender","s":["influencia"],"dica":"**Argumento** x **jaleco**."},{"a":"Dependente e pública","ad":"Recompensa e coerção: só vale na presença do influenciador, sem mudança interna","b":"Dependente e privada","bd":"Legitimidade, referência e conhecimento: continua mesmo sem ninguém olhando","s":["influencia"],"dica":"Cenoura e chicote só funcionam **com o dono por perto**."},{"a":"Complacência","ad":"Ceder para evitar punição ou ganhar recompensa","b":"Internalização","bd":"Ceder porque passou a achar o pedido justo; a forma mais duradoura","s":["influencia"],"dica":"Medo da multa x achar mais seguro. No meio fica a **identificação**."},{"a":"Aquiescência forçada","ad":"Fazer algo contra as próprias ideias por uma recompensa; quanto menor o pagamento, maior a mudança","b":"Justificação insuficiente","bd":"Esforçar-se muito por algo que vale pouco e passar a valorizá-lo","s":["atitudes"],"dica":"**US$ 1** x **iniciação embaraçosa**."},{"a":"Atitude","ad":"Sentimento pró ou contra um objeto específico, com crenças e predisposição à ação","b":"Valor","bd":"Meta geral e trans-situacional que reúne muitas atitudes","s":["atitudes"],"dica":"Valores são **poucos e gerais**; atitudes, **muitas e específicas**."},{"a":"Forma psicológica de PS","ad":"Reduz o social a leis individuais, como Allport, o behaviorismo e a Gestalt","b":"Forma sociológica de PS","bd":"Relaciona individual e coletivo, como as representações sociais e Mead","s":["historia"],"dica":"Psicológica **individualiza** o social."},{"a":"Danziger (1979)","ad":"O “repúdio positivista de Wundt”","b":"Ebbinghaus (1908)","bd":"“O longo passado e a curta história da psicologia”","s":["historia"],"dica":"**D**anziger **D**escartou Wundt; **E**bbinghaus fala da **E**ra curta."},{"a":"Miami (1976)","ad":"A crise é denunciada, mas sem propostas concretas","b":"Lima (1979)","bd":"Críticas precisas e propostas para redefinir a psicologia social","s":["brasil","historia"],"dica":"**Miami murmura**, **Lima lança**."},{"a":"Alapso","ad":"Associação latino-americana levada ao extremo da PS norte-americana","b":"Abrapso","bd":"Associação brasileira de 1980, com Silvia Lane, de base crítica e histórica","s":["historia","brasil"],"dica":"O **br** de A**br**apso é de Brasil e de ruptura."},{"a":"Hegel","ad":"O Espírito move a história; o Estado é a síntese dos interesses","b":"Marx","bd":"A luta de classes move a história; o Estado é uma comunidade ilusória","s":["ideologia"],"dica":"**Ideias** x **barriga e trabalho**."},{"a":"Abstração","ad":"Tomar a realidade como dada e pronta, sem perguntar como foi produzida","b":"Inversão","bd":"Tomar o efeito pela causa, como dizer que somos desiguais porque Deus quis","s":["ideologia"],"dica":"As duas juntas são os **óculos de ponta-cabeça**."},{"a":"Eu íntimo","ad":"O centro da personalidade: valores fundamentais, fechado","b":"Eu público","bd":"A periferia: aberta, cheia de automatismos e fenômenos de massa","s":["grupos"],"dica":"**Miolo** x **casca** da cebola."}],"baldeacoes":[{"t":"Comte em três estações","x":"**Lane**: “considerado por muitos o fundador da PS”, com a pergunta sobre o indivíduo como causa e consequência da sociedade. **Bernardes**: os 3 estágios do positivismo e o ancestral da PS segundo Allport. **Chaui**: ideologia como teoria, “Ordem e Progresso”.","s":["brasil","historia","ideologia"]},{"t":"Lewin em quatro estações","x":"**Minorias** (estudos sobre os judeus), **Grupos** (campo, Gestalt, pesquisa-ação), **História** (Centro de Dinâmica de Grupo no MIT, 1945) e **Influência** (conflito aproximação/afastamento na tecnologia social).","s":["minorias","grupos","historia","influencia"]},{"t":"Moscovici em três estações","x":"**Representações sociais**; **influência de minorias** no texto de Aroldo; e, em Bernardes, exemplo de **forma sociológica** de PS.","s":["representacoes","influencia","historia"]},{"t":"Duas “minorias” diferentes","x":"**Mailhiot/Lewin**: minoria é quem vive em **tutela**, independente do número. **Moscovici/Aroldo**: minoria é o grupo pequeno e **consistente** que muda a maioria.","s":["minorias","influencia"]},{"t":"Socialização em dois autores","x":"**Lane** e **Berger e Luckmann** usam **outros significativos**, mundo único da infância e o questionamento na **socialização secundária**. Lane acrescenta a crítica: a família reproduz o poder.","s":["linguagem","socializacao"]},{"t":"Ideologia em três autores","x":"**Lane**: papéis e família parecem naturais; a linguagem tem função ideológica falseadora. **Chaui**: ideias da classe dominante viram as de todos, por abstração e inversão. **Moscovici**: as ideologias fazem a passagem entre universo consensual e reificado.","s":["identidade","linguagem","ideologia","representacoes"]},{"t":"A crise contada duas vezes","x":"**Lane** (de dentro: ela organizou o simpósio de Lima) e **Bernardes** contam Miami 1976, Lima 1979 e a criação da **Abrapso** (1980, segundo Bernardes).","s":["brasil","historia"]},{"t":"Os textos da NP1 se criticam","x":"**Bernardes** cita **Aroldo Rodrigues** como exemplo da PS importada dos EUA e diz que ele e **J. Varela** levaram a Alapso ao extremo da PS norte-americana. O mesmo Varela é o da **tecnologia social**.","s":["historia","atitudes","influencia"]},{"t":"Atitudes: individual x coletiva","x":"**Aroldo**: atitude individual com 3 componentes, equilíbrio e dissonância. **Lewin** (Mailhiot): atitudes **coletivas** de grupo. **Bernardes**: Yale estudou mudança de atitude no pós-guerra. **Thomas e Znaniecki**: PS como “estudo científico das atitudes”.","s":["atitudes","grupos","historia"]},{"t":"Mead em duas estações","x":"**Berger e Luckmann** usam o **outro generalizado** de Mead. **Bernardes** diz que o positivismo **esqueceu** Mead e seu behaviorismo social; o nome interacionismo simbólico é de Blumer.","s":["socializacao","historia"]},{"t":"Representação em Lane e em Moscovici","x":"**Lane**: representação é o sentido pessoal dado aos significados sociais, e por ela passa a ideologia. **Moscovici**: RS tornam familiar o não familiar por ancoragem e objetivação.","s":["linguagem","representacoes"]}],"dissertativas":[{"s":"identidade","q":"Explique, segundo Silvia Lane, como nos tornamos sociais: grupos, papéis, identidade social e consciência de si.","r":["Para Lane, a Psicologia Social estuda a **relação essencial entre indivíduo e sociedade**, entendida historicamente. Desde o nascimento estamos em **grupos** (o primeiro é a **díade**), e cada grupo tem **normas** que definem **papéis sociais**, sempre **complementares**: só existe chefe se houver chefiados. Quanto mais a relação é essencial para manter a sociedade, mais rígido é o papel, como mostra o contraste entre a rainha Elizabeth no Parlamento e o Zé da Silva no estrangeiro.","A **identidade social** é o conjunto de papéis que desempenhamos, aquilo que respondemos quando perguntam “quem é você?”. Ela exerce **mediação ideológica**: parece natural e fruto de escolhas livres, mas é determinada pelas condições materiais de vida e reproduz as relações de dominação.","A **consciência de si** nasce quando questionamos a determinação histórica desses papéis. Ela pode **alterar a identidade social** e, quando o grupo percebe as relações de dominação que reproduz, torná-lo **agente de mudança**. Como diz Leontiev, citado por Lane, a consciência individual só existe onde existe a consciência social."],"k":["Relação indivíduo-sociedade, histórica","Díade, normas, papéis complementares","Identidade social = conjunto de papéis","Mediação ideológica (parece natural e livre)","Consciência de si → agente de mudança"]},{"s":"linguagem","q":"Por que, para Lane, a linguagem pode ser uma arma de dominação? Qual é a contra-arma?","r":["A linguagem surgiu da cooperação para sobreviver e generaliza a prática social (Leontiev). Mas a palavra não contém a coisa (“o significado da palavra alimento não contém um grama de substância alimentícia”), e nessa distância ela pode virar **arma**: quando uma **autoridade** impõe um **significado único e inquestionável**, a palavra provoca **ação automática**.","Lane usa os exemplos de Terwilliger: na **hipnose**, a passividade total diante da voz; no **comando militar**, a ordem com um só sentido, que o soldado não deve pensar; na **lavagem cerebral**, o isolamento que elimina significados antigos. Onde não temos experiência direta, autoridades impõem **representações**, e por elas passa a **ideologia dominante**.","A contra-arma é **pensar**: ampliar e questionar o significado, confrontar o que se diz com o que se vive. “Entre a palavra e a ação deverá sempre existir o pensamento.” Separar agir, pensar e falar é alienação (autômato, papagaio, boas intenções)."],"k":["Origem: cooperação; Leontiev","Palavra ≠ objeto","Significado único imposto por autoridade","Hipnose, comando militar, lavagem cerebral","Contra-arma: pensar, questionar"]},{"s":"brasil","q":"Descreva a trajetória da Psicologia Social até a crise e a resposta brasileira, segundo Lane.","r":["Comte, considerado por muitos o fundador da PS, perguntava como o indivíduo pode ser **causa e consequência** da sociedade. A PS científica surge após a **1ª Guerra** e chega ao auge nos **EUA** a partir da **2ª Guerra**, com tradição pragmática, buscando **ajustar** o indivíduo e explicando o comportamento por causas internas: a sociedade virava pano de fundo.","Nos anos 60, as pesquisas se contradiziam e a proposta de acumular dados para depois teorizar fracassou: é a **crise da Psicologia Social**. A **Europa** denunciou o **caráter ideológico** da PS norte-americana. Na América Latina, a crise foi denunciada em **Miami (1976)**, sem propostas, e em **Lima (1979)** surgiram críticas precisas e propostas.","No Brasil, a PS chegou com **Klineberg** (USP, anos 50). Depois de Lima, propôs-se a **Abrapso**, cujo documento denunciou a **dependência cultural**, os três campos restritos do psicólogo social (universidade, indústria e manipulação da opinião pública) e defendeu uma **assistência psicológica em larga escala** junto a grupos populares."],"k":["Comte: causa e consequência","EUA pós-2ª Guerra: ajustamento","Crise: dados contraditórios; crítica europeia","Miami 1976 x Lima 1979","Abrapso: dependência cultural, 3 campos, larga escala"]},{"s":"historia","q":"Compare as duas formas de contar a história da Psicologia Social apresentadas por Bernardes e explique o “repúdio positivista de Wundt”.","r":["A forma **positivista** conta a história por **autores e ideias** e toma o **método experimental** como critério de ciência. Ela cria a imagem do “longo passado e curta história” (Ebbinghaus, 1908) e, na PS, marca o “corte positivo” com o **Handbook de Lindzey (1954)**, tendo Comte como ancestral (Allport).","O “**repúdio positivista de Wundt**” (Danziger, 1979) mostra o efeito desse recorte: Wundt tinha três objetivos (psicologia experimental, metafísica científica e a **Völkerpsychologie**), mas os historiadores guardaram só o laboratório de 1879. Também foram esquecidos o **marxismo** e **Mead**.","A forma de **Farr (1996)** conta a história por **instituições e fatos**: as guerras (The American Soldier, Nuremberg), a migração dos **gestaltistas** que gerou a PS cognitiva americana, Yale (mudança de atitude) e o MIT de **Lewin (1945)**. Para Farr, a PS moderna é americana com raízes europeias e predominantemente uma **forma psicológica**, que individualiza o social."],"k":["Positivista: autores, ideias, método experimental","Danziger: Wundt mutilado; Völkerpsychologie","Ebbinghaus; Handbook 1954; Comte","Farr: guerras, migração, Yale, MIT","Formas psicológicas x sociológicas"]},{"s":"atitudes","q":"Defina atitude e explique como as teorias de Heider e de Festinger explicam a formação e a mudança de atitudes.","r":["Atitude é uma **organização duradoura de crenças e cognições**, com **carga afetiva** pró ou contra um objeto social, que **predispõe a uma ação** coerente. Tem três componentes: **cognitivo**, **afetivo** (o mais característico) e **comportamental**.","Para **Heider (1946)**, preferimos situações **equilibradas**. Numa tríade p-o-x, há equilíbrio com três sinais positivos ou número par de negativos; o desequilíbrio gera tensão e se resolve mudando um dos elos ou por diferenciação. Rodrigues mostrou que também atuam a **concordância** e a **positividade**.","Para **Festinger (1957)**, buscamos **consonância** entre cognições. A dissonância aparece depois de **decisões** (valorizamos o escolhido), na **aquiescência forçada** (quem recebeu US$ 1 mudou mais que quem recebeu US$ 20) e na **justificação insuficiente** (Aronson e Mills). Para reduzi-la, mudamos a atitude."],"k":["Definição com 3 componentes","Heider: tríade p-o-x; par de negativos","Concordância e positividade","Festinger: consonância","Decisão, aquiescência forçada (US$ 1), justificação insuficiente"]},{"s":"atitudes","q":"Atitudes preveem comportamentos? Discuta com La Piere, Sivacek e Crano e Fishbein e Ajzen.","r":["**La Piere (1934)** viajou com um casal chinês: foram atendidos em quase todos os 250 estabelecimentos, mas 92% dos que responderam à carta disseram que recusariam chineses. Parece incoerência, mas **Triandis** explica que o comportamento depende também de **normas, hábitos, consequências** e da **situação**; para Newcomb, é resultante de **várias atitudes**.","**Sivacek e Crano (1982)** mostraram que a coerência é maior quando há **interesse investido**: os jovens que seriam afetados pela lei fizeram muito mais telefonemas contra ela.","**Fishbein e Ajzen** propõem que a **intenção** de comportamento é função da **atitude em relação ao ato** e da **norma subjetiva**, com pesos empíricos; depois acrescentaram **obrigação moral** e **controle**. Logo, atitudes preveem comportamento quando consideramos esses outros fatores."],"k":["La Piere: 92% diriam não","Triandis: normas, hábitos, situação","Interesse investido (Sivacek e Crano)","Ação racional: atitude + norma subjetiva","Obrigação moral e controle"]},{"s":"influencia","q":"Compare os estudos clássicos de Sherif, Asch e Milgram e explique o que revelam sobre a influência social.","r":["**Sherif (1935)** usou o **efeito autocinético**, um estímulo **ambíguo**: os julgamentos convergiram para uma **norma** comum. Diante da ambiguidade, confiar nos outros é até prudente.","**Asch (1946)** usou um estímulo **nítido** (linhas): cerca de **33%** das respostas seguiram a maioria errada, por distorção da **ação**, do **julgamento** ou, raramente, da **percepção**. A pressão some quando **um** quebra a unanimidade.","**Milgram (1965)** mostrou a obediência à autoridade: psiquiatras previam 1%, mas **62%** chegaram a 450 volts. Os participantes atribuíam a responsabilidade ao experimentador. Os três estudos mostram que a **situação** pode superar o caráter (Ross e Nisbett) e que a influência muda o **comportamento**, nem sempre a atitude."],"k":["Sherif: ambíguo → norma","Asch: nítido; 33%; unanimidade","3 distorções","Milgram: 1% previsto, 62% real","Situação supera caráter"]},{"s":"influencia","q":"Explique as bases do poder social de French e Raven e os tipos de influência que elas produzem.","r":["**French e Raven (1959)** descreveram cinco bases: **recompensa** (A pode premiar), **coerção** (A pode punir), **legitimidade** (A tem direito reconhecido de mandar), **referência** (A é modelo, positivo ou negativo) e **conhecimento** (A tem competência reconhecida). **Raven (1965)** acrescentou a **informação**: muda-se pelo conteúdo do argumento, não pela pessoa.","Raven classificou a influência em **independente** (informação), **dependente e pública** (recompensa e coerção, que só valem na presença do influenciador) e **dependente e privada** (legitimidade, referência e conhecimento, que permanecem sem vigilância).","**Rodrigues (1995)** mostrou que, numa transgressão, obedecer por recompensa, informação ou referência parece mais **interno e controlável**, gerando mais responsabilidade, enquanto obedecer por coerção, legitimidade ou conhecimento facilita eximir-se, como nos **crimes de obediência**."],"k":["5 bases + informação (Raven 1965)","Informação x conhecimento","Independente, dependente pública, dependente privada","Rodrigues: Grupo 1 x Grupo 2","Crimes de obediência"]},{"s":"minorias","q":"Explique o conceito de minoria psicológica em Lewin e as opções de futuro das minorias.","r":["Para Lewin, minoria **não é número**: **minoria psicológica** é o grupo cujo destino depende da **boa vontade** de outro, em estado de **tutela**; maioria psicológica é o grupo que se autodetermina. Por isso uma maioria numérica pode ter psicologia de minoria, controlada por uma **minoria privilegiada**.","A perseguição a minorias é um problema **social**: a maioria precisa de um **bode expiatório** em tempos de crise. A discriminação produz o **ódio de si**, fenômeno sociopsicológico, não instintivo, que some com igualdade de direitos. O que faz um grupo é a **interdependência do destino**.","Há três futuros: **assimilação** e **integração**, atitudes **adolescentes**, e **emancipação total**, atitude **adulta** e a única que garante a sobrevivência. Toda minoria vive entre forças **centrípetas** (coesão) e **centrífugas** (assimilação)."],"k":["Minoria = tutela, não número","Minoria privilegiada","Bode expiatório; ódio de si sociopsicológico","Interdependência do destino","Assimilação, integração, emancipação"]},{"s":"grupos","q":"Explique a pesquisa-ação de Lewin e os conceitos que a fundamentam.","r":["Lewin defende a **pesquisa de campo**, não o laboratório artificial: fenômenos de grupo só se entendem na sociedade real, com o pesquisador como **participante e observador**. Com base na **Gestalt**, o grupo é uma **totalidade dinâmica**, e o pequeno grupo concreto é a única observável.","Seus conceitos-chave são **totalidade dinâmica**, **eu social** (íntimo, social e público) e **campo social**. Diante da mudança, o grupo pode ser conformista ou não conformista, e o fator decisivo é o **clima de grupo**, definido pelo **tipo de autoridade**.","A **pesquisa-ação** faz da pesquisa uma **ação social**: em pequenos grupos reais, com **grupos-testemunha** aceitos como membros, segue três etapas: **analisar** as percepções, **prever** sua evolução e **prever os novos comportamentos**, para que o grupo fique consciente da própria dinâmica."],"k":["Campo, não laboratório","Participante e observador","Gestalt; totalidade dinâmica","Eu social; campo social; clima e autoridade","3 etapas: analisar, prever, agir"]},{"s":"socializacao","q":"Diferencie socialização primária e secundária e explique como a realidade subjetiva é mantida, segundo Berger e Luckmann.","r":["A sociedade é um processo de **exteriorização**, **objetivação** e **interiorização**. A **socialização primária** acontece na infância, com **outros significativos** impostos e forte **carga emocional**; o mundo da infância é aceito como **o** mundo. Ela termina com o **outro generalizado** (Mead).","A **socialização secundária** introduz o indivíduo em **submundos institucionais**, com funcionários anônimos e pouca emoção; é mais frágil e precisa se sobrepor ao mundo já interiorizado.","A realidade se mantém pela **rotina** e sobretudo pela **conversa**, de forma implícita, dentro de uma **estrutura de plausibilidade**. A **alternação**, como a conversão religiosa, troca o mundo inteiro e exige **ressocialização**. Socialização totalmente bem-sucedida é impossível."],"k":["Ex-Ob-In","Primária: outros significativos, emoção, O mundo","Outro generalizado","Secundária: submundos, anonimato","Conversa, plausibilidade, alternação"]},{"s":"representacoes","q":"O que são representações sociais e como elas tornam familiar o não familiar?","r":["Para Moscovici, representações sociais são o **saber do senso comum**: conhecimento **socialmente elaborado e partilhado**, com objetivo prático, que constrói uma realidade comum a um grupo (Jodelet). Elas **convencionalizam** e **prescrevem**, e sua influência é maior quanto menos conscientes delas somos. Pertencem ao **universo consensual**, não ao reificado da ciência.","Sua finalidade é **tornar familiar o não familiar**, por dois mecanismos: a **ancoragem**, que classifica e dá nome (o colega agitado vira “louco”), e a **objetivação**, que transforma a ideia abstrata em imagem concreta (“papai do céu”).","A RS vem da representação **coletiva** de Durkheim, mas é **dinâmica**. Abric descreve quatro funções (saber, identitária, orientação, justificatória) e um **núcleo central** estável protegido por um **sistema periférico** flexível. A pesquisa de Ainay-le-Château mostra que a RS resiste à informação científica."],"k":["Senso comum, partilhado (Jodelet)","Convencionalizar e prescrever","Consensual x reificado","Ancoragem e objetivação","Durkheim; Abric"]},{"s":"ideologia","q":"O que é ideologia para Chaui, a partir de Marx?","r":["O termo nasceu com **Destutt de Tracy** (ciência das ideias), ganhou sentido pejorativo com **Napoleão**, foi teoria para **Comte** e pré-noção para **Durkheim**. Com Marx, ideologia passa a ser o **ocultamento da dominação**.","Ela nasce quando a divisão do trabalho separa **trabalho material e intelectual**: as ideias parecem independentes do real. No capitalismo, a **mais-valia** (trabalho não pago) e a **alienação** do trabalho produzem o **fetichismo da mercadoria**. O **Estado** aparece como interesse geral, mas é uma **comunidade ilusória**.","“As ideias da classe dominante são as ideias dominantes.” A ideologia transforma o **particular em universal** e funciona por **abstração** (tomar o real como pronto) e **inversão** (tomar o efeito pela causa). Mantém-se pela **hegemonia** (Gramsci), mesmo entre quem luta contra a classe dominante."],"k":["Tracy, Napoleão, Comte, Durkheim","Divisão trabalho material x intelectual","Mais-valia, alienação, fetichismo","Estado = comunidade ilusória","Abstração e inversão; hegemonia"]},{"s":"mix","q":"Relacione a crítica à Psicologia Social norte-americana presente em Lane e em Bernardes com a ideia de que a psicologia pode reproduzir ou transformar a sociedade.","r":["Lane e Bernardes mostram que a PS norte-americana, pragmática e experimental, **individualizou o social**: tratou a sociedade como pano de fundo e buscou **ajustar** o indivíduo. Bernardes, com Farr, chama isso de **forma psicológica** de PS e mostra como o **positivismo** apagou outras tradições (a Völkerpsychologie de Wundt, Mead, o marxismo).","Para Lane, uma psicologia assim **reproduz** as relações sociais, porque toma como natural o que é histórico, como fazem os papéis, a família e a ideologia. Por isso a Europa denunciou seu **caráter ideológico** e a América Latina viveu a **crise** (Miami 1976, Lima 1979).","A resposta brasileira foi a **Abrapso (1980)**, com Silvia Lane: uma PS **histórica** e comprometida com a **transformação social**, que busca entender como o homem se torna **agente da história** pela consciência de si e de classe."],"k":["Individualização do social; ajustamento","Positivismo e esquecimentos","Reproduz: naturaliza o histórico (ideologia)","Crise: Miami e Lima","Abrapso; agente da história"]}],"numeros":[["1801","Destutt de Tracy cria o termo ideologia"],["1830-1834","Comte e a pergunta fundadora da PS"],["1879","Laboratório de Wundt em Leipzig"],["1900-1920","Völkerpsychologie, 10 volumes"],["1908","Ebbinghaus: “longo passado, curta história”"],["1918","Thomas e Znaniecki: PS = estudo das atitudes"],["1934","La Piere e o casal chinês"],["1935","Sherif e o efeito autocinético; Handbook de Murchison"],["1935-1941","Os 4 estudos de Lewin sobre os judeus"],["1943","Teoria geral das minorias (Cultural Reconstruction)"],["1945","Lewin funda o Centro de Dinâmica de Grupo no MIT"],["1946","Heider (equilíbrio) e Asch (linhas)"],["1949","The American Soldier (Stouffer)"],["1950","Adorno: personalidade autoritária"],["1954","Handbook de Lindzey: o “corte positivo”"],["1957","Festinger: dissonância cognitiva"],["1959","Festinger e Carlsmith; Aronson e Mills; French e Raven; 1º livro de PS no Brasil (Klineberg)"],["1961","Moscovici: A psicanálise, sua imagem e seu público"],["1962","Cursos de Psicologia no Brasil"],["1965","Milgram (62% até 450 V); Raven acrescenta a informação"],["1976 · 1979","Congressos de Miami e de Lima"],["1979","Danziger: “repúdio positivista de Wundt”"],["1980","Abrapso, com Silvia Lane"],["1982","Sivacek e Crano: interesse investido"],["1984","Lane e Codo: “Psicologia social: o homem em movimento”"],["1995","Rodrigues: atribuição e bases do poder"],["1996","Farr: história por instituições; Bond e Smith: 133 experimentos"],["33% · 62% · 1%","Asch · Milgram · previsão dos psiquiatras"],["92% de 128","La Piere: diriam que recusariam chineses"],["14% a 84%","Conformidade entre países (Smith et al., 2006); média 31,2%"]],"historias":[{"id":"vila","titulo":"Rafael e a Vila Esperança","est":["minorias"],"texto":["Numa fábrica de embalagens do interior paulista, 70% dos operários são migrantes nordestinos. Mesmo sendo a maioria, eles não decidem nada: turnos, salários e até a festa de fim de ano dependem da boa vontade da diretoria, que nunca os consulta.","Rafael, 19 anos, nasceu ali, filho de pais pernambucanos. Desde a escola ele esconde o sotaque, ri das piadas sobre “baiano” e diz que os conterrâneos “não querem nada com nada”. Tenta andar só com os filhos dos gerentes, mas nunca é convidado para as festas deles. Também já não se sente à vontade nos forrós da vila: vive entre dois mundos, sem pertencer a nenhum.","A avó dele, dona Cida, é o oposto: organiza a festa de São João, ensina as receitas da família e repete que “o que acontece com um de nós acontece com todos”. Quando a crise aperta e as demissões começam, os jornais da cidade passam a culpar “os de fora” pelo desemprego.","A associação de moradores discute o futuro. Um grupo propõe “mostrar que somos iguais a eles” para conseguir direitos. Outro propõe criar um centro cultural próprio e lutar pelos direitos da vila sem abrir mão da própria cultura. A irmã de Rafael decide contar logo à filha de 5 anos que a família sofre preconceito, “antes que ela descubra sozinha”."],"qs":[{"p":1,"trecho":"Mesmo sendo a maioria, eles não decidem nada: turnos, salários e até a festa de fim de ano dependem da boa vontade da diretoria.","q":"Pela teoria de Lewin, os operários migrantes, mesmo sendo 70%, formam:","o":["uma minoria psicológica","uma maioria psicológica, por serem mais numerosos","uma minoria privilegiada","um grupo sem interdependência de destino","um grupo-testemunha"],"a":0,"e":"O critério de Lewin não é o número, é a **tutela**: quem depende da boa vontade de outro grupo é **minoria psicológica**. A diretoria, poucos que mandam, lembra a **minoria privilegiada**, que fica dentro da maioria psicológica.","c":"Minoria psicológica (Lewin)","pista":"depender da boa vontade de outro grupo, seja qual for o número"},{"p":2,"trecho":"Desde a escola ele esconde o sotaque, ri das piadas sobre “baiano” e diz que os conterrâneos “não querem nada com nada”.","q":"A atitude de Rafael em relação ao próprio grupo é chamada por Lewin de:","o":["ódio de si","força centrípeta","chauvinismo positivo","emancipação","minoria privilegiada"],"a":0,"e":"**Ódio de si**: o minoritário passa a desprezar o próprio grupo, a língua e os costumes, com o olhar da maioria. Para Lewin é efeito da **discriminação** (sociopsicológico), não instinto nem doença.","c":"Ódio de si (Lewin)","pista":"desprezar o próprio grupo, esconder sotaque, língua ou costumes"},{"p":2,"trecho":"Tenta andar só com os filhos dos gerentes, mas nunca é convidado para as festas deles. [...] vive entre dois mundos, sem pertencer a nenhum.","q":"Rafael, que quer passar para a maioria e não é aceito por ela, é o que Lewin chama de:","o":["marginal, o “eterno adolescente” da periferia","membro do centro, identificado com as tradições","convertido, que passou por uma alternação completa","líder emancipado, que fala pela minoria inteira","representante da maioria psicológica da cidade"],"a":0,"e":"Na **periferia** ficam os **marginais**, ambivalentes, puxados pelas **forças centrífugas** (atração pela maioria). Sem pertencer a lado nenhum, viram o “eterno adolescente”. Alternação (Berger e Luckmann) seria trocar de mundo e ser acolhido pelo grupo novo, o que não acontece.","c":"Marginal, “eterno adolescente” (Lewin)","pista":"querer passar para a maioria, não ser aceito e ficar entre dois mundos"},{"p":3,"trecho":"A avó dele, dona Cida, [...] organiza a festa de São João, ensina as receitas da família.","q":"Dona Cida, que se identifica com as tradições e mantém o grupo unido, fica no ___ do grupo e expressa forças ___:","o":["centro; centrípetas","periferia; centrífugas","centro; centrífugas","periferia; centrípetas","núcleo central; periféricas"],"a":0,"e":"No **centro** estão os que se identificam positivamente com as tradições; as forças **centrípetas** (coesão, lealdade) puxam para dentro. “Núcleo central e periferia” é de **Abric**, sobre representações: outro texto.","c":"Centro e forças centrípetas (Lewin)","pista":"manter as tradições, unir o grupo, lealdade"},{"p":3,"trecho":"“o que acontece com um de nós acontece com todos”","q":"Para Lewin, a frase de dona Cida resume o que constitui todo grupo:","o":["a interdependência do destino","a semelhança entre os membros","a mesma origem regional","a presença de um líder","o número de membros"],"a":0,"e":"O que faz um grupo é ter a **sorte ligada** (interdependência do destino), não ser parecido. Na minoria integrada essa condição é aceita; na não integrada, apenas suportada.","c":"Interdependência do destino (Lewin)","pista":"a sorte de um é a sorte de todos"},{"p":3,"trecho":"Quando a crise aperta e as demissões começam, os jornais da cidade passam a culpar “os de fora” pelo desemprego.","q":"Na teoria geral das minorias, o que acontece com o grupo migrante na crise é:","o":["virar bode expiatório da agressividade da maioria","sofrer ódio de si, porque a crise é culpa dele","passar por uma alternação coletiva, mudando de mundo","virar maioria psicológica, por causa da união na crise","provocar reatância e fazer a maioria mudar de opinião"],"a":0,"e":"As discriminações **sobem e descem com a economia da maioria**. Na crise, a agressividade é deslocada para a minoria, que vira **bode expiatório**. É um problema **social**, não da conduta do grupo.","c":"Bode expiatório na crise (Lewin)","pista":"crise econômica e culpa jogada no grupo minoritário"},{"p":4,"trecho":"Um grupo propõe “mostrar que somos iguais a eles” para conseguir direitos. Outro propõe criar um centro cultural próprio e lutar pelos direitos da vila sem abrir mão da própria cultura.","q":"Para Lewin, qual proposta é a atitude “adulta”, a única que garante a sobrevivência do grupo?","o":["a do centro cultural: emancipação total","a de mostrar que são iguais: integração","nenhuma: a atitude adulta é a assimilação","as duas, porque integração e emancipação se equivalem","a de mostrar que são iguais: emancipação"],"a":0,"e":"“Mostrar que somos iguais” é **integração** (destacar o que aproxima da maioria): atitude adolescente, que cedo ou tarde vira **assimilação**. Manter a cultura e lutar pelos próprios direitos é **emancipação total**, a atitude **adulta**.","c":"Integração x emancipação (Lewin)","pista":"“somos iguais a eles” é integração; cultura própria e luta por direitos é emancipação"},{"p":4,"trecho":"A irmã de Rafael decide contar logo à filha de 5 anos que a família sofre preconceito, “antes que ela descubra sozinha”.","q":"A decisão da irmã de Rafael segue qual princípio de Lewin?","o":["contar cedo à criança, como se faz com a criança adotada","esconder até a adolescência, para protegê-la","deixar a escola cuidar disso na socialização secundária","formar o outro generalizado da criança","evitar o assunto para não provocar ódio de si"],"a":0,"e":"Lewin compara com a **criança adotada**: ela deve saber **cedo**. O conflito não vem de pertencer a vários grupos, mas da **incerteza** sobre o pertencimento.","c":"Educar a criança minoritária (Lewin)","pista":"contar cedo à criança que o grupo é discriminado"}]},{"id":"turma","titulo":"A turma que não queria mudar","est":["grupos"],"texto":["Carla, psicóloga, foi chamada por uma escola técnica para entender por que uma turma de enfermagem tinha tantos conflitos e notas tão baixas. Em vez de levar os alunos para testes num laboratório da universidade, ela decidiu estudar a turma na própria escola, nas aulas, nos intervalos e nos estágios.","Carla participou das atividades com o consentimento da turma, sem deixar de registrar tudo com rigor. Primeiro levantou como os alunos, os subgrupos e a turma inteira percebiam a situação; depois tentou prever como essas percepções iam evoluir; por fim, previu os novos comportamentos que poderiam surgir.","Ela também treinou dois estagiários de psicologia, que entraram na turma como colegas: puxavam conversas, propunham mudanças e observavam de dentro as reações.","Logo ficou claro que o problema não era este ou aquele aluno, mas a posição de cada um e dos subgrupos na turma: os veteranos perto do coordenador, os novatos isolados no fundo. O coordenador decidia tudo sozinho e punia quem discordava. Alguns veteranos, que ganhavam com isso, sabotavam em segredo qualquer proposta nova. Quando o coordenador passou a decidir junto com a turma, o clima mudou, e as atitudes coletivas também."],"qs":[{"p":1,"trecho":"Em vez de levar os alunos para testes num laboratório da universidade, ela decidiu estudar a turma na própria escola.","q":"A escolha de Carla segue a defesa que Lewin faz da:","o":["pesquisa de campo, já que o laboratório é artificial","explicação aristotélica, pela natureza de cada aluno","pesquisa de laboratório, com controle das variáveis","observação neutra, feita de fora do grupo pesquisado","tecnologia social de Varela, como no caso Rosa"],"a":0,"e":"Para Lewin, fenômenos de grupo só se entendem **na sociedade real**, em referência à sociedade global. O **laboratório é artificial**.","c":"Pesquisa de campo (Lewin)","pista":"estudar o grupo onde ele vive, e não no laboratório"},{"p":2,"trecho":"Carla participou das atividades com o consentimento da turma, sem deixar de registrar tudo com rigor.","q":"Nesse trecho, Carla atua como Lewin propõe:","o":["como participante e observadora ao mesmo tempo","como observadora neutra, que não interfere","como funcionária institucional da socialização secundária","como aliada de Asch, que engana o grupo","como autoridade legítima, que manda no grupo"],"a":0,"e":"Fenômenos sociais **não se observam de fora**: o pesquisador participa do devir do grupo, **com o consentimento** dos membros, sem deixar de ser objetivo.","c":"Participante e observador (Lewin)","pista":"participar do grupo com consentimento e registrar com rigor"},{"p":2,"trecho":"Primeiro levantou como [...] percebiam a situação; depois tentou prever como essas percepções iam evoluir; por fim, previu os novos comportamentos.","q":"Os três passos de Carla são:","o":["as 3 etapas da pesquisa-ação","os 3 estágios de Comte","os 3 momentos da dialética de Berger e Luckmann","as 3 distorções de Asch","os 3 componentes da atitude"],"a":0,"e":"**Pesquisa-ação**: 1) **analisar** as percepções do grupo; 2) **prever** a evolução delas; 3) prever os novos comportamentos (**agir**). Para Lewin, pesquisar é agir socialmente.","c":"Pesquisa-ação (Lewin)","pista":"analisar as percepções, prever a evolução, prever novos comportamentos"},{"p":3,"trecho":"Ela também treinou dois estagiários de psicologia, que entraram na turma como colegas: puxavam conversas, propunham mudanças e observavam de dentro as reações.","q":"Os estagiários cumprem o papel que Lewin chama de:","o":["grupos-testemunha, “átomos sociais radioativos”","aliados de Asch, que erram de propósito no grupo","minoria ativa de Moscovici, consistente e firme","outros significativos da turma, como na família","líderes que saem da periferia, como diz Lewin"],"a":0,"e":"Pesquisadores **treinados** entram no grupo real como membros, **provocam mudanças** e **observam de dentro**: são os grupos-testemunha. Os aliados de Asch eram cúmplices num **laboratório**, para induzir conformismo.","c":"Grupos-testemunha (Lewin)","pista":"pesquisadores treinados entram no grupo, provocam mudanças e observam"},{"p":4,"trecho":"o problema não era este ou aquele aluno, mas a posição de cada um e dos subgrupos na turma","q":"Essa forma de entender a turma corresponde ao conceito lewiniano de:","o":["campo social","eu íntimo","núcleo central","explicação aristotélica","socialização primária"],"a":0,"e":"**Campo social**: totalidade dinâmica de grupos, subgrupos e indivíduos, definida pelas **posições relativas** dos elementos. A explicação aristotélica, que Lewin rejeita, olharia a “natureza” de cada aluno.","c":"Campo social (Lewin)","pista":"posições relativas de pessoas e subgrupos"},{"p":4,"trecho":"Alguns veteranos, que ganhavam com isso, sabotavam em segredo qualquer proposta nova.","q":"Diante da mudança, esses veteranos são, segundo Mailhiot:","o":["conformistas em minoria, que resistem às escondidas","não conformistas, que veem a mudança como desejável","uma minoria ativa, que influencia pela consistência","um grupo-testemunha","vítimas de ódio de si"],"a":0,"e":"Quem tem **interesse no status quo** resiste, muitas vezes **clandestinamente**: são os **conformistas em minoria**, e a mudança fica lenta ou superficial.","c":"Resistência à mudança (Lewin)","pista":"quem ganha com o status quo sabota a mudança"},{"p":4,"trecho":"Quando o coordenador passou a decidir junto com a turma, o clima mudou, e as atitudes coletivas também.","q":"Para Lewin, o que explica a mudança das atitudes coletivas?","o":["o clima de grupo, que depende do tipo de autoridade","a vontade individual de cada aluno de mudar sozinho","a coerção, que é a base de poder mais eficaz de todas","o número de alunos, que define o tamanho da pressão","a dissonância cognitiva de cada aluno com o grupo"],"a":0,"e":"O fator decisivo é o **clima de grupo**, que depende do **tipo de autoridade**. Mudar atitudes coletivas é mudar o estilo de autoridade.","c":"Clima de grupo e autoridade (Lewin)","pista":"mudou o jeito de mandar, mudou o grupo"}]},{"id":"julia","titulo":"Júlia sai de casa","est":["socializacao"],"texto":["Júlia cresceu numa cidade pequena de Minas. Os pais, muito religiosos, ensinaram desde cedo o que era certo e errado, como falar, o que comer e em quem confiar. Para a pequena Júlia, aquilo não era um jeito de viver entre outros: era o único mundo possível.","O irmão caçula, Pedro, de 4 anos, já não diz só “a mamãe tá brava comigo agora”. Outro dia explicou para a prima: “aqui ninguém pode mexer no fogão”.","Aos 18 anos, Júlia foi estudar enfermagem na capital e começou a estagiar num hospital. Lá aprendeu termos técnicos, rotinas e regras com supervisoras que mudavam todo mês e mal sabiam o nome dela. Cumpria tudo direitinho, mas sem a emoção que sentia em casa.","Toda noite ela conversa com a mãe por vídeo sobre coisas banais, como o tempo, a novela e o vizinho, e sente que “o mundo continua no lugar”.","Depois de dois anos, Júlia entra para um coletivo da faculdade, passa a ver tudo de outro jeito, troca de amigos, se afasta da igreja e diz que “virou outra pessoa”. Só se sente segura das novas ideias quando está com o coletivo; longe dele, as dúvidas voltam."],"qs":[{"p":1,"trecho":"Os pais [...] ensinaram desde cedo o que era certo e errado, como falar, o que comer e em quem confiar.","q":"Para Berger e Luckmann, o que Júlia viveu na infância é a:","o":["socialização primária, pelos outros significativos","socialização secundária, por funcionários institucionais","alternação, que exige uma ressocialização completa","ancoragem de uma representação social sobre religião","exteriorização do mundo social criado p
