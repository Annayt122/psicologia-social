nada por dentro. **Dependente e privada**: **legitimidade, referência e conhecimento**, que continuam **mesmo sem** o influenciador (o aluno que usa o teste que o professor indicou)."},{"t":"Coerção x recompensa","d":"A **coerção** usada sempre **afasta** o influenciado. A **recompensa** pode gerar simpatia e virar **poder de referência**, ganhando o caráter **privado**."},{"t":"Poder no casal","d":"Entre cônjuges predominam **referência, conhecimento e legitimidade**; recompensa e coerção são os menos citados. Casais **satisfeitos**: **referência**; insatisfeitos: **coerção** (Raven, Centers e Rodrigues). No Brasil, cai o poder do marido e brasileiros preferem **recompensa** a coerção; americanos, o contrário."},{"t":"Obediência e atribuição","d":"**Rodrigues (1995)**, com a teoria de **Weiner**: se a pessoa foi levada a uma transgressão por **recompensa, informação ou referência** (Grupo 1), o ato parece mais **interno e controlável**: mais **responsabilidade**, culpa, raiva dos outros e punição. Por **coerção, legitimidade ou conhecimento** (Grupo 2), menos. Cenário: médico que convence a enfermeira a dar uma droga experimental."},{"t":"Crimes de obediência","d":"Quem age “**obedecendo a ordens superiores**” (legitimidade) consegue **eximir-se** de responsabilidade com mais facilidade (Kelman e Hamilton, 1989). **Blass (2000)**: as pessoas explicam a obediência em Milgram por conhecimento, legitimidade e coerção, o **Grupo 2**."}],"tabelas":[{"titulo":"Os três clássicos","cols":["","Sherif (1935)","Asch (1946)","Milgram (1965)"],"rows":[["Tarefa","Estimar o movimento de um ponto de luz no escuro","Dizer qual linha é igual à padrão","Dar choques crescentes em quem erra"],["Estímulo","**Ambíguo**","**Nítido**","Ordem de uma **autoridade**"],["Resultado","Julgamentos convergem para uma **norma**","Cerca de **33%** das respostas seguem a maioria","**62%** vão até **450 V**"],["Lição","Na dúvida, confiamos nos outros","Pressão do grupo; some com **um** dissidente","A **situação** supera o caráter"]]},{"titulo":"As 6 táticas de influência (como o livro define)","cols":["Tática","Como funciona","Exemplo do texto"],"rows":[["**Pé na porta**","Um **presente** ou qualquer atrativo para conseguir **ser ouvido** e entrar no assunto","O vendedor que dá um brinde antes de apresentar o produto"],["**Bola baixa**","Conseguir uma **adesão fácil** e só depois revelar o que vem junto","Topar participar de um experimento e só então saber que é às **7 da manhã** (Cialdini, 1978)"],["**Porta na cara**","Pedir algo **grande**, que será negado, e depois o pedido **real**, menor","O menino pede R$ 50 para balas e depois R$ 2; listas de Natal"],["**Isso não é tudo**","Antes de qualquer reação, **acrescentar vantagens** ou baixar o preço","Ofertas de produtos na TV"],["**Contraste perceptivo**","Mostrar antes algo **pior** para o alvo parecer melhor","A carta da estudante que inventa tragédias antes de contar as notas baixas"],["**Reciprocidade**","Um favor feito dá o **direito** de pedir outro","Ajudei a trocar seu pneu, agora me ajude"]]},{"titulo":"As 6 bases do poder","cols":["Base","B obedece a A porque…","Tipo de influência"],"rows":[["**Recompensa**","A pode **recompensar** (pai promete prêmio)","Dependente e **pública**"],["**Coerção**","A pode **punir** (chefe); acaba quando A perde o cargo","Dependente e **pública**"],["**Legitimidade**","Reconhece que A tem o **direito** de mandar (policial, não um transeunte)","Dependente e **privada**"],["**Referência**","A é **modelo**, positivo ou negativo (“Vote em Vatius”, em Pompeia)","Dependente e **privada**"],["**Conhecimento**","Reconhece a **competência** de A (o médico)","Dependente e **privada**"],["**Informação**","O **argumento** de A reorganizou a cognição de B","**Independente** (privada)"]]}],"nomes":[["Sherif, 1935","Efeito autocinético; norma de grupo"],["Asch, 1946","Linhas; 33%; unanimidade"],["Milgram, 1965","Obediência; 62% até 450 V; psiquiatras previram 1%"],["Kelman, 1958","Complacência, identificação, internalização"],["Latané, 1981","Impacto social: força e proximidade da fonte"],["Bond e Smith, 1996","133 experimentos: conformidade em queda"],["Moscovici, 1980/1985","Influência de minorias: consistência"],["Maas e Clark, 1983","Minoria gera aceitação privada"],["Cialdini, 2008","Táticas de influência"],["Varela, 1971","Tecnologia social; caso Rosa"],["French e Raven, 1959; Raven, 1965","Bases do poder social"],["Rodrigues, 1995; Weiner, 1986","Atribuição na obediência: Grupo 1 x Grupo 2"]],"pegadinhas":["No livro, **pé na porta** é o brinde ou atrativo para **ser ouvido**. Quem consegue o “sim” e só depois revela o custo é a **bola baixa**.","Em Asch, a **distorção da percepção** foi rara. A maioria cedeu por **ação** (falta de coragem) ou **julgamento** (dúvida sobre si).","Um único dissidente basta para quebrar a unanimidade e a pressão **sumir**.","**Informação** independe de quem fala; **conhecimento** depende da competência reconhecida de quem fala.","**Coerção e recompensa** são dependentes e **públicas**; **legitimidade, referência e conhecimento**, dependentes e **privadas**.","Celebridade opinando fora da própria área usa poder de **referência**, não de conhecimento.","No livro, Milgram obteve **62%**, não 65%. E as datas variam dentro do capítulo: no texto, Sherif (1935) e Milgram (1965); no resumo, Sherif (1936) e Milgram (1963). Asch é 1946 nos dois."],"ganchos":["**Sherif no escuro, Asch na régua, Milgram no choque.**","Bases do poder: **cenoura, chicote, crachá, ídolo, jaleco e argumento** (recompensa, coerção, legitimidade, referência, conhecimento, informação).","**RIR é culpa sua, CLC é culpa de quem mandou**: **R**ecompensa, **I**nformação, **R**eferência parecem escolha sua; **C**oerção, **L**egitimidade, **C**onhecimento parecem ordem de fora. Kelman: **cumpro, imito, incorporo**."],"conexoes":[{"para":"minorias","x":"Cuidado: **minoria psicológica** (Mailhiot) é quem vive em **tutela**; **influência de minorias** (Moscovici) é a minoria **consistente** que muda a maioria."},{"para":"representacoes","x":"O mesmo **Moscovici** das representações sociais criou a teoria da influência minoritária."},{"para":"atitudes","x":"A aquiescência forçada (US$ 1 x US$ 20) volta aqui: recompensa grande gera só obediência **pública**, sem mudança interna."},{"para":"historia","x":"**J. Varela**, o da tecnologia social, e **Aroldo Rodrigues** aparecem na História como os que levaram a Alapso ao extremo da PS norte-americana."}]},{"id":"minorias","linha":"np2","n":1,"nome":"Minorias","autor":"Mailhiot (sobre Kurt Lewin)","obra":"Dinâmica e gênese dos grupos · cap. 3, “As minorias psicológicas”","paginas":"pp. 34 a 53","bilhete":"Minoria **não é número, é tutela**: é o grupo cujo destino depende da boa vontade de outro. O que faz um grupo é a **interdependência do destino**, não a semelhança.","imagem":"Um grupo inteiro esperando, de chapéu na mão, a **boa vontade** de outro grupo para poder decidir a própria vida.","historia":["**Kurt Lewin**, judeu alemão que fugiu do nazismo, parte da psicologia do **próprio grupo** e chega a uma teoria de **qualquer minoria**.","**Minoria psicológica** é o grupo que vive em **tutela**, à mercê da boa vontade da maioria; **maioria psicológica** é o que se **autodetermina**. Isso independe da porcentagem.","A perseguição aos judeus é um problema **social**, não de conduta: a maioria precisa de um **bode expiatório** em tempos de crise, e uma **minoria privilegiada** canaliza o ódio.","A discriminação de fora vira **ódio de si** dentro do minoritário. Para Lewin é fenômeno **sociopsicológico**, não instinto (contra a leitura freudiana de Lessing e Levisohn).","Toda minoria vive entre forças **centrípetas** (coesão) e **centrífugas** (assimilação). Assimilar ou integrar é atitude **adolescente**; só a **emancipação total**, atitude **adulta**, garante a sobrevivência."],"conceitos":[{"t":"Minoria psicológica","d":"Grupo cujo destino coletivo **depende da boa vontade de outro**; vive em **estado de tutela**. Toda minoria psicológica é **discriminada** ou pode vir a ser."},{"t":"Maioria psicológica","d":"Grupo que tem **estruturas, status e direitos** para **se autodeterminar**, independente do número. Com o tempo tende a se **estratificar**: surge dentro dela uma **oligarquia**."},{"t":"Minoria privilegiada","d":"Minoria **demográfica** dentro de uma maioria psicológica, que a **controla e manipula** em proveito próprio, por exemplo canalizando o antissemitismo."},{"t":"Problema social, não individual","d":"Os judeus foram perseguidos **simplesmente por serem judeus**, independente da conduta. As discriminações **sobem e descem com a economia** da maioria; as justificativas mudam (religiosas há 400 anos, “pseudocientíficas” no nazismo)."},{"t":"Educar a criança minoritária","d":"Como a **criança adotada**, deve saber **cedo** que o grupo é discriminado. O conflito não vem de pertencer a vários grupos, mas da **incerteza sobre o pertencimento**. O grande perigo é ser **marginal**, um “**eterno adolescente**” que não pertence a lugar nenhum."},{"t":"Ódio de si (self-hatred)","d":"O minoritário passa a **desprezar o próprio grupo**: subgrupos se culpam, a pessoa rejeita família, costumes e língua, com autoacusação. É **sociopsicológico**, efeito da discriminação; tem traços neuróticos mas **não é neurose**, e **some com a igualdade de direitos**."},{"t":"Teoria geral das minorias (1943)","d":"Toda minoria é **social** na origem, na estrutura e na evolução. Origem: a **boa vontade da maioria** e o **bode expiatório** por deslocamento da agressividade em tempos de crise."},{"t":"Centro e periferia","d":"No **centro**, quem se identifica positivamente com as tradições. Na **periferia**, os **marginais**, ambivalentes, que querem passar para a maioria. É na periferia que estão os de **maior sucesso** e de onde saem os **líderes**."},{"t":"Forças centrípetas x centrífugas","d":"**Centrípetas**: coesão, lealdade, “chauvinismo positivo”, desejo de emancipação. **Centrífugas**: atração pela maioria e seus privilégios, “chauvinismo negativo”, desejo de **assimilação**."},{"t":"Interdependência do destino","d":"O **fator constitutivo de todo grupo**: o que une é ter **a sorte ligada**, não a semelhança. Na minoria integrada, a condição é **aceita**; na não integrada, **suportada**."},{"t":"Orgânicas x aparentes","d":"Minorias **orgânicas**: bem integradas, valência **positiva**. **Aparentes** ou artificiais: indivíduos unidos só pela pressão de fora, valência **negativa**."}],"tabelas":[{"titulo":"O futuro de uma minoria: 3 caminhos","cols":["Caminho","O que a minoria faz","Atitude"],"rows":[["**Assimilação**","Perde a fé na sobrevivência e acelera a assimilação à maioria","**Adolescente**"],["**Integração**","Busca igualdade de direitos destacando o que **aproxima** da maioria","**Adolescente**: cedo ou tarde é assimilada"],["**Emancipação total**","Separa-se e se emancipa para conservar cultura e identidade","**Adulta**: a única que sobrevive"]]},{"titulo":"Os 4 estudos de Lewin sobre os judeus","cols":["Estudo","Tema"],"rows":[["Psychosociological problem of a minority group (**1935**)","Esboço das ideias"],["When facing danger (**1939**)","Como a minoria sobrevive à perseguição; o problema é **social**"],["Bringing up the jewish child (**1940**)","Como **educar** a criança minoritária"],["Self-hatred among Jews (**1941**)","O **ódio de si**"]]}],"nomes":[["Kurt Lewin","Judeu alemão emigrado para os EUA; estuda minorias e depois pequenos grupos"],["1935-1941","Os 4 estudos sobre a psicologia dos judeus"],["Cultural Reconstruction, 1943","A teoria geral das minorias"],["Lessing e Levisohn","Explicavam o ódio de si por **instinto** (inspirados em Freud); Lewin recusa"]],"pegadinhas":["Se a questão definir minoria psicológica pela **porcentagem**, está errada: o critério é **depender da boa vontade de outro grupo**.","Para Lewin, o antissemitismo **não** depende do comportamento dos judeus. Até o **sucesso profissional** pode despertar perseguição.","O ódio de si **não** é instinto nem doença mental: é **sociopsicológico**.","Os **líderes** costumam vir da **periferia**, não do centro.","A minoria que tenta **se integrar** mantendo a identidade **se engana**: acaba assimilada."],"ganchos":["**Centrí-PETA pega junto. Centrí-FUGA foge do grupo.**","**Assimilar e integrar = adolescente. Emancipar = adulto.**"],"conexoes":[{"para":"influencia","x":"Atenção à palavra “minoria”: aqui é **tutela** (Mailhiot/Lewin); em Influência social, **influência de minorias** é a minoria **consistente** que muda a maioria (Moscovici)."},{"para":"grupos","x":"O mesmo Lewin passa das minorias para a **dinâmica dos pequenos grupos**."},{"para":"identidade","x":"Lane também mostra que a identidade nasce no **grupo** e depende do lugar que ele dá à pessoa."}]},{"id":"grupos","linha":"np2","n":2,"nome":"Grupos","autor":"Mailhiot (sobre Kurt Lewin)","obra":"Dinâmica e gênese dos grupos · cap. 4, “Da pesquisa-ação à dinâmica dos grupos”","paginas":"pp. 54 a 75","bilhete":"Lewin estuda o grupo **no campo, de dentro e junto**: o pequeno grupo é uma **totalidade dinâmica**, e pesquisar é **agir** para mudá-lo.","imagem":"Um pesquisador que entra no grupo como um **átomo radioativo**: provoca a mudança e observa, de dentro, o que acontece.","historia":["Dos estudos sobre minorias, Lewin conclui que fenômenos de grupo só se entendem **na sociedade real**: ele troca o **laboratório artificial** pela **pesquisa de campo**.","Base **gestáltica**: o grupo é uma **totalidade dinâmica**, irredutível à soma dos indivíduos; só o **pequeno grupo concreto** é observável. Ele rejeita as abordagens **atomísticas**.","A psicologia social deixa de estudar só a **socialização** (Moreno) e passa às **atitudes coletivas**, explicadas pelas **interações no momento** (esquema **galileano**, não aristotélico).","Três conceitos-chave: **totalidade dinâmica**, **eu social** (íntimo, social, público) e **campo social**. Para mudar um grupo é preciso mudar o **clima**, e o clima depende do **tipo de autoridade**.","**Pesquisa-ação**: pesquisar é **ação social**, feita em pequenos grupos reais por **grupos-testemunha** aceitos como membros, em **3 etapas**: analisar percepções, prever sua evolução, prever novos comportamentos."],"conceitos":[{"t":"Pesquisa de campo","d":"Fenômenos de grupo devem ser estudados **na sociedade real** e em referência à **sociedade global**, com **todas as ciências do social**. O laboratório é **artificial e inadequado**."},{"t":"Operacionismo","d":"Teorias só valem se forem **aplicáveis**, se permitirem **modificar** os fenômenos que explicam. Validade = **exatidão das previsões**. Influências: **pragmatismo americano** e o **devir hegeliano**."},{"t":"Participante e observador","d":"Fenômenos sociais não se observam de fora: o pesquisador **participa do devir** do grupo, **com o consentimento** dos membros, sem deixar de ser objetivo. Objetivos indissociáveis: **diagnóstico** + **dinâmica própria** do grupo."},{"t":"Gestalt","d":"O **todo explica as partes**. O **pequeno grupo concreto**, a “**célula social bruta**”, é a única totalidade dinâmica acessível à observação. Contra o atomismo: “**prospecções verticais**”, pegar o fenômeno inteiro, de dentro."},{"t":"Grupos-testemunha","d":"Pesquisadores treinados que entram nos grupos como “**átomos sociais radioativos**”: provocam mudanças e observam de dentro."},{"t":"Moreno x Lewin","d":"**Moreno**: socialização; **psicodrama, sociodrama, sociometria**; psicologia da aprendizagem. **Lewin**: **atitudes coletivas**; campo social; pesquisa-ação; Gestalt."},{"t":"Galileano x aristotélico","d":"Lewin rejeita a explicação **aristotélica** (pela natureza e pela causa histórica de cada elemento) e adota a **galileana**: explicar pelas **interações no momento observado**."},{"t":"Totalidade dinâmica","d":"Todo conjunto de **elementos interdependentes**. Todo grupo é uma, mas **nem toda totalidade dinâmica é grupo** (a personalidade também é)."},{"t":"Eu social","d":"A personalidade como **círculos concêntricos**: **eu íntimo** (centro, valores fundamentais, fechado) → **eu social** (valores partilhados com grupos) → **eu público** (periferia, aberto, automatismos). O eu social **encolhe ou dilata** conforme a situação."},{"t":"Campo social","d":"**Totalidade dinâmica** de entidades sociais coexistentes (grupos, subgrupos, indivíduos), definida pelas **posições relativas** dos elementos. É o conceito **mais importante** dos três."},{"t":"As 4 hipóteses sobre o grupo","d":"O grupo é: **terreno** onde o indivíduo se mantém; **instrumento** para satisfazer necessidades; **realidade** da qual ele faz parte; um dos determinantes do seu **espaço vital**."},{"t":"Resistência à mudança","d":"Diante da mudança: atitude **conformista** (mudança = **catástrofe**) ou **não conformista** (mudança = **desejável**). O fator decisivo é o **clima de grupo**, definido pelo **tipo de autoridade**."},{"t":"Pesquisa-ação","d":"Pesquisar é **agir socialmente**, reestruturando o grupo **de dentro**. Condições: **pequenos grupos** com problemas sociais reais e **grupos-testemunha** motivados, aceitos como **membros-participantes**. Foi o último texto de Lewin, escrito na véspera de morrer."}],"tabelas":[{"titulo":"As 3 etapas da pesquisa-ação","cols":["Etapa","O que se faz"],"rows":[["1. **Analisar**","Levantar as **percepções** do grupo (indivíduos, subgrupos, grupo)"],["2. **Prever**","Deduzir a **evolução possível** dessas percepções"],["3. **Agir**","Perceber e prever os **novos comportamentos** de grupo em harmonia com elas"]]},{"titulo":"O grupo diante da mudança","cols":["Situação","O que acontece"],"rows":[["Grupo **conformista**","Ninguém quer mudar: estereótipos e preconceitos; “esclerose social”"],["Conformistas em **minoria**","Quem tem interesse no **status quo** resiste, muitas vezes **clandestinamente**; mudança lenta ou superficial"],["Grupo **não conformista**","Estruturas **flexíveis e funcionais**, relações dinâmicas"]]}],"nomes":[["Kurt Lewin","Teórico da **Gestalt**; dinâmica de grupo; pesquisa-ação"],["Jacob Moreno","Psicodrama, sociodrama, **sociometria**"],["Galileu x Aristóteles","Explicar por **interações** x pela **natureza** de cada coisa"]],"pegadinhas":["Lewin **não** defende o laboratório: considera-o **artificial**.","Psicodrama e sociometria são de **Moreno**, não de Lewin.","“Átomos sociais radioativos” são os **pesquisadores** dos grupos-testemunha, não membros problemáticos.","O núcleo da personalidade é o **eu íntimo**; o **eu público** é a casca.","O fator decisivo da mudança é o **clima de grupo** (tipo de autoridade), não a vontade individual."],"ganchos":["Pesquisa-ação = **A-P-A**: **A**nalisar, **P**rever, **A**gir.","4 hipóteses do grupo = **T-I-R-E**: **T**erreno, **I**nstrumento, **R**ealidade, **E**spaço vital. Eu social = **cebola**: íntimo (miolo), social (meio), público (casca)."],"conexoes":[{"para":"historia","x":"Bernardes mostra o lado institucional: Lewin funda o **Centro de Pesquisa em Dinâmica de Grupo** no **MIT (1945)**."},{"para":"minorias","x":"As duas conclusões que levam ao campo vêm dos estudos de **minorias**."},{"para":"atitudes","x":"Aroldo estuda **atitudes individuais** (componentes, dissonância); Lewin estuda **atitudes coletivas** de grupo."}]},{"id":"socializacao","linha":"np2","n":3,"nome":"Socialização","autor":"Berger e Luckmann","obra":"A construção social da realidade · cap. 3, “A sociedade como realidade subjetiva”","paginas":"pp. 173 a 241","bilhete":"A sociedade **sai de nós**, vira **coisa** e **volta para dentro**. A **socialização primária** dá o primeiro mundo, com afeto; a **secundária** dá submundos, com crachá; a **conversa** mantém tudo de pé.","imagem":"Uma criança no colo aprendendo que o mundo da mãe é **o** mundo. Anos depois, a mesma pessoa de **crachá**, aprendendo só um papel.","historia":["A sociedade é um processo **dialético** de 3 momentos: **exteriorização** (criamos o mundo social), **objetivação** (ele vira realidade “de fora”) e **interiorização** (ele entra na consciência). O cap. 3 trata da **interiorização**.","**Socialização primária**: na infância, com **outros significativos** impostos (não escolhidos) e **forte carga emocional**. O mundo da infância é aceito **como O mundo**. Termina quando surge o **outro generalizado** (Mead).","**Socialização secundária**: depois, introduz o indivíduo em **submundos institucionais** (profissão, escola), com **funcionários** substituíveis e pouca emoção. Precisa se sobrepor a um mundo que **já existe**.","A realidade subjetiva precisa ser **mantida**: pela **rotina** e sobretudo pela **conversa**, dentro de uma **estrutura de plausibilidade**. A **alternação** (ex.: conversão) troca o mundo inteiro e exige **ressocialização**.","**Socialização bem-sucedida** é a simetria entre realidade objetiva e subjetiva, nunca total. A **identidade** é formada por processos sociais e mantida ou mudada pelas relações."],"conceitos":[{"t":"Exteriorização","d":"O ser humano **expressa e cria** o mundo social com sua ação: “a sociedade é um **produto humano**”."},{"t":"Objetivação","d":"O que foi criado **ganha existência própria** e parece “coisa” externa (as instituições): “a sociedade é uma **realidade objetiva**”. (Tema do cap. 2.)"},{"t":"Interiorização","d":"O mundo objetivo **entra na consciência** e ganha sentido: “o homem é um **produto social**”. É o **ponto de partida** do indivíduo e a base da **socialização**."},{"t":"Socialização primária","d":"A **primeira**, na **infância**, pela qual o indivíduo se torna membro da sociedade. Outros significativos **impostos**; **forte carga emocional**: “a interiorização só acontece quando há **identificação**”. O que mais se interioriza é a **linguagem**."},{"t":"Outros significativos","d":"Pais e cuidadores que **filtram** o mundo para a criança: ela absorve a visão da sua **classe social** com a coloração particular deles. A criança **não os escolhe**."},{"t":"Outro generalizado (Mead)","d":"A abstração de papéis concretos para papéis em geral: de “**mamãe está zangada comigo agora**” para “**mamãe fica zangada toda vez que eu derramo a sopa**”. **Marca o fim da socialização primária.**"},{"t":"O “conto do vigário”","d":"O mundo da infância é aceito **não como um mundo possível, mas como O mundo**; por isso fica **entrincheirado** e faz parecer **necessário** o que é **contingente**."},{"t":"Socialização secundária","d":"Interiorização de **submundos institucionais** ligados à **divisão do trabalho**, com **vocabulário próprio** da função. Agentes: **funcionários institucionais**, com **alto anonimato**; pouca emoção; mais **frágil**."},{"t":"Conversa","d":"O **veículo mais importante** de conservação da realidade. Funciona sobretudo de forma **implícita**: a conversa casual confirma o mundo justamente por ser casual. **Frequência** reforça; **intensidade** compensa."},{"t":"Estrutura de plausibilidade","d":"A **base social** que sustenta uma realidade e permite **suspender a dúvida**. Dentro dela, quem duvida se sente **ridículo**."},{"t":"Alternação","d":"Transformação **quase total** da realidade subjetiva; exige **ressocialização**. Protótipo: a **conversão religiosa**, que só se mantém dentro da **comunidade**, com novos outros significativos e afastamento do mundo antigo."},{"t":"Socialização bem-sucedida","d":"**Alta simetria** entre realidade objetiva e subjetiva. A totalmente bem-sucedida é **antropologicamente impossível**."},{"t":"Identidade","d":"Formada por **processos sociais**; depois de cristalizada, é **mantida, modificada ou remodelada** pelas relações sociais, e também **reage sobre a estrutura social**. Dialética entre identidade **atribuída** e **apropriada**."}],"tabelas":[{"titulo":"Primária x secundária","cols":["","Primária","Secundária"],"rows":[["Quando","Infância","Depois, ao longo da vida"],["O que se interioriza","O **mundo básico**","**Submundos** institucionais"],["Quem socializa","**Outros significativos**","**Funcionários** substituíveis"],["Emoção","**Alta**: exige identificação","**Baixa**: formalidade e anonimato"],["Firmeza","Muito firme","Mais frágil"]]}],"nomes":[["Peter Berger e Thomas Luckmann","A construção social da realidade"],["George H. Mead","Conceito de **outro generalizado**"],["“Eu sou John Smith”","Receber uma identidade é receber um **lugar no mundo**"],["“Sou soldado de cavalaria”","Exemplo do vocabulário próprio da socialização secundária"]],"pegadinhas":["O cap. 3 é a sociedade como realidade **subjetiva** (interiorização). Institucionalização e legitimação são do **cap. 2**.","Na socialização primária **não há escolha** dos outros significativos.","O veículo mais importante de manutenção é a **conversa**, e ela age sobretudo de forma **implícita**.","“A criança deve amar a mãe, mas **não o professor**”: é mais fácil se esconder da professora do que da mãe.","Socialização **totalmente** bem-sucedida é impossível."],"ganchos":["**Ex-Ob-In**: sai de mim, vira coisa, volta para dentro.","Primária = **colo**. Secundária = **crachá**. Realidade = **planta** que se rega com conversa, num **vaso** (estrutura de plausibilidade); trocar o vaso inteiro = **alternação**."],"conexoes":[{"para":"linguagem","x":"Lane usa os mesmos conceitos: **outros significativos**, mundo único da infância, questionamento na socialização secundária."},{"para":"historia","x":"Bernardes cita Berger e Luckmann entre as perspectivas **sociológicas** e Mead entre os **esquecidos** pelo positivismo."},{"para":"representacoes","x":"Moscovici também trata a realidade como **construção social** partilhada no cotidiano."}]},{"id":"representacoes","linha":"np2","n":4,"nome":"Representações","autor":"Serge Moscovici · Gabriel Pinelli Ferraz","obra":"Representações sociais, cap. 1 · Dissertação de Ferraz, cap. 1","paginas":"Moscovici cap. 1; Ferraz pp. 20 a 44","bilhete":"Representação social é o **saber do senso comum** que um grupo fabrica para **tornar familiar o não familiar**, por **ancoragem** (dar nome) e **objetivação** (virar imagem).","imagem":"Uma conversa de bar transformando uma palavra estranha numa imagem que todo mundo entende, como explicar Deus a uma criança como “**papai do céu**”.","historia":["**Moscovici** cria o conceito em **A psicanálise, sua imagem e seu público (1961)**, estudando como a psicanálise entrou no senso comum francês. A ideia central: **a sociedade pensa**.","RS é conhecimento **socialmente elaborado e partilhado**, com **objetivo prático**, que constrói uma **realidade comum** a um grupo (definição de **Jodelet**). Ela **convencionaliza** e **prescreve**.","Vivemos em dois universos: o **consensual** (conversa, todos amadores), onde estão as RS, e o **reificado** (ciência, especialistas).","A finalidade de toda RS é **tornar familiar o não familiar**, por dois mecanismos: **ancoragem** (classificar e dar nome) e **objetivação** (transformar ideia em imagem concreta). Na pesquisa de Ainay-le-Château, os ritos mostram que a RS resiste à explicação dos médicos.","A RS vem da **representação coletiva de Durkheim** (estática), mas é **dinâmica**. **Abric**: 4 funções e um **núcleo central** estável protegido por um **sistema periférico** flexível."],"conceitos":[{"t":"Representação social","d":"Segundo Jodelet: “forma de conhecimento, **socialmente elaborado e partilhado**, com um **objetivo prático**, que contribui para a construção de uma **realidade comum** a um conjunto social”. É o **saber do senso comum**. Moscovici evitou definir para não limitar o campo."},{"t":"Objeto e sujeito","d":"Toda RS é **de um objeto e de um sujeito**: **simboliza** o objeto e o **interpreta**. Tem face **icônica** (imagem) e **simbólica** (ideia)."},{"t":"Convencionalizar","d":"Dar forma definitiva e colocar numa **categoria**, num modelo partilhado. Só vemos o que as convenções **permitem ver**."},{"t":"Prescrever","d":"A RS se **impõe como força**: decreta o que pensar e como, a partir de **tradições** anteriores a nós. “**Quanto menos** pensamos nelas, quanto **menos conscientes** somos delas, **maior** é a sua influência.”"},{"t":"Universo consensual","d":"A sociedade como grupo de **iguais e livres**; todos podem opinar como **“amadores”**; funciona pela **conversação**. É onde vivem as **RS**; a PS seria a ciência desse universo."},{"t":"Universo reificado","d":"A sociedade como sistema de **papéis desiguais**; só fala quem tem **competência** (“como médico”). É o universo da **ciência**. As **ideologias** fazem a passagem entre os dois."},{"t":"Tornar familiar o não familiar","d":"O novo causa **estranhamento e ameaça**; a RS o incorpora ao senso comum. O **passado prevalece** sobre o presente e a **memória** sobre a dedução."},{"t":"Ancoragem","d":"“**Classificar e dar nome** a alguma coisa.” O estranho é comparado ao **protótipo** de uma categoria e recebe as características dela. Toda classificação **atribui valor**: não há neutralidade. Ex.: o aluno agitado vira “**louco**”."},{"t":"Objetivação","d":"“Reproduzir um **conceito** em uma **imagem**.” O abstrato vira **concreto**; forma-se o **núcleo figurativo**; com o uso, “**o percebido substitui o concebido**”. Ex.: “**papai do céu**”."},{"t":"Ainay-le-Château (Jodelet)","d":"Vila francesa que recebeu doentes mentais em casas de família. Mesmo com médicos dizendo que **não é contagioso**, os moradores mantinham **ritos** (louça e roupa separadas). A **ação** cria e perpetua a representação."},{"t":"Durkheim x Moscovici","d":"Representação **coletiva** (Durkheim): **sociologia**, **estática**, conceito explicativo. Representação **social** (Moscovici): **psicologia social**, **dinâmica**, fenômeno que circula e muda."},{"t":"Funções de Abric","d":"**Saber** (compreender e explicar), **identitária** (define grupos), **orientação** (guia condutas) e **justificatória** (justifica depois as decisões)."},{"t":"Núcleo central x periferia","d":"**Núcleo central**: poucos elementos que **dão sentido**, histórico, consensual, **resistente à mudança**. **Sistema periférico**: **flexível**, sensível ao contexto, **protege o núcleo** e permite variações individuais."},{"t":"Jovchelovitch e Ferraz","d":"**Jovchelovitch (2000)**: RS envolvem cognição, **afeto** e ação; ficam no **espaço entre** indivíduo e sociedade; atravessadas por **relações de poder**. **Ferraz** analisa **charges** sobre Dilma Rousseff na Folha: o humor **desvia das barreiras da razão**."}],"tabelas":[{"titulo":"Ancoragem x objetivação","cols":["","Ancoragem","Objetivação"],"rows":[["O que faz","**Classifica e dá nome**","Transforma **ideia em imagem**"],["Função (Sá)","Duplica **uma figura por um sentido**: dá contexto","Duplica **um sentido por uma figura**: dá matéria"],["Memória","Dirigida **para dentro**","Dirigida **para fora**"],["Exemplo","O aluno agitado vira “**louco**”","Deus vira “**papai do céu**”"]]},{"titulo":"Universo consensual x reificado","cols":["","Consensual","Reificado"],"rows":[["Sociedade vista como","Iguais e livres","Papéis e classes desiguais"],["Quem fala","Todos, como **amadores**","Só **especialistas**"],["Quem trata dele","As **RS**","As **ciências**"]]}],"nomes":[["Moscovici, 1961","A psicanálise, sua imagem e seu público"],["Jodelet","A definição de RS; a pesquisa de **Ainay-le-Château**"],["Durkheim","Representação **coletiva**"],["Abric (1976; 1994)","Núcleo central; as 4 funções"],["Jovchelovitch (2000)","RS como mediação, com afeto e poder"],["Gabriel Pinelli Ferraz","Dissertação: charges sobre Dilma Rousseff"]],"pegadinhas":["As RS pertencem ao universo **consensual**; a ciência é do **reificado**.","**Nomear = ancoragem. Virar imagem = objetivação.** “Papai do céu” é **objetivação**.","A influência das RS é **maior** quando estamos **menos** conscientes delas.","Quem muda fácil é o **sistema periférico**; o **núcleo central resiste**.","Representação **coletiva** é de Durkheim; representação **social** é de Moscovici."],"ganchos":["**Âncora prende** o barco num lugar conhecido; **objetivar** é virar **objeto** que dá para ver.","Funções de Abric = **S-I-O-J**: “**S**ei, **I**dentifico, **O**riento, **J**ustifico”. Núcleo = **caroço**; periferia = **polpa**."],"conexoes":[{"para":"influencia","x":"O mesmo **Moscovici** criou a ideia de **influência de minorias** que aparece no texto de Aroldo."},{"para":"linguagem","x":"Lane já chamava de representação “o **sentido pessoal** dado a **significados sociais**”."},{"para":"historia","x":"Para Farr, as RS são o exemplo de **forma sociológica** de psicologia social."},{"para":"ideologia","x":"Para Moscovici, as **ideologias** fazem a passagem entre o universo consensual e o reificado."}]},{"id":"ideologia","linha":"np2","n":5,"nome":"Ideologia","autor":"Marilena Chaui","obra":"O que é ideologia · cap. 3 (histórico do termo) e cap. 4 (concepção marxista)","paginas":"caps. 3 e 4","bilhete":"Ideologia **não é qualquer conjunto de ideias**: é o processo em que as **ideias da classe dominante** viram as ideias de todos e **escondem a dominação**, por **abstração** e **inversão**.","imagem":"Óculos que mostram o mundo **de cabeça para baixo**: tudo o que você vê é real, só que invertido.","historia":["O termo nasce com **Destutt de Tracy (1801)**: “ciência da gênese das ideias”. **Napoleão** o torna **pejorativo**; **Comte** o usa como **teoria**; **Durkheim**, como **pré-noções** não científicas.","**Marx** conserva a **dialética** de Hegel, mas troca o **Espírito** pela **luta de classes**: a história é como **homens reais produzem suas condições reais de existência**.","No capitalismo, o valor vem do **trabalho não pago** (**mais-valia**); daí a **alienação** do trabalho e o **fetichismo da mercadoria**: coisas viram “gente” e pessoas viram coisas (**reificação**).","A ideologia nasce quando a **divisão do trabalho** separa **trabalho material e intelectual**: as ideias parecem independentes do real. O **Estado** aparece como interesse geral, mas é **comunidade ilusória**.","“As **ideias dominantes** são as ideias da **classe dominante**.” A ideologia transforma o **particular em universal**; é **ilusão** por **abstração** e **inversão**; mantém-se pela **hegemonia** (Gramsci)."],"conceitos":[{"t":"Destutt de Tracy (1801)","d":"Cunhou **ideologia**: “**ciência da gênese das ideias**”, tratadas como fenômenos naturais. Os “ideólogos franceses” eram **materialistas**, antiteológicos e **antimonárquicos**."},{"t":"Napoleão (1812)","d":"Deu o **sentido pejorativo**: “essa **tenebrosa metafísica**”. **Marx conserva esse sentido**: ideólogo é quem **inverte** a relação entre ideias e real."},{"t":"Comte","d":"Ideologia = **teoria**, ideias de uma época organizadas pelos sábios. **3 fases**: teológica, metafísica, positiva. Lemas: “**saber para prever, prever para prover**” e “**Ordem e Progresso**”."},{"t":"Durkheim","d":"Ideologia = conhecimento **não científico**: **pré-noções**, preconceitos. Regra: tratar o **fato social como coisa**. Para Chaui, a própria visão positivista **é ideológica** e anuncia a **tecnocracia**."},{"t":"Hegel x Marx","d":"**Hegel**: o sujeito da história é o **Espírito**; o Estado é a **síntese** dos interesses. **Marx**: o sujeito são as **classes em luta**; o Estado é a **vitória de uma classe**, uma **comunidade ilusória**."},{"t":"Contradição","d":"Diferente de oposição: na contradição **só existe a relação** (negação interna). Senhor e escravo só existem um pelo outro; a **canoa é a não-árvore**."},{"t":"Mais-valia","d":"O **tempo de trabalho não pago**. Ex. do texto: o produto vale 8 horas (R$ 16), o salário paga R$ 8: **4 horas não pagas** viram lucro. **A origem do capital é o trabalho não pago.**"},{"t":"Alienação","d":"O produtor **não se reconhece** no que produz. Contra **Feuerbach**, a alienação fundamental é a **do trabalho**; a religiosa é efeito dela. É **objetiva**, não só erro de consciência."},{"t":"Fetichismo e reificação","d":"**Fetichismo da mercadoria**: o produto parece ter **vida e poder próprios**. **Reificação** (Lukács, de res = coisa): **homens viram coisas e coisas viram “gente”**."},{"t":"Origem da ideologia","d":"A **divisão social do trabalho** separa **material e intelectual**; quem produz ideias fica longe da produção, e as ideias parecem **autônomas**. Os homens se distinguem dos animais **porque produzem** suas condições de existência."},{"t":"Estado","d":"**Comunidade ilusória**: aparece como representante do interesse geral, mas preserva os interesses da **classe dominante**, de forma **impessoal**, pelas leis."},{"t":"Ideologia (definição)","d":"Processo pelo qual as ideias da classe dominante viram as **ideias dominantes**, distribuídas por **educação, religião, costumes e mídia**, para **ocultar a dominação**. Transforma o **particular em universal** (universalidade abstrata)."},{"t":"Abstração e inversão","d":"**Abstração**: tomar a realidade como **dada e pronta**, sem perguntar como foi produzida. **Inversão**: tomar o **efeito pela causa** (“somos desiguais porque Deus ou a natureza quis”). A aparência **não é falsa**: é o real de ponta-cabeça."},{"t":"Hegemonia (Gramsci)","d":"O poder espiritual da classe dominante, que faz as pessoas manterem as ideias dominantes **mesmo lutando contra ela**. Ideias de classe ascendente (liberdade e igualdade burguesas) viram **senso comum**."}],"tabelas":[{"titulo":"O que “ideologia” já significou","cols":["Quem","Sentido"],"rows":[["**Destutt de Tracy** (1801)","Ciência da **gênese das ideias**"],["**Napoleão** (1812)","**Pejorativo**: “tenebrosa metafísica”"],["**Comte**","**Teoria**: ideias de uma época"],["**Durkheim**","**Pré-noções** não científicas"],["**Marx** (com Chaui)","**Ocultamento** da dominação de classe"]]}],"nomes":[["Destutt de Tracy, 1801","Cria o termo; com Cabanis, De Gérando e Volney"],["Napoleão, 1812","Sentido pejorativo"],["Marx e Engels","A Ideologia Alemã; “as ideias da classe dominante são as ideias dominantes”"],["Feuerbach","Alienação religiosa (Marx critica)"],["Lukács","Reificação"],["Gramsci","Hegemonia; senso comum"]],"pegadinhas":["Quem cunhou o termo foi **Destutt de Tracy**, não Marx; o sentido **pejorativo** veio de **Napoleão**.","Para Marx, o Estado **não** é a síntese dos interesses (isso é **Hegel**): é **comunidade ilusória**.","Marx **conserva** a dialética de Hegel, mas sobre bases **materiais**.","A alienação fundamental é a do **trabalho**, não a religiosa.","Ideologia, em Chaui, **não é** “visão de mundo” qualquer nem programa de partido."],"ganchos":["**T-N-C-D**: **T**racy criou, **N**apoleão xingou, **C**omte virou teoria, **D**urkheim chamou de preconceito.","Ideologia = **óculos de ponta-cabeça**: **abstração** (não pergunta como foi feito) + **inversão** (efeito vira causa)."],"conexoes":[{"para":"linguagem","x":"Lane: o intelectual que **fala bem** produz explicações que justificam a sociedade, com **função ideológica falseadora**."},{"para":"identidade","x":"Lane: papéis e identidade fazem **mediação ideológica**, parecendo naturais."},{"para":"brasil","x":"A crítica europeia acusou a PS norte-americana de **caráter ideológico**, mantenedora das relações sociais."},{"para":"historia","x":"Comte aparece em três textos: em Lane (fundador da PS), em Bernardes (3 estágios; ancestral segundo Allport) e em Chaui (ideologia como teoria)."}]}],"quiz":[{"s":"identidade","q":"Para Silvia Lane, a Psicologia Social estuda:","o":["a relação essencial entre indivíduo e sociedade, entendida historicamente","como o indivíduo é influenciado pela presença real ou imaginada dos outros","o estudo científico das atitudes individuais diante dos objetos sociais","os processos inconscientes coletivos que determinam a vida em sociedade","as leis gerais do comportamento social, válidas para toda a espécie humana"],"a":0,"e":"É a definição de Lane. “Estudo científico das atitudes” é a definição de **Thomas e Znaniecki (1918)**, citada no texto de Aroldo."},{"s":"identidade","q":"Lane diz que “se aprende quando reforçado”, mas acrescenta que:","o":["é a história do grupo que define o que é reforçador e o que deve ser aprendido","o reforço só funciona em laboratório, longe dos significados criados pelo grupo","o reforço é biológico e, por isso, funciona igual em todas as culturas humanas","as emoções são universais e, por isso, independem do que o grupo ensina a sentir","a punição, e não o reforço, é o que de fato modela o comportamento na vida social"],"a":0,"e":"Doce, dinheiro ou sorriso só reforçam conforme o que **significam** naquele grupo. Até as emoções, universais, se ligam ao que o grupo ensina a temer ou celebrar."},{"s":"identidade","q":"“Um gerente só age como gerente porque há funcionários que dão sentido à ação dele.” Em Lane, isso ilustra:","o":["a complementaridade dos papéis sociais","a consciência de si diante do grupo","a mediação ideológica exercida pela linguagem","a socialização secundária no trabalho","a identidade como opção livre de cada um"],"a":0,"e":"Os papéis são **complementares**: “para agir como chefe tem que ter outros que ajam como chefiados”."},{"s":"identidade","q":"O contraste entre a rainha Elizabeth na abertura do Parlamento e o “Zé da Silva” num país estranho mostra que:","o":["quanto mais a relação sustenta a sociedade, mais definido o papel, menor a liberdade","pessoas famosas desempenham mais papéis e, por isso, têm mais liberdade de estilo","longe da sua sociedade, o estrangeiro perde a identidade social e não sabe quem é","os papéis só determinam a ação dentro de instituições oficiais, como o Parlamento inglês","a liberdade é a mesma em qualquer situação; o que muda é só o grau de formalidade"],"a":0,"e":"A rainha segue um protocolo total; o Zé, longe das determinações da sua sociedade, “pode ser ele mesmo”. O trabalhador diante do chefe também segue protocolo."},{"s":"identidade","q":"Assinale a afirmação INCORRETA sobre a identidade social em Lane:","o":["É fruto de opções livres e da constituição biogenética de cada um","É o que respondemos quando nos perguntam “quem é você?”","É definida pelo conjunto de papéis sociais que desempenhamos na vida","Pode exercer mediação ideológica, pois parece natural e imutável","Forma-se no confronto de semelhanças e diferenças com os outros"],"a":0,"e":"Lane critica justamente essa ideia: parece escolha livre ou herança, mas são as **condições sociais da produção da vida material** que determinam papéis e identidade."},{"s":"identidade","q":"Analise: I. A consciência de si pode alterar a identidade social. II. A consciência de si é uma introspecção solitária, sem relação com o grupo. III. Lane cita Leontiev: a consciência individual só existe onde existe a consciência social. Está correto o que se afirma em:","o":["I e III, apenas","I e II, apenas","II e III, apenas","I, II e III","II, apenas"],"a":0,"e":"II é falsa: a consciência de si nasce de questionar a **determinação histórica** dos papéis, de preferência **com o grupo**, que pode virar agente de mudança."},{"s":"identidade","q":"Segundo Lane, os grupos considerados “marginais”:","o":["reafirmam os “sérios e trabalhadores”, desde que não ponham em risco a ordem","são os únicos grupos realmente livres de qualquer determinação social","são a origem da consciência de classe e da transformação da sociedade","estão fora de qualquer papel social e, por isso, não têm identidade definida","ameaçam sempre o sistema produtivo e, por isso, são sempre reprimidos pela polícia"],"a":0,"e":"Às vezes a contravenção é necessária para **reforçar o que é tido como correto**. A liberdade é permitida onde não ameaça a ordem."},{"s":"linguagem","q":"Lane usa o exemplo de Leontiev (“o significado da palavra alimento não contém um grama de substância alimentícia”) para mostrar que:","o":["há uma distância entre palavra e objeto, e nela a linguagem pode servir à dominação","a linguagem reflete os objetos de forma direta, por isso o significado é sempre fiel","as palavras têm um significado natural e fixo, que nenhum grupo consegue alterar","a fome é um fenômeno social, e não biológico, como mostra a palavra alimento","o pensamento só opera com objetos concretos, e nunca com palavras abstratas"],"a":0,"e":"Palavra e objeto não são a mesma coisa. Quem impõe um **significado único** à palavra pode comandar a ação dos outros."},{"s":"linguagem","q":"Segundo Terwilliger, citado por Lane, a hipnose fracassa quando:","o":["o hipnotizador fala de situações totalmente desconhecidas do hipnotizado","o hipnotizado está relaxado demais para acompanhar as sugestões verbais","as sugestões envolvem sensações físicas intensas, como frio e calor","o hipnotizador é visto como autoridade, e o hipnotizado resiste a obedecer a ele","a sessão acontece em grupo, e a presença dos outros quebra o efeito da sugestão"],"a":0,"e":"Seria como falar num idioma desconhecido: a sugestão só “vira real” quando se refere a situações **conhecidas**."},{"s":"linguagem","q":"Para Lane, separar agir, pensar e falar é alienação. Agir sem pensar, falar sem pensar e falar sem agir correspondem, nessa ordem, a:","o":["autômato; papagaio; “de boas intenções o inferno está cheio”","papagaio; autômato; “de boas intenções o inferno está cheio”","autômato; “de boas intenções o inferno está cheio”; papagaio","papagaio; “de boas intenções o inferno está cheio”; autômato","“de boas intenções o inferno está cheio”; autômato; papagaio"],"a":0,"e":"Agir sem pensar = **autômato**; falar sem pensar = **papagaio**; falar sem agir = **boas intenções**."},{"s":"linguagem","q":"Em Lane, “representação” é:","o":["o sentido pessoal que atribuímos aos significados elaborados socialmente","classificar algo novo numa categoria já conhecida e dar a ele um nome","transformar uma ideia abstrata numa imagem concreta e quase palpável","o conhecimento científico reelaborado e divulgado para o público leigo","uma imagem mental puramente individual, formada sem influência do grupo social"],"a":0,"e":"Definição de Lane. “Classificar e dar nome” e “transformar em imagem concreta” são **ancoragem** e **objetivação**, de Moscovici: parecidas, mas de outro texto."},{"s":"linguagem","q":"Para Lane, o adolescente passa a questionar os “outros significativos” porque:","o":["na socialização secundária encontra outras visões de mundo e outros afetos","é uma fase natural e biológica do desenvolvimento, igual em todas as sociedades","tem um instinto de rebeldia contra a autoridade dos pais e dos professores","a família extensa perde o poder sobre ele quando chega a puberdade","isso só acontece nas classes privilegiadas, que têm acesso a mais estudo"],"a":0,"e":"Lane recusa a ideia de “fase natural”: o questionamento vem do contato com **alternativas**, na escola e na profissão."},{"s":"linguagem","q":"Assinale a afirmação INCORRETA sobre a família em Lane:","o":["É natural e universal, sem relação com a propriedade ou com o poder","Reproduz a força de trabalho e ajuda a perpetuar a propriedade","Sofre controle social rigoroso por parte de quem detém o poder","Seus papéis reproduzem as relações de poder da sociedade mais ampla","Tende a ser conservadora, porque apresenta o poder como algo natural"],"a":0,"e":"A família **parece** natural e universal, mas Lane mostra sua função na reprodução da força de trabalho, da propriedade e das relações de poder."},{"s":"linguagem","q":"Na lavagem cerebral, segundo Terwilliger (em Lane):","o":["isola-se o preso, e os novos “outros significativos” só emitem os novos significados","ensina-se o prisioneiro a questionar as ordens recebidas e a pensar por conta própria","o prisioneiro precisa já conhecer os novos significados antes de ser capturado","usa-se apenas a sugestão hipnótica, repetida dia após dia até virar uma crença verdadeira","reforçam-se os significados antigos até que ele os abandone por puro cansaço"],"a":0,"e":"Isolamento, cansaço, fome e abandono tornam os novos interlocutores **significativos**. A ironia de Terwilliger: a defesa seria ensinar o soldado a **pensar**."},{"s":"linguagem","q":"Sobre a produção da ideologia, Lane afirma que ela:","o":["não é consciente: decorre da posição de quem domina e precisa justificar a dominação","é planejada de propósito pelos intelectuais e pela mídia a serviço da classe dominante","nasce da experiência concreta da classe trabalhadora no processo de produção","é sempre consciente e intencional, uma mentira contada para enganar o povo","só existe em regimes autoritários, onde a censura controla a linguagem"],"a":0,"e":"“Obviamente esta produção da ideologia não se dá conscientemente.” Ela vem da **posição** de quem domina."},{"s":"brasil","q":"Para Lane, quem é “considerado por muitos o fundador da Psicologia Social”, e qual pergunta ele propunha?","o":["Comte: como pode o indivíduo ser, ao mesmo tempo, causa e consequência da sociedade?","Wundt: como pode o indivíduo ser, ao mesmo tempo, causa e consequência da sociedade?","Comte: como estudar cientificamente a experiência imediata da consciência individual?","Allport: existe uma psicologia dos grupos que não se reduza à dos indivíduos?","Lewin: como mudar as atitudes coletivas de um grupo por meio da pesquisa-ação?"],"a":0,"e":"**Comte** (1830-1834) via a PS como subproduto da Sociologia e da Moral. Lane brinca que o Brasil voltou à “estaca zero, igual a Comte”."},{"s":"brasil","q":"Sobre os congressos interamericanos citados por Lane:","o":["Miami (1976) denunciou a crise sem propor; Lima (1979) trouxe críticas e propostas","Lima (1976) trouxe as propostas; Miami (1979) ficou apenas nas críticas à PS","Miami (1976) trouxe propostas concretas; Lima (1979) só repetiu as críticas","em Miami (1976) foi fundada a Abrapso, com Silvia Lane como primeira presidente","em Lima (1979) decidiu-se que a América Latina deveria seguir o modelo norte-americano"],"a":0,"e":"**Miami murmura** (critica), **Lima lança** (propõe). Em Lima, México, Peru e Brasil apresentaram “três visões, uma só perspectiva”."},{"s":"brasil","q":"A “crise da Psicologia Social” descrita por Lane consistiu em:","o":["pesquisas contraditórias e o fracasso de acumular dados para depois teorizar","falta de pesquisas empíricas, porque a PS só produzia teorias especulativas","excesso de teorias marxistas nas universidades dos EUA, que afastaram a pesquisa","falta de psicólogos sociais para atender à demanda crescente da indústria","proibição de experimentos com seres humanos depois dos estudos de obediência"],"a":0,"e":"Um estudo achava relação positiva, outro negativa, outro nenhuma. Os problemas sociais continuavam e a PS não explicava nada."},{"s":"brasil","q":"No fim dos anos 60, as críticas mais incisivas à PS norte-americana vieram:","o":["da Europa, sobretudo França e Inglaterra, denunciando seu caráter ideológico","da América Latina, no congresso de Miami, denunciando seu caráter ideológico","dos próprios EUA, que acusavam a PS de excesso de teoria e pouca pesquisa","da URSS, que acusava a PS norte-americana de falta de rigor matemático","do Brasil, com a Abrapso, que pedia mais experimentos de laboratório"],"a":0,"e":"França e Inglaterra denunciaram o **caráter ideológico** da PS americana, “mantenedora das relações sociais”."},{"s":"brasil","q":"Otto Klineberg é lembrado por Lane porque:","o":["levou a PS à USP nos anos 50, e seu livro foi o primeiro de PS publicado no Brasil","fundou a Abrapso em 1980, com base no materialismo histórico-dialético","organizou o simpósio de Lima em 1979, que reuniu México, Peru e Brasil numa só perspectiva","criou os primeiros cursos de Psicologia do Brasil, regulamentados em 1962","escreveu “Psicologia social: o homem em movimento”, marco da PS crítica brasileira"],"a":0,"e":"O livro trazia temas como Cultura e Personalidade, Atitudes e Opiniões, Dinâmica de Grupo. “O homem em movimento” é de **Lane e Codo (1984)**."},{"s":"brasil","q":"Segundo o documento que propôs a Abrapso, a ação do psicólogo social brasileiro se restringia a três campos:","o":["universidade, indústria e manipulação da opinião pública","universidade, clínica e escola, como nas outras áreas da Psicologia","indústria, hospital e comunidades de baixa renda","universidade, comunidade e sindicatos de trabalhadores","escola, indústria e órgãos de planejamento do Estado"],"a":0,"e":"Universidade (isolamento), indústria (seleção e **ajustamento**) e opinião pública (a serviço dos interesses dominantes)."},{"s":"brasil","q":"Para Lane, a Psicologia Social norte-americana do pós-guerra:","o":["explicava o comportamento por causas internas, com a sociedade como pano de fundo","buscava transformar a sociedade, estudando as relações de classe e de poder entre grupos","estudava fenômenos coletivos irredutíveis ao indivíduo, como propunha Durkheim","rejeitava a intervenção prática e se limitava ao laboratório universitário","nasceu na América Latina e foi depois exportada para os Estados Unidos"],"a":0,"e":"Traços, atitudes, motivos ou instintos: **dicotomia indivíduo x sociedade**, buscando **ajustar** o indivíduo."},{"s":"historia","q":"O “repúdio positivista de Wundt” (Danziger, 1979) é:","o":["o recorte que guardou o Wundt do laboratório e apagou o resto da obra dele","a recusa do próprio Wundt ao positivismo de Comte e a toda a sociologia francesa","o abandono da introspecção wundtiana pelos behavioristas americanos","a crítica de Wundt ao behaviorismo social de Mead, feita em Leipzig","a rejeição da Gestalt pelos psicólogos americanos depois da guerra"],"a":0,"e":"Historiadores positivistas aproveitaram o que interessava (o laboratório de 1879) e jogaram fora a **Völkerpsychologie**."},{"s":"historia","q":"A frase “o longo passado e a curta história da psicologia” é de:","o":["Ebbinghaus (1908)","Danziger (1979)","Farr (1996)","Allport (1954)","Lindzey (1954)"],"a":0,"e":"**Ebbinghaus**: a curta história começaria com Wundt em 1879. Danziger é o do “repúdio positivista”; Farr, o da história por instituições."},{"s":"historia","q":"Bernardes adota a perspectiva de Farr (1996), que conta a história da PS:","o":["por fatos e instituições, como guerras, universidades e pesquisas","pelas grandes ideias e escolas de pensamento, em ordem cronológica","pela biografia dos autores clássicos citados nos Handbooks norte-americanos","pelo progresso do método experimental, do laboratório até o campo","pela vida e pela obra de Wundt, o fundador da psicologia científica"],"a":0,"e":"A forma “por autores e ideias” é a **positivista** (Allport, Schultz e Schultz). Farr privilegia **fatos e instituições**."},{"s":"historia","q":"Qual associação está correta segundo Bernardes?","o":["Yale: comunicação e mudança de atitude; MIT: dinâmica de grupo, com Lewin","Yale: dinâmica de grupo, com Lewin; MIT: comunicação e mudança de atitude","Yale: personalidade autoritária, com Adorno; MIT: interacionismo simbólico","Leipzig: The American Soldier; Michigan: Völkerpsychologie de Wundt","Harvard: Handbook de 1954; Frankfurt: mudança de atitude, com Hovland"],"a":0,"e":"Yale: Stouffer e **Hovland**. MIT: **Lewin, 1945**; depois o centro vai para Michigan com Cartwright."},{"s":"historia","q":"Segundo Farr, são exemplos de formas SOCIOLÓGICAS de psicologia social:","o":["as Representações Sociais de Moscovici e o behaviorismo social de Mead","o behaviorismo de Watson e a Gestalt, que estudam a percepção social","a psicologia cognitiva de tratamento de informação e a de Allport","a psicologia social de Allport e as pesquisas de opinião pública","a psicologia social do Handbook de Lindzey e os testes de personalidade"],"a":0,"e":"Formas **psicológicas** reduzem o social ao indivíduo (behaviorismo, Gestalt, cognitivismo, Allport). As **sociológicas** relacionam individual e coletivo."},{"s":"historia","q":"O termo “interacionismo simbólico”:","o":["foi o nome que Blumer deu aos estudos de Mead, depois da morte dele","foi criado pelo próprio Mead em 1934, no livro Mente, self e sociedade","designa a Völkerpsychologie de Wundt, quando traduzida nos EUA","é uma corrente da Escola de Frankfurt, ligada a Adorno e Horkheimer","foi proposto por Allport no Handbook, para nomear a psicologia de grupo"],"a":0,"e":"Mead morreu em 1931; **Blumer** batizou seus estudos. Bernardes diz que nos EUA há “certa confusão” entre Mead e o interacionismo."},{"s":"historia","q":"Sobre as associações latino-americanas, Bernardes afirma que:","o":["a Alapso seguiu a PS norte-americana, e Avepso e Abrapso surgiram como reação","a Abrapso surgiu nos anos 60, e a Alapso foi criada em 1980 como reação crítica a ela","Silvia Lane fundou a Alapso, e a Abrapso foi criada por Aroldo Rodrigues","a Avepso é a associação brasileira, criada para seguir o modelo americano","a Abrapso defendia importar os métodos norte-americanos de laboratório"],"a":0,"e":"Para Bernardes, **Aroldo Rodrigues e J. Varela** levaram a Alapso ao extremo da PS norte-americana. A Abrapso surge em **1980**, com **Silvia Lane**, de base materialista histórico-dialética. A Avepso é venezuelana."},{"s":"historia","q":"A ordem dos três objetivos de Wundt é:","o":["psicologia experimental; metafísica científica; psicologia social","psicologia social; psicologia experimental; metafísica científica","metafísica científica; psicologia experimental; psicologia social","psicologia experimental; psicologia social; metafísica científica","psicologia social; metafísica científica; psicologia experimental"],"a":0,"e":"Laboratório (1879) → Lógica, Ética e Sistemas Filosóficos (1880-1900) → Völkerpsychologie (1900-1920)."},{"s":"atitudes","q":"Segundo o texto, atitude social é:","o":["organização duradoura de crenças com carga afetiva pró ou contra um objeto social, predispondo à ação","qualquer comportamento observável que a pessoa emite diante de um objeto social, sem carga afetiva","crença neutra e duradoura sobre fatos sociais, que descreve o objeto sem avaliá-lo nem predispor à ação","meta geral e trans-situacional, que serve de princípio-guia na vida da pessoa e varia em importância","norma imposta pelo grupo, que a pessoa cumpre só na presença dos outros, sem nenhuma mudança interna"],"a":0,"e":"Cognitivo + afetivo + predisposição à ação. “Meta trans-situacional” é a definição de **valor** em Schwartz."},{"s":"atitudes","q":"Para Fishbein:","o":["só o componente afetivo é característico da atitude; crenças e ações servem para medi-la","só o componente cognitivo é característico; afeto e comportamento são consequências dele","atitude e comportamento são a mesma coisa, por isso basta observar o que a pessoa faz","os três componentes têm o mesmo peso, e nenhum é mais característico que os outros","o componente comportamental é o principal, porque é o único que pode ser observado"],"a":0,"e":"Por isso, na **Ação Racional**, Fishbein e Ajzen reservam o termo atitude ao aspecto **afetivo**."},{"s":"atitudes","q":"No experimento de Rosenberg (1960), a hipnose foi usada para:","o":["mudar um componente (cognitivo ou afetivo) e ver o outro mudar junto, por coerência","eliminar as atitudes dos participantes e verificar se elas voltavam sozinhas","provar que as atitudes não têm componente afetivo, só cognitivo e comportamental","medir o componente comportamental sem a interferência da desejabilidade social","criar dissonância por aquiescência forçada, como Festinger e Carlsmith fariam depois"],"a":0,"e":"Mudado o cognitivo, o afeto acompanhou; mudado o afeto, a cognição acompanhou: **congruência afetivo-cognitiva**."},{"s":"atitudes","q":"Ana gosta de Bruno. Ana é contra a pena de morte. Bruno é a favor. Pela Teoria do Equilíbrio de Heider, a tríade é:","o":["desequilibrada, porque tem um número ímpar (um) de sinais negativos","equilibrada, porque tem apenas um sinal negativo entre as três relações","equilibrada, porque Ana gosta de Bruno, e o afeto prevalece sobre a opinião","desequilibrada, porque tem dois sinais negativos, um número par de discordâncias","equilibrada, porque relações de amizade são sempre equilibradas para Heider"],"a":0,"e":"Sinais: Ana-Bruno (+), Ana-pena (−), Bruno-pena (+). **Um** negativo: desequilíbrio e tensão."},{"s":"atitudes","q":"Carlos não gosta de Diego; Carlos é a favor do socialismo; Diego é contra. Segundo Rodrigues (1985), essa tríade:","o":["equilibrada, mas pode ser julgada desagradável, pelas forças da concordância","desequilibrada e desagradável, porque Carlos não gosta de Diego e discorda dele","equilibrada e sempre agradável, porque o equilíbrio é a única força que atua","desequilibrada, mas agradável, porque os dois discordam de forma coerente","impossível de analisar, porque Heider só trata de tríades com sinais positivos"],"a":0,"e":"Dois negativos = **equilíbrio**. Mas, julgada pela **agradabilidade**, pesa a **concordância**, e a discordância desagrada."},{"s":"atitudes","q":"No experimento de Festinger e Carlsmith (1959):","o":["quem recebeu US$ 1 passou a achar a tarefa chata mais interessante que quem recebeu US$ 20","quem recebeu US$ 20 passou a achar a tarefa mais interessante, por causa do incentivo maior","os dois grupos pagos acharam a tarefa igualmente interessante, acima do grupo de controle","o grupo de controle avaliou a tarefa melhor que os dois grupos que receberam dinheiro","ninguém aceitou mentir para o participante seguinte, e o experimento foi anulado"],"a":0,"e":"Pouca recompensa = **pouca justificativa externa** = mais dissonância = mais mudança interna. US$ 20 ficou igual ao controle."},{"s":"atitudes","q":"Linder, Cooper e Jones (1967) resolveram a controvérsia sobre incentivo e mudança de atitude mostrando que:","o":["com escolha, mais incentivo gera menos mudança; sem escolha, mais incentivo gera mais","sem escolha, mais incentivo gera menos mudança; com escolha, mais incentivo gera mais","o incentivo nunca afeta a mudança de atitude, com ou sem liberdade de escolha","a liberdade de escolha só importa na exposição seletiva, e não na mudança de atitude","a Teoria do Incentivo vale sempre: quanto maior o pagamento, maior a mudança"],"a":0,"e":"Com escolha, vale a **dissonância**; sem escolha, vale o **incentivo** (Janis e Gilmore)."},{"s":"atitudes","q":"Estudantes que passaram por um teste embaraçoso para entrar num grupo de discussão sobre sexo avaliaram a discussão, que era chata, como mais interessante. Isso é dissonância por:","o":["justificação insuficiente (Aronson e Mills, 1959)","aquiescência forçada (Festinger e Carlsmith, 1959)","decisão entre alternativas (Brehm, 1956)","exposição seletiva à informação (Freedman e Sears, 1965)","reatância psicológica (Brehm)"],"a":0,"e":"O esforço foi grande e o prêmio fraco: para aliviar a dissonância, a pessoa **distorce** o valor do que conseguiu."},{"s":"atitudes","q":"Para Triandis (1971), os resultados de La Piere (1934) mostram que:","o":["o comportamento depende também de normas, hábitos, consequências e da situação","não existe nenhuma relação entre atitude e comportamento, apenas entre crenças","as atitudes são inúteis para prever o comportamento e devem ser abandonadas","os donos de hotel mentiram na carta por medo de serem punidos pelo governo","os questionários medem atitudes melhor do que a observação direta do comportamento"],"a":0,"e":"“Seria ingênuo” concluir que não há relação. Há atitude também em relação **à situação** (casal bem-vestido, com um americano, pagando)."},{"s":"atitudes","q":"No estudo de Sivacek e Crano (1982), sobre elevar de 18 para 21 anos a idade para beber:","o":["os mais afetados (média de 18,5 anos) fizeram mais telefonemas: peso do interesse investido","o grupo de 21,6 anos, já livre da lei, fez mais telefonemas por solidariedade aos mais novos","todos os grupos fizeram o mesmo número de telefonemas, pois tinham a mesma atitude","a atitude contra a lei não teve relação nenhuma com a idade nem com o interesse","o estudo mostrou que atitudes não preveem comportamento quando há custo envolvido"],"a":0,"e":"8,97 x 3,77 x 1,25 telefonemas. Quanto **maior o interesse investido**, maior a coerência atitude-comportamento."},{"s":"atitudes","q":"Na Teoria da Ação Racional, a intenção de comportamento é função de:","o":["atitude em relação ao comportamento e norma subjetiva, com pesos empíricos","valores gerais da pessoa e traços estáveis de personalidade, com pesos iguais","dissonância cognitiva e reatância psicológica diante da norma do grupo","recompensa esperada e coerção percebida, como nas bases de poder de French e Raven","componente cognitivo e componente comportamental, excluindo o afetivo"],"a":0,"e":"IC = P1·A + P2·NS. Depois foram acrescentados **obrigação moral** e **controle** percebido."},{"s":"atitudes","q":"Na teoria de valores de Schwartz, os polos opostos das duas dimensões são:","o":["abertura à mudança x conservação; autotranscendência x autopromoção","abertura à mudança x autopromoção; conservação x autotranscendência","hedonismo x tradição; poder x segurança; estimulação x conformidade","benevolência x universalismo; poder x realização","estimulação x autodireção; conformidade x tradição"],"a":0,"e":"Abertura (autodireção, estimulação) x conservação (segurança, conformidade, tradição); autotranscendência (benevolência, universalismo) x autopromoção (poder, realização)."},{"s":"influencia","q":"Nos experimentos de Asch:","o":["33% das respostas seguiram a maioria; um só dissidente quebrava a pressão","quase todos os participantes viam mesmo a linha errada, por pressão perceptiva","a conformidade crescia sem limite: quanto maior o grupo de cúmplices, maior a pressão","o estímulo era ambíguo, como no efeito autocinético, e as normas convergiam","62% dos participantes seguiram a maioria errada até a última rodada do teste"],"a":0,"e":"Estímulo **nítido**. Os 62% são de **Milgram**; o estímulo ambíguo é o de **Sherif**."},{"s":"influencia","q":"Um participante de Asch percebia que a maioria estava errada, mas concordava por não ter coragem de se opor. Ele apresentava:","o":["distorção da ação","distorção do julgamento","distorção da percepção","internalização","identificação"],"a":0,"e":"**Julgamento**: achava que o problema era com ele. **Percepção**: via mesmo a linha errada (rara)."},{"s":"influencia","q":"Qual a diferença central entre os estudos de Sherif e de Asch?","o":["Sherif usou um estímulo ambíguo (efeito autocinético); Asch, um estímulo nítido","Asch usou um estímulo ambíguo (linhas parecidas); Sherif, um ponto de luz nítido","Sherif estudou a obediência à autoridade; Asch, a influência das minorias","Sherif usou choques elétricos; Asch, pontos de luz numa sala escura","Sherif estudou a formação de atitudes; Asch, a hierarquia de valores"],"a":0,"e":"Diante do ambíguo, seguir os outros é até prudente. Diante do óbvio, o conformismo de Asch é surpreendente."},{"s":"influencia","q":"Sobre Milgram (1965), conforme o capítulo:","o":["psiquiatras previram 1% até os 450 volts; foram 62%, e a vítima perto reduzia a obediência","psiquiatras previram 50% até os 450 volts; foram 65%, e a vítima perto aumentava a obediência","psiquiatras previram 62% até os 450 volts; foram só 1%, porque a vítima ficava na mesma sala","o status do experimentador não fazia diferença, nem a distância até a vítima","nenhuma réplica, nem a de Munique, encontrou resultado parecido com o original"],"a":0,"e":"Em Munique a obediência chegou a **85%**; com avaliações negativas no lugar de choques, mais de **90%**."},{"s":"influencia","q":"Pedro dirige a 80 km/h porque acredita que assim é mais seguro. Para Kelman (1958), isso é:","o":["internalização","complacência","identificação","reatância","distorção da ação"],"a":0,"e":"Medo de multa = **complacência**; imitar o pai = **identificação**; achar justo = **internalização**, a mais duradoura."},{"s":"influencia","q":"No capítulo de Influência social, segundo Moscovici, a minoria influencia:","o":["pelo estilo consistente e persistente, com mais aceitação privada que pública","pelo número crescente de apoiadores, com mais aceitação pública que privada","pelo poder que detém, gerando obediência pública imediata, sem mudança interna","pela simpatia que desperta, gerando identificação duradoura com os seus membros","pela coerção, porque a minoria só influencia quando consegue ameaçar a maioria"],"a":0,"e":"A maioria tem o **número**; a minoria, o **estilo**. Maas e Clark: quem respondeu anonimamente seguiu mais a minoria."},{"s":"influencia","q":"Pelo livro, o vendedor que consegue o “sim” do cliente e só depois revela custos adicionais usa a tática:","o":["bola baixa","pé na porta","porta na cara","isso não é tudo","contraste perceptivo"],"a":0,"e":"Como o experimento marcado para as **7 da manhã** (Cialdini, 1978). No livro, **pé na porta** é o brinde ou atrativo para conseguir ser ouvido."},{"s":"influencia","q":"Você toma o remédio que o médico especialista receitou, mesmo sem entender por quê. A base de poder é:","o":["conhecimento","informação","legitimidade","referência","recompensa"],"a":0,"e":"No **conhecimento**, vale a competência reconhecida; na **informação**, seria o argumento que convenceu, independente de quem falou."},{"s":"influencia","q":"Segundo Raven (1965), a influência dependente e pública:","o":["vem da recompensa e da coerção e só dura sob vigilância, sem mudança interna","vem da informação, muda a cognição da pessoa e dura mesmo sem nenhuma vigilância","vem da legitimidade, da referência e do conhecimento e dura sem vigilância","é a mais duradoura de todas, porque a pessoa passa a concordar de verdade","não depende de quem influencia, só do conteúdo da mensagem transmitida"],"a":0,"e":"Por isso, na aquiescência forçada, a recompensa grande gera só obediência **pública**."},{"s":"influencia","q":"Pela análise atribuicional de Rodrigues (1995), quem comete uma transgressão por recompensa, informação ou referência, comparado a quem age por coerção, legitimidade ou conhecimento, é visto como:","o":["mais responsável, porque o ato parece mais interno e controlável","menos responsável, porque foi convencido por argumentos de outra pessoa","igualmente responsável, porque a base de poder não altera a culpa","inocente, desde que o resultado da transgressão tenha sido positivo","menos responsável, porque recompensa e referência são pressões externas"],"a":0,"e":"Grupo 1 (**RIR**) = escolha sua. Grupo 2 (**CLC**) = ordem de fora; daí a desculpa dos crimes de obediência."},{"s":"influencia","q":"Na tecnologia social aplicada ao caso Rosa (Varela), a estratégia foi:","o":["impor o oposto do desejado, provocando reatância e dissonância a favor da mudança","punir o uso de drogas com a perda de privilégios em casa até que ela parasse de vez","convencer a família a aceitar o estilo de vida dela, reduzindo o conflito em casa","aplicar apenas a Teoria do Equilíbrio de Heider, aproximando-a dos pais","afastá-la da pintura para que ela pudesse se concentrar só no tratamento"],"a":0,"e":"O foco foi **voltar a pintar**, não parar as drogas. Combinou Lewin, Hovland e Sherif, Likert, Festinger e Brehm."},{"s":"historia","q":"William James comparou o uso do método experimental-introspectivo para estudar processos psíquicos superiores a:","o":["acender uma luz para ver melhor a escuridão","procurar uma agulha num palheiro de olhos vendados","medir toda a água do mar usando apenas um copo","contar as estrelas do céu em pleno meio-dia","pesar a própria sombra numa balança de feira"],"a":0,"e":"A comparação aparece em Bernardes. O próprio Wundt reconheceu que a consciência individual não explica fenômenos coletivos."},{"s":"minorias","q":"Para Lewin (em Mailhiot), uma minoria psicológica é:","o":["o grupo que depende da boa vontade de outro, seja qual for o seu tamanho","o grupo que reúne menos da metade da população de um país ou região","o grupo que se autodetermina, mesmo sendo numericamente pequeno e sem poder","o grupo que escolheu se isolar da maioria para preservar suas tradições","o grupo com religião ou origem étnica diferente da maioria da população"],"a":0,"e":"O critério é a **tutela**, não a porcentagem. Quem se autodetermina é **maioria** psicológica."},{"s":"minorias","q":"Num país, 80% da população não decide nada e um grupo de 5% controla tudo. Pela teoria de Lewin:","o":["os 80% têm psicologia de minoria; os 5% são uma minoria privilegiada","os 80% são maioria psicológica, porque são muito mais numerosos que os 5%","os 5% são minoria psicológica, porque são poucos diante dos outros 80%","não há minoria psicológica nesse caso, apenas uma minoria demográfica","os 80% vivem em emancipação, porque podem se rebelar quando quiserem"],"a":0,"e":"**Minoria privilegiada** = minoria demográfica dentro de uma maioria psicológica, que a controla e manipula."},{"s":"minorias","q":"Para Lewin, o ódio de si (self-hatred):","o":["é sociopsicológico: nasce da discriminação e some com a igualdade de direitos","é um instinto, ligado à pulsão de morte, como sustentavam Lessing e Levisohn","é uma neurose que só aparece em pessoas cuja personalidade já era doente antes","depende só da estrutura da personalidade, e não da situação do grupo","é exclusivo dos judeus alemães, sem paralelo em outras minorias"],"a":0,"e":"Lewin recusa o instinto: se fosse, apareceria igual entre ingleses e franceses. Tem traços neuróticos, mas **não é neurose**."},{"s":"minorias","q":"Sobre o futuro das minorias, Lewin conclui que:","o":["só a emancipação total, uma atitude adulta, garante a sobrevivência","a integração é o caminho mais seguro, porque aproxima a minoria da maioria","a assimilação é a atitude adulta, e a emancipação é uma fuga adolescente","as três atitudes têm a mesma chance de garantir a sobrevivência do grupo","a minoria deve esconder sua identidade até conquistar a igualdade de direitos"],"a":0,"e":"Assimilação e integração são atitudes **adolescentes**: a minoria que tenta se **integrar** “se engana” e acaba **assimilada**. Emancipar = atitude **adulta**."},{"s":"minorias","q":"Sobre a estrutura de uma minoria, é correto afirmar que:","o":["os líderes costumam sair da periferia, junto dos marginais e dos bem-sucedidos","os líderes vêm sempre do centro, onde está a identificação positiva com as tradições","a periferia é formada pelos membros mais apegados às tradições do grupo","o centro é ambivalente e quer passar para a maioria assim que puder","centro e periferia têm o mesmo peso na escolha dos líderes do grupo"],"a":0,"e":"Centro = identificação positiva com as tradições. **Periferia** = marginais, sucesso, **líderes**."},{"s":"minorias","q":"Qual destes NÃO é um dos princípios de Lewin para educar a criança de um grupo minoritário?","o":["Esconder da criança, até a adolescência, que seu grupo é discriminado","Contar cedo que o grupo é discriminado, como se faz com a criança adotada","Mostrar que a questão é social e parar de exigir conduta exemplar","Mostrar que o que une o grupo é a interdependência do destino","Evitar que ela se torne um marginal, um “eterno adolescente”"],"a":0,"e":"É o contrário: contar **cedo**. Quanto mais tarde, pior a adaptação."},{"s":"minorias","q":"Para Lewin, o fator constitutivo de todo grupo é:","o":["a interdependência do destino dos membros","a semelhança de valores entre os membros","a presença de um líder reconhecido por todos","o número mínimo de pessoas em interação direta","a mesma origem étnica ou religiosa dos membros"],"a":0,"e":"O que faz um grupo é a **sorte ligada**. Na minoria integrada, a condição é aceita; na não integrada, suportada."},{"s":"grupos","q":"Lewin prefere a pesquisa de campo ao laboratório porque:","o":["fenômenos de grupo só se entendem na sociedade real, ligados à sociedade global","o laboratório é caro demais e exige equipamentos que as universidades não têm","no campo o pesquisador fica neutro e de fora, observando o grupo sem interferir nele","a pesquisa de campo dispensa a teoria e parte direto da observação dos fatos","o laboratório não permite medir variáveis, só descrever os comportamentos"],"a":0,"e":"Para Lewin o laboratório é **artificial**. E no campo o pesquisador é **participante e observador**, não neutro."},{"s":"grupos","q":"Os “átomos sociais radioativos” de Lewin são:","o":["pesquisadores treinados que entram no grupo, provocam mudanças e observam de dentro","membros problemáticos que desestruturam o grupo e espalham conflitos entre os outros","líderes autoritários que impõem mudanças ao grupo sem consultar os membros","indivíduos isolados que não pertencem a nenhum grupo e por isso são instáveis","conformistas que resistem a toda mudança e contaminam o grupo com a inércia"],"a":0,"e":"São treinados nos **grupos-testemunha**. A imagem: como um átomo radioativo, eles “contaminam” o grupo de mudança."},{"s":"grupos","q":"Psicodrama, sociodrama e sociometria são de:","o":["Moreno, cuja preocupação central era a socialização","Lewin, cuja preocupação central era o campo social","Moscovici, como técnicas de estudo das representações","Berger e Luckmann, como etapas da socialização secundária","Mead, como métodos do seu behaviorismo social"],"a":0,"e":"Lewin desloca o foco para as **atitudes coletivas** e a dinâmica do grupo."},{"s":"grupos","q":"Lewin adota a explicação galileana porque ela:","o":["explica o comportamento pelas interações entre os elementos naquele momento","explica cada elemento pela sua natureza própria e pela sua origem histórica","separa a pessoa do meio, como faziam os behavioristas no laboratório","estuda cada elemento isolado em laboratório, para controlar as variáveis","busca a essência fixa de cada indivíduo, independente da situação em que está"],"a":0,"e":"A explicação **aristotélica** (natureza de cada coisa) é a que Lewin rejeita."},{"s":"grupos","q":"Sobre os conceitos de Lewin, assinale a correta:","o":["todo grupo é uma totalidade dinâmica, mas nem toda totalidade dinâmica é grupo","toda totalidade dinâmica é um grupo, mas nem todo grupo é totalidade dinâmica","o eu público é o núcleo da personalidade e quase nunca muda de tamanho","o campo social é a soma dos indivíduos que dele fazem parte num momento","a personalidade não é uma totalidade dinâmica; só o grupo pode ser"],"a":0,"e":"A personalidade também é totalidade dinâmica. O núcleo é o **eu íntimo**; o eu social **encolhe ou dilata**."},{"s":"grupos","q":"As 3 etapas da pesquisa-ação são, em ordem:","o":["analisar as percepções do grupo; prever sua evolução; prever os novos comportamentos","prever os comportamentos; analisar as percepções do grupo; intervir com o líder","intervir no grupo; avaliar os resultados da intervenção; publicar os dados para a comunidade","observar o grupo de fora; medir as variáveis; comparar os dados com o laboratório","formar o grupo-testemunha; isolar as variáveis do grupo; testar as hipóteses"],"a":0,"e":"**A-P-P**: analisar as percepções, prever a evolução, prever os novos comportamentos. Para Lewin, pesquisar é **agir socialmente**. Condições: pequenos grupos reais e grupos-testemunha aceitos como membros."},{"s":"grupos","q":"Para Lewin, o fator decisivo para mudar as atitudes coletivas de um grupo é:","o":["o clima de grupo, definido pelo tipo de autoridade exercida","a vontade individual de cada membro de mudar de opinião","o número de membros e a frequência das reuniões do grupo","a informação técnica dada por especialistas de fora do grupo","a coerção aplicada aos membros que resistem à mudança"],"a":0,"e":"Mudar atitudes coletivas = introduzir um **novo estilo de autoridade**."},{"s":"socializacao","q":"Associe os três momentos da dialética de Berger e Luckmann: “a sociedade é um produto humano”, “a sociedade é uma realidade objetiva” e “o homem é um produto social” correspondem a:","o":["exteriorização, objetivação e interiorização","interiorização, objetivação e exteriorização","objetivação, exteriorização e interiorização","exteriorização, interiorização e objetivação","interiorização, exteriorização e objetivação"],"a":0,"e":"**Ex-Ob-In**: sai de mim, vira coisa, volta para dentro. O cap. 3 trata da **interiorização**."},{"s":"socializacao","q":"Na socialização primária:","o":["os outros significativos são impostos e há forte carga emoci
